<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>碰撞圖表素材</title><style>
:root{--ink:#263746;--muted:#687783;--line:#dce4e8;--blue:#0878d1}*{box-sizing:border-box}body{margin:0;padding:40px 24px;color:var(--ink);background:#f4f7f6;font:15px/1.6 "Segoe UI","Noto Sans TC",sans-serif}.material{width:min(1120px,100%);margin:auto}h1{font-size:26px;margin:0 0 6px}.description{margin:0 0 24px;color:var(--muted);font-size:14px}.layout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}.card{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#fff}.head{padding:20px 24px 16px}.head h2{margin:0;font-size:18px}.id{display:block;color:var(--muted);font:12px Consolas,monospace}.stage{margin:0 20px;aspect-ratio:440/260;background:#edf3f5;border-radius:10px}.stage canvas{display:block;width:100%;height:100%}.controls{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:12px 24px;color:var(--muted);font-size:12px}.controls input{width:100%;accent-color:var(--blue)}.footer{padding:16px 24px 20px;border-top:1px solid var(--line)}button{cursor:pointer;font:inherit}.copy{padding:8px 14px;color:#fff;background:var(--blue);border:0;border-radius:7px;font-size:13px}.status{margin-left:12px;color:var(--muted);font-size:12px}details{margin-top:12px}summary{width:fit-content;color:var(--muted);cursor:pointer;font-size:13px}.prompt{display:block;width:100%;height:285px;margin-top:10px;resize:vertical;padding:12px;border:1px solid var(--line);border-radius:8px;background:#f7fafb;color:#334b58;font:12px/1.7 Consolas,"Noto Sans TC",monospace}@media(max-width:700px){body{padding:24px 16px}.layout{grid-template-columns:1fr;gap:20px}}
</style></head><body><main class="material"><header><h1>碰撞圖表素材</h1><p class="description">能量轉換列與有方向的動量向量圖。</p></header><div class="layout">
<!-- MATERIAL_ID: COLLISION-ENERGY-BARS -->
<section class="card"><header class="head"><h2>能量分配列</h2><span class="id">COLLISION-ENERGY-BARS</span></header><div class="stage"><canvas id="energyCanvas" width="440" height="260" aria-label="動能與彈力位能分配圖"></canvas></div><label class="controls" for="compression"><span>彈簧壓縮</span><input id="compression" type="range" min="0" max="100" value="42"><output id="compressionValue">42%</output></label><footer class="footer"><button class="copy" data-prompt="energyPrompt">複製 Prompt</button><span class="status" role="status"></span><details><summary>查看 Prompt</summary><textarea class="prompt" id="energyPrompt" readonly>素材名稱：碰撞能量分配列
素材編號：COLLISION-ENERGY-BARS
素材檔案：material/collision-chart-materials.html
定位標記：MATERIAL_ID: COLLISION-ENERGY-BARS

重用介面：drawEnergyBars(ctx, state, layout)。state 接收 kinetic1、kinetic2、potential、totalEnergy；layout 接收 x、y、width、rowHeight。以共同 totalEnergy 尺度顯示 K₁+K₂ 堆疊列與 U 列，各列背景是總能量的 100%，百分比標籤須放在條外右側，避免覆蓋填色。能量分段色固定區分 K₁、K₂。

與碰撞動畫組合時，將各物體動能及彈簧位能從同一幀的物理狀態傳入。彈簧位能不得為負、列寬不得超過總尺度，動能分段不得混成無法辨認的單色。零值不繪製假填色。此頁滑桿以 U=E·q² 示範彈簧位能隨壓縮量平方增加，剩餘能量分配給 K₁/K₂（比例為示範設定，非物理解算）；正式模擬應傳入真實物理量。</textarea></details></footer></section>
<!-- MATERIAL_ID: COLLISION-MOMENTUM-VECTORS -->
<section class="card"><header class="head"><h2>首尾相接動量向量</h2><span class="id">COLLISION-MOMENTUM-VECTORS</span></header><div class="stage"><canvas id="momentumCanvas" width="440" height="260" aria-label="含正負方向的系統與分量動量向量"></canvas></div><label class="controls" for="momentumSlider"><span>p₂ 方向與大小</span><input id="momentumSlider" type="range" min="-100" max="100" value="35"><output id="momentumValue">+35</output></label><footer class="footer"><button class="copy" data-prompt="momentumPrompt">複製 Prompt</button><span class="status" role="status"></span><details><summary>查看 Prompt</summary><textarea class="prompt" id="momentumPrompt" readonly>素材名稱：首尾相接動量向量
素材編號：COLLISION-MOMENTUM-VECTORS
素材檔案：material/collision-chart-materials.html
定位標記：MATERIAL_ID: COLLISION-MOMENTUM-VECTORS

重用介面：drawMomentumVectors(ctx, state, layout)。state 接收 p1、p2（可正可負）；總動量 P=p1+p2。layout 接收 x、y、width、rowGap、pxPerMomentum 固定比例尺。所有箭頭使用傳入的同一 pxPerMomentum，不得除以 totalP 或由當前動量自動正規化；正向向右、負向向左。上列畫總動量，下列從同一原點畫 p₁，並由 p₁ 箭頭端點接續畫 p₂，呈現向量首尾相接。

不得將負動量改成正值或只用箭頭長度表示大小而丟失方向；p=0 時不畫短線或假箭頭，但保留數值標籤。標籤依箭頭長度及方向錯開，避免彼此和原點／端點重疊。物體動量與系統總動量需保留同一尺度，且 P=p₁+p₂。</textarea></details></footer></section></div></main><script>
function drawEnergyBars(ctx,state,layout){const {x,y,width,rowHeight}=layout,total=Math.max(0,Number(state.totalEnergy)||0),v1=Math.max(0,Number(state.kinetic1)||0),v2=Math.max(0,Number(state.kinetic2)||0),u=Math.max(0,Number(state.potential)||0);ctx.save();ctx.font='bold 18px "Segoe UI",sans-serif';ctx.textBaseline='middle';const rows=[{label:'K₁ + K₂',values:[[v1,'#1A5276','K₁'],[v2,'#5DADE2','K₂']],sum:v1+v2},{label:'U',values:[[u,'#333333','U']],sum:u}];rows.forEach((row,i)=>{const yy=y+i*(rowHeight+24),ratio=total?Math.min(1,row.sum/total):0;ctx.textAlign='left';ctx.fillStyle='#263746';ctx.fillText(row.label,x,yy+rowHeight/2);const bx=x+92,bw=width-152;ctx.fillStyle='#eef2f5';ctx.fillRect(bx,yy,bw,rowHeight);let off=0;for(const [value,color,label] of row.values){const part=total?Math.min(Math.max(0,bw-off),value/total*bw):0;if(part>0){ctx.fillStyle=color;ctx.fillRect(bx+off,yy,part,rowHeight);if(part>=30){ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText(label,bx+off+part/2,yy+rowHeight/2);ctx.font='bold 18px "Segoe UI",sans-serif'}off+=part}}ctx.strokeStyle='#87939d';ctx.lineWidth=1;ctx.strokeRect(bx,yy,bw,rowHeight);ctx.fillStyle='#263746';ctx.font='bold 14px sans-serif';ctx.textAlign='left';ctx.fillText(`${Math.round(ratio*100)}%`,bx+bw+9,yy+rowHeight/2)});ctx.fillStyle='#687783';ctx.font='12px sans-serif';ctx.textAlign='left';ctx.fillText(`總能量 ${total.toFixed(0)}（K₁ + K₂ + U）`,x+92,y+2*(rowHeight+24)+5);ctx.restore()}
function drawMomentumVectors(ctx,state,layout){const {x,y,width,rowGap,pxPerMomentum}=layout,p1=Number(state.p1)||0,p2=Number(state.p2)||0,total=p1+p2,origin=x+width/2,half=width*.43,scale=Number(pxPerMomentum);ctx.save();ctx.font='bold 15px "Segoe UI",sans-serif';ctx.textBaseline='middle';const rows=[{name:'P',value:total,yy:y,label:'系統總動量'},{name:'',value:null,yy:y+rowGap,label:''}];function axis(yy){ctx.strokeStyle='#aab6bd';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(origin-half,yy);ctx.lineTo(origin+half,yy);ctx.stroke();ctx.fillStyle='#87939d';ctx.textAlign='center';ctx.font='11px sans-serif';ctx.fillText('−',origin-half,yy+14);ctx.fillText('+',origin+half,yy+14)}function arrow(a,b,yy,color,label,labelOffset=0){const x1=origin+a*scale,x2=origin+b*scale,delta=x2-x1;if(Math.abs(delta)>=.01){const dir=Math.sign(delta);ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x1,yy);ctx.lineTo(x2,yy);ctx.lineTo(x2-dir*9,yy-6);ctx.moveTo(x2,yy);ctx.lineTo(x2-dir*9,yy+6);ctx.stroke()}ctx.font='bold 13px sans-serif';ctx.textAlign='center';const mid=Math.abs(delta)<.01?origin:(x1+x2)/2;ctx.fillText(label,mid,yy+labelOffset)}ctx.textAlign='left';ctx.fillStyle='#263746';ctx.font='bold 16px sans-serif';ctx.fillText('P',x,y);ctx.fillText('p₁ + p₂',x,y+rowGap);axis(rows[0].yy);axis(rows[1].yy);arrow(0,total,rows[0].yy,'#111820',`P = ${total>=0?'+':''}${total}`, -15);arrow(0,p1,rows[1].yy,'#1A5276',`p₁ ${p1>=0?'+':''}${p1}`,-17);arrow(p1,total,rows[1].yy,'#5DADE2',`p₂ ${p2>=0?'+':''}${p2}`,18);ctx.restore()}
function setupCanvas(canvas,draw){const ctx=canvas.getContext('2d');function resize(){const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;if(!rect.width||!rect.height)return;canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(canvas.width/440,0,0,canvas.height/260,0,0);draw(ctx)}new ResizeObserver(resize).observe(canvas);window.addEventListener('resize',resize);resize();return draw}
const compression=document.querySelector('#compression'),compressionValue=document.querySelector('#compressionValue'),energyCanvas=document.querySelector('#energyCanvas');function renderEnergy(ctx){const q=Number(compression.value)/100,total=100,u=total*q*q,k=total-u;ctx.clearRect(0,0,440,260);drawEnergyBars(ctx,{kinetic1:k*.65,kinetic2:k*.35,potential:u,totalEnergy:total},{x:20,y:66,width:400,rowHeight:28});compressionValue.value=`${compression.value}%`;compressionValue.textContent=`${compression.value}%`}const energyDraw=setupCanvas(energyCanvas,ctx=>renderEnergy(ctx));compression.addEventListener('input',()=>energyDraw(energyCanvas.getContext('2d')));
const momentumSlider=document.querySelector('#momentumSlider'),momentumValue=document.querySelector('#momentumValue'),momentumCanvas=document.querySelector('#momentumCanvas');function renderMomentum(ctx){const p1=70,p2=Number(momentumSlider.value);ctx.clearRect(0,0,440,260);drawMomentumVectors(ctx,{p1,p2},{x:20,y:90,width:400,rowGap:76,pxPerMomentum:0.9});momentumValue.value=`${p2>=0?'+':''}${p2}`;momentumValue.textContent=momentumValue.value}const momentumDraw=setupCanvas(momentumCanvas,ctx=>renderMomentum(ctx));momentumSlider.addEventListener('input',()=>momentumDraw(momentumCanvas.getContext('2d')));
document.querySelectorAll('.copy').forEach(button=>button.addEventListener('click',async()=>{const textarea=document.getElementById(button.dataset.prompt),details=textarea.closest('details'),status=button.parentElement.querySelector('.status'),oldOpen=details.open,active=document.activeElement;try{await navigator.clipboard.writeText(textarea.value);status.textContent='已複製'}catch{details.open=true;textarea.focus();textarea.select();let copied=false;try{copied=document.execCommand('copy')}catch{}details.open=oldOpen;active?.focus();status.textContent=copied?'已複製':'複製失敗，請手動選取'}setTimeout(()=>status.textContent='',2200)}));
</script></body></html>
