          btn.className = "toggle-chip px-2.5 py-1.5 rounded-lg border border-slate-700 bg-slate-900/60 text-slate-500 hover:text-slate-300 flex items-center justify-between cursor-pointer";
          if (badge) badge.textContent = "關閉";
        }
      }
    }

    function setStage(newStage) {
      const requestedStage = Math.max(1, Math.min(5, newStage));
      if (reverseMode && stage === 5 && requestedStage === 3) {
        setStage(4);
        return;
      }
      if (Math.abs(userYaw) > 0.001 || Math.abs(userPitch) > 0.001) {
        pendingAction = { type: "stage", stage: requestedStage };
        recenterUserView = true;
        return;
      }
      pendingAction = null;
      const previousStage = stage;
      if (previousStage === 5 && requestedStage === 4 && reverseMode) {
        inverseAzimuthAnchor = targetSideYawOffset;
        inverseAzimuthActive = true;
      }
      stage = requestedStage;
      if (stage !== 1 && previousStage === 1) constellationsEnabled = false;
      if (stage === 1) {
        introStep = 1;
        constellationsEnabled = true;
        setChaseStep(0);
        cutawayStep = 0;
        isEarthTiny = true;
        inverseAzimuthActive = false;
      } else if (stage === 2) {
        constellationsEnabled = true;
        setChaseStep(0, true);
        isEarthTiny = false;
        inverseAzimuthActive = false;
      } else if (stage === 3) {
        constellationsEnabled = false;
        setChaseStep(3);
        if (previousStage < 3) {
          cutawayStep = 1;
          isEarthTiny = false;
        } else if (previousStage === 4 || previousStage === 5) {
          cutawayStep = 6;
          isEarthTiny = false;
        }
      } else if (stage === 4) {
        setChaseStep(3);
        cutawayStep = 6;
      } else if (stage === 5) {
        setChaseStep(3);
        cutawayStep = 6;
        if (previousStage < 4) targetSideYawOffset = currentSideYawOffset;
      }
      syncSlideIndexToCurrentState();
      updateUI();
      updateAzimuthUI();
    }

    function setCutawayStep(step) {
      cutawayStep = Math.max(1, Math.min(6, step));
      if (cutawayStep === 1 || cutawayStep === 6) {
        isEarthTiny = false;
      } else {
        isEarthTiny = true;
      }
      syncSlideIndexToCurrentState();
      updateUI();
    }

    function updateCutawayButtons() {
      for (let i = 1; i <= 6; i++) {
        const btn = document.getElementById(`cutaway-step-${i}`);
        if (!btn) continue;
        btn.className = i === cutawayStep
          ? "cutaway-btn px-2.5 py-1 rounded-lg border border-cyan-400 bg-cyan-500/25 text-cyan-200 font-semibold transition cursor-pointer shadow"
          : "cutaway-btn px-2.5 py-1 rounded-lg border border-slate-700 bg-slate-800/70 text-slate-300 hover:bg-slate-700 transition cursor-pointer";
      }
    }

    function toggleReverseMode() {
      reverseMode = !reverseMode;
      updateReverseModeButton();
    }

    function updateReverseModeButton() {
      const btn = document.getElementById("reverseModeBtn");
      if (!btn) return;
      btn.textContent = reverseMode ? "逆推：開" : "逆推：關";
      btn.className = reverseMode
        ? "glass-panel px-3 py-1.5 rounded-xl border border-violet-300 bg-violet-500/35 text-violet-100 text-xs font-semibold transition cursor-pointer shadow-lg"
        : "glass-panel px-3 py-1.5 rounded-xl border border-violet-500/40 bg-violet-500/15 hover:bg-violet-500/25 text-violet-200 text-xs font-semibold transition cursor-pointer shadow-lg";
    }

    function stepAzimuth(deltaDeg) {
      targetSideYawOffset += deltaDeg;
      if (inverseAzimuthActive) inverseAzimuthAnchor = targetSideYawOffset;
      updateAzimuthUI();
    }

    function getCardinalName(deg) {
      const norm = ((Math.round(deg) % 360) + 360) % 360;
      const dirs = [
        { a: 0, name: "北 (N)" },
        { a: 45, name: "東北 (NE)" },
        { a: 90, name: "東 (E)" },
        { a: 135, name: "東南 (SE)" },
        { a: 180, name: "南 (S)" },
        { a: 225, name: "西南 (SW)" },
        { a: 270, name: "西 (W)" },
        { a: 315, name: "西北 (NW)" }
      ];
      let best = dirs[0], minD = 999;
      dirs.forEach(d => {
        const dist = Math.min(Math.abs(norm - d.a), 360 - Math.abs(norm - d.a));
        if (dist < minD) { minD = dist; best = d; }
      });
      return best.name;
    }

    function updateAzimuthUI() {
      const rightName = getCardinalName(targetSideYawOffset);
      const leftName = getCardinalName(targetSideYawOffset + 180);
      const statusEl = document.getElementById("azimuthStatusText");
      if (statusEl) {
        statusEl.textContent = `左：${leftName} ｜ 右：${rightName}`;
      }
    }

    function updateLatText(lat) {
      const el = document.getElementById("latLabel");
      if (!el) return;
      if (lat === 90) el.textContent = "90° N (北極點)";
      else if (lat === -90) el.textContent = "90° S (南極點)";
      else if (lat === 0) el.textContent = "0° 赤道";
      else if (lat > 0) el.textContent = `${lat}° N`;
      else el.textContent = `${Math.abs(lat)}° S`;
    }

    function updateTailText(val) {
      const el = document.getElementById("tailLabel");
      if (!el) return;
      const twelfths = Math.round(val * 12);
      if (twelfths === 0) el.textContent = "無尾巴";
      else if (twelfths === 12) el.textContent = "1 整圈";
      else if (twelfths === 10) el.textContent = "5/6 圈";
      else if (twelfths === 9) el.textContent = "3/4 圈";
      else if (twelfths === 8) el.textContent = "2/3 圈";
      else if (twelfths === 6) el.textContent = "1/2 圈";
      else if (twelfths === 4) el.textContent = "1/3 圈";
      else if (twelfths === 3) el.textContent = "1/4 圈";
      else el.textContent = `${Math.round(val * 360)}°`;
    }

    function togglePause() {
      isPaused = !isPaused;
      document.getElementById("pauseBtn").textContent = isPaused ? "繼續播放" : "暫停";
    }

    function toggleAssist(key) {
      assists[key] = !assists[key];
      updateAssistButtons();
    }

    function updateAssistButtons() {
      const labels = {
        polarAxis: "貫穿天軸 (N/S)",
        celestialGrid: "天球經緯網格",
        earthAxes: "地球經緯與十字軸",
        cometTrails: "彗星掃尾軌跡",
        angleArcs: "側視仰角幾何弧線"
      };
      for (const [key, label] of Object.entries(labels)) {
        const btn = document.getElementById(`tog-${key}`);
        if (!btn) continue;
        if (assists[key]) {
          btn.className = "toggle-chip px-2 py-1 rounded-md border border-sky-400/50 bg-sky-500/20 text-sky-200 cursor-pointer";
          btn.textContent = `✓ ${label}`;
        } else {
          btn.className = "toggle-chip px-2 py-1 rounded-md border border-slate-700 bg-slate-900/60 text-slate-500 hover:text-slate-300 cursor-pointer";
          btn.textContent = `○ ${label}`;
        }
      }
    }

    function updateUI() {
      for (let i = 1; i <= 5; i++) {
        const btn = document.getElementById(`btn-stage-${i}`);
        if (!btn) continue;
        if (i === stage) {
          btn.className = "stage-btn py-2 px-1.5 rounded-xl text-[11px] sm:text-xs font-semibold bg-slate-100 text-slate-950 shadow transition cursor-pointer";
        } else {
          btn.className = "stage-btn py-2 px-1.5 rounded-xl text-[11px] sm:text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition cursor-pointer";
        }
      }

      const caption = getTeacherCaption();
      document.getElementById("stageBadge").textContent = caption.badge;
      document.getElementById("stageDesc").textContent = caption.desc;

      updateReverseModeButton();
      updateEarthScaleButtonUI();
      updateConstellationButton();

      const prevBtn = document.getElementById("prevSlideBtn");
      const nextBtn = document.getElementById("nextSlideBtn");
      if (prevBtn) {
        prevBtn.style.opacity = currentSlideIndex === 0 ? "0.45" : "1";
      }
      if (nextBtn) {
        nextBtn.style.opacity = currentSlideIndex === SLIDE_SEQUENCE.length - 1 ? "0.45" : "1";
      }

      const scaleSubBar = document.getElementById("scaleSubBar");
      if (scaleSubBar) {
        if (stage === 1) scaleSubBar.classList.remove("hidden");
        else scaleSubBar.classList.add("hidden");
      }

      const chaseSubBar = document.getElementById("chaseSubBar");
      if (chaseSubBar) {
        if (stage === 2) chaseSubBar.classList.remove("hidden");
        else chaseSubBar.classList.add("hidden");
      }

      const cutawaySubBar = document.getElementById("cutawaySubBar");
      if (cutawaySubBar) {
        if (stage === 3) cutawaySubBar.classList.remove("hidden");
        else cutawaySubBar.classList.add("hidden");
      }

      const azimuthSubBar = document.getElementById("azimuthSubBar");
      if (azimuthSubBar) {
        if (stage === 5) azimuthSubBar.classList.remove("hidden");
        else azimuthSubBar.classList.add("hidden");
      }

      updateCutawayButtons();
    }

    // =========================================================================
    // 座標同步程度、緯度控制、鍵盤簡報筆快捷鍵與畫布互動
    // =========================================================================
    function setChaseStep(step, showIntro = false) {
      chaseStep = Math.max(0, Math.min(3, step));
      syncIntro = Boolean(showIntro);
      if (stage === 2 && syncIntro) constellationsEnabled = true;
      targetChaseRatio = CHASE_RATIOS[chaseStep];
      const introBtn = document.getElementById("chase-intro");
      introBtn.className = syncIntro
        ? "chase-btn px-2.5 py-1 rounded-lg border border-amber-400 bg-amber-500/25 text-amber-200 font-semibold transition cursor-pointer shadow"
        : "chase-btn px-2.5 py-1 rounded-lg border border-slate-700 bg-slate-800/70 text-slate-300 hover:bg-slate-700 transition cursor-pointer";
      for (let i = 0; i <= 3; i++) {
        const btn = document.getElementById(`chase-step-${i}`);
        if (!btn) continue;
        btn.className = !syncIntro && i === chaseStep
          ? "chase-btn px-2.5 py-1 rounded-lg border border-amber-400 bg-amber-500/25 text-amber-200 font-semibold transition cursor-pointer shadow"
          : "chase-btn px-2.5 py-1 rounded-lg border border-slate-700 bg-slate-800/70 text-slate-300 hover:bg-slate-700 transition cursor-pointer";
      }
      if (stage === 2) {
        syncSlideIndexToCurrentState();
        updateUI();
      }
    }

    function setLatitude(lat) {
      targetLat = Math.max(-90, Math.min(90, Math.round(lat)));
      const latSlider = document.getElementById("latSlider");
      if (latSlider) latSlider.value = targetLat;
      updateLatText(targetLat);
      updateQuickLatButtons();
    }

    function updateQuickLatButtons() {
      const presets = [90, 35, 0, -35, -90];
      presets.forEach(lat => {
        const btn = document.getElementById(`quick-lat-${lat}`);
        if (!btn) return;
        if (targetLat === lat) {
          btn.className = "quick-lat-btn py-1 px-2 rounded-lg text-[11px] font-semibold bg-sky-500/25 border border-sky-400/50 text-sky-200 transition cursor-pointer";
        } else {
          btn.className = "quick-lat-btn py-1 px-2 rounded-lg text-[11px] font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 border border-transparent transition cursor-pointer";
        }
      });
    }

    function toggleSettingsDrawer() {
      settingsOpen = !settingsOpen;
      const drawer = document.getElementById("settingsDrawer");
      if (drawer) {
        if (settingsOpen) drawer.classList.remove("hidden");
        else drawer.classList.add("hidden");
      }
    }

    function replayCurrentAction() {
      userYaw = 0;
      userPitch = 0;
      recenterUserView = false;
      if (stage === 1) {
        earthAngle = 0;
        skyAngle = 0;
      } else if (stage === 2) {
        zoomInProgress = 0;
        setChaseStep(0, syncIntro);
        currentChaseRatio = 0;
        syncSlideIndexToCurrentState();
      } else if (stage === 3) {
        if (cutawayStep === 1) {
          localZoomProgress = 0;
          centerAnchorProgress = 0;
        } else if (cutawayStep === 2) {
          earthTinyProgress = 0;
          centerAnchorProgress = 0;
        } else if (cutawayStep === 3) {
          zoomOutCutProgress = 0;
        } else if (cutawayStep === 4) {
          planeGrowProgress = 0;
        } else if (cutawayStep === 5) {
          intersectionLineProgress = 0;
        } else {
          earthTinyProgress = 1;
        }
      } else if (stage === 4) {
        levelProgress = 0;
      } else if (stage === 5) {
        sideProfileProgress = 0;
        targetSideYawOffset = 0;
        currentSideYawOffset = 0;
        updateAzimuthUI();
      }
      updateUI();
    }

    // 鍵盤控制：空白鍵（播放/暫停）、方向鍵左右 / PageUp / PageDown（簡報筆上一頁/下一頁）
    window.addEventListener("keydown", (e) => {
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) {
        return;
      }
      if (e.code === "Space" || e.key === " ") {
        e.preventDefault();
        if (document.activeElement && document.activeElement.tagName === "BUTTON") {
          document.activeElement.blur();
        }
        togglePause();
      } else if (e.key === "ArrowRight" || e.key === "PageDown") {
        e.preventDefault();
        nextSlide();
      } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        e.preventDefault();
        prevSlide();
      }
    });

    document.getElementById("latSlider").addEventListener("input", (e) => {
      setLatitude(Number(e.target.value));
    });

    document.getElementById("tailSlider").addEventListener("input", (e) => {
      maxTailFraction = Number(e.target.value);
      updateTailText(maxTailFraction);
    });

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    canvas.addEventListener("mousedown", (e) => {
      isDragging = true;
      dragDist = 0;
      lastMouse = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastMouse.x;
      const dy = e.clientY - lastMouse.y;
      dragDist += Math.hypot(dx, dy);
      lastMouse = { x: e.clientX, y: e.clientY };
      userYaw += dx * 0.0065;
      userPitch = Math.max(-1.1, Math.min(1.1, userPitch + dy * 0.0065));
    });

    window.addEventListener("mouseup", () => {
      if (isDragging && dragDist < 4) {
        uiHidden = !uiHidden;
        const opacity = uiHidden ? "0" : "1";
        const pointer = uiHidden ? "none" : "auto";
        ["topHint", "topRightTools", "controlBar"].forEach(id => {
          const el = document.getElementById(id);
          if (el) {
            el.style.opacity = opacity;
            el.style.pointerEvents = id === "topHint" ? "none" : pointer;
          }
        });
      }
      isDragging = false;
    });

    canvas.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        dragDist = 0;
        lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
    }, { passive: true });

    canvas.addEventListener("touchmove", (e) => {
      if (!isDragging || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - lastMouse.x;
      const dy = e.touches[0].clientY - lastMouse.y;
      dragDist += Math.hypot(dx, dy);
      lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      userYaw += dx * 0.0065;
      userPitch = Math.max(-1.1, Math.min(1.1, userPitch + dy * 0.0065));
    }, { passive: true });

    canvas.addEventListener("touchend", () => {
      isDragging = false;
    });

    // =========================================================================
    // 繪製「北極星方位顯示」連續能量脈衝光束特效
    // =========================================================================
    function drawPolarisSinglePulseBeam(W, H, cx, cy, R_cel, R_earth, obsDir3D, easeTiny, projectFn) {
      if (polarisBeamFade <= 0.01) return;

      const isSouthHemisphereBlocked = currentLat < -0.5;
      const alpha = polarisBeamFade;
      const ncp2D = projectFn({ x: 0, y: R_cel, z: 0 });
      const orig2D = projectFn({ x: 0, y: 0, z: 0 });

      const axisDx = orig2D.sx - ncp2D.sx;
      const axisDy = orig2D.sy - ncp2D.sy;
      const axisLen = Math.hypot(axisDx, axisDy) || 1;
      const dirX = axisDx / axisLen;
      const dirY = axisDy / axisLen;
      const perpX = -dirY;
      const perpY = dirX;

      const obsR = stage === 1 ? R_earth : lerp(R_earth, 0, easeTiny);
      const target3D = isSouthHemisphereBlocked
        ? { x: 0, y: 0, z: 0 }
        : { x: obsDir3D.x * obsR, y: obsDir3D.y * obsR, z: obsDir3D.z * obsR };
      const obsPt2D = projectFn(target3D);

      const farDist = Math.max(W, H) * 1.15;
      const startX = obsPt2D.sx - dirX * farDist;
      const startY = obsPt2D.sy - dirY * farDist;
      const blockOffset = isSouthHemisphereBlocked ? Math.max(R_earth * 0.98, 6) : 0;
      const endX = obsPt2D.sx - dirX * blockOffset;
      const endY = obsPt2D.sy - dirY * blockOffset;
      const beamAlpha = isSouthHemisphereBlocked ? alpha * 0.45 : alpha;

      ctx.save();

      const breath = 0.85 + 0.15 * Math.sin(polarisPulseTime * 4.2);
      const outerGrad = ctx.createLinearGradient(startX, startY, endX, endY);
      outerGrad.addColorStop(0, "rgba(56, 189, 248, 0)");
      outerGrad.addColorStop(0.35, `rgba(56, 189, 248, ${(0.14 * beamAlpha * breath).toFixed(3)})`);
      outerGrad.addColorStop(0.85, `rgba(125, 211, 252, ${(0.32 * beamAlpha * breath).toFixed(3)})`);
      outerGrad.addColorStop(1, `rgba(224, 242, 254, ${(0.45 * beamAlpha * breath).toFixed(3)})`);

      ctx.strokeStyle = outerGrad;
      ctx.lineWidth = 14;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      ctx.stroke();

      const midGrad = ctx.createLinearGradient(startX, startY, endX, endY);
      midGrad.addColorStop(0, "rgba(56, 189, 248, 0)");
      midGrad.addColorStop(0.3, `rgba(125, 211, 252, ${(0.45 * beamAlpha).toFixed(3)})`);
      midGrad.addColorStop(1, `rgba(224, 242, 254, ${(0.88 * beamAlpha).toFixed(3)})`);

      ctx.strokeStyle = midGrad;
      ctx.lineWidth = 4.2;
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      ctx.stroke();

      const coreGrad = ctx.createLinearGradient(startX, startY, endX, endY);
      coreGrad.addColorStop(0, "rgba(255, 255, 255, 0)");
      coreGrad.addColorStop(0.4, `rgba(255, 255, 255, ${(0.65 * beamAlpha).toFixed(3)})`);
      coreGrad.addColorStop(1, `rgba(255, 255, 255, ${(0.98 * beamAlpha).toFixed(3)})`);

      ctx.strokeStyle = coreGrad;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      ctx.stroke();

      const pulseCount = 4;
      const pulseSpeed = 0.55;
      for (let i = 0; i < pulseCount; i++) {
        const phase = (polarisPulseTime * pulseSpeed + i / pulseCount) % 1.0;
        const px = lerp(startX, endX, phase);
        const py = lerp(startY, endY, phase);

        const edgeFade = Math.sin(phase * Math.PI);
        const pAlpha = edgeFade * beamAlpha;
        if (pAlpha <= 0.02) continue;

        const orbR = 14 + edgeFade * 6;
        const orbGrad = ctx.createRadialGradient(px, py, 0, px, py, orbR);
        orbGrad.addColorStop(0, `rgba(255, 255, 255, ${(0.98 * pAlpha).toFixed(3)})`);
        orbGrad.addColorStop(0.35, `rgba(125, 211, 252, ${(0.75 * pAlpha).toFixed(3)})`);
        orbGrad.addColorStop(0.75, `rgba(56, 189, 248, ${(0.25 * pAlpha).toFixed(3)})`);
        orbGrad.addColorStop(1, "rgba(56, 189, 248, 0)");

        ctx.fillStyle = orbGrad;
        ctx.beginPath();
        ctx.arc(px, py, orbR, 0, TWO_PI);
        ctx.fill();

        const wingBack = 16;
        const wingSpread = 6.5;
        ctx.strokeStyle = `rgba(224, 242, 254, ${(0.85 * pAlpha).toFixed(3)})`;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(px - dirX * wingBack + perpX * wingSpread, py - dirY * wingBack + perpY * wingSpread);
        ctx.lineTo(px + dirX * 4, py + dirY * 4);
        ctx.lineTo(px - dirX * wingBack - perpX * wingSpread, py - dirY * wingBack - perpY * wingSpread);
        ctx.stroke();
      }

      if (!isSouthHemisphereBlocked) {
        const impactPhase = (polarisPulseTime * pulseSpeed * pulseCount) % 1.0;
        const rippleR = 6 + impactPhase * 26;
        const rippleAlpha = (1 - impactPhase) * 0.85 * alpha;

        const hitCoreGrad = ctx.createRadialGradient(endX, endY, 0, endX, endY, 18);
        hitCoreGrad.addColorStop(0, `rgba(255, 255, 255, ${(0.95 * alpha).toFixed(3)})`);
        hitCoreGrad.addColorStop(0.45, `rgba(56, 189, 248, ${(0.55 * alpha).toFixed(3)})`);
        hitCoreGrad.addColorStop(1, "rgba(56, 189, 248, 0)");
        ctx.fillStyle = hitCoreGrad;
        ctx.beginPath();
        ctx.arc(endX, endY, 18, 0, TWO_PI);
        ctx.fill();

        ctx.strokeStyle = `rgba(125, 211, 252, ${rippleAlpha.toFixed(3)})`;
        ctx.lineWidth = 2.0 * (1 - impactPhase * 0.5);
        ctx.beginPath();
        ctx.arc(endX, endY, rippleR, 0, TWO_PI);
        ctx.stroke();
      }

      const labelDist = Math.min(farDist * 0.36, R_cel * 0.82);
      const lx = endX - dirX * labelDist + perpX * 22;
      const ly = endY - dirY * labelDist + perpY * 22;
      ctx.globalAlpha = alpha;
      drawCleanText(
        isSouthHemisphereBlocked
          ? "北極星方位（南半球位於地平線下，受地球遮擋無法看見）"
          : "北極星方位（平行於地球自轉軸）",
        Math.max(170, Math.min(W - 170, lx)),
        Math.max(95, Math.min(H - 135, ly)),
        isSouthHemisphereBlocked ? "#fb7185" : "#7dd3fc",
        "bold 12px -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif"
      );

      ctx.restore();
    }

    // =========================================================================
    // 繪製階段 5 側視剖面的「仰角幾何弧線與度數標示」
    // =========================================================================
    function drawStage5ElevationAngles(originProj, R_cel, currentLat, sideProfileProgress, currentSideYawOffset, projectFn) {
      if (!assists.angleArcs || sideProfileProgress < 0.65) return;

      const normYaw = ((Math.round(currentSideYawOffset) % 360) + 360) % 360;
      const isLeftSouthRightNorth = Math.min(normYaw, 360 - normYaw) < 28;
      const isLeftNorthRightSouth = Math.abs(normYaw - 180) < 28;
      if (!isLeftSouthRightNorth && !isLeftNorthRightSouth) return;

      const alpha = Math.min(1, (sideProfileProgress - 0.65) / 0.35);
      const latRad = currentLat * DEG;

      const northHori2D = projectFn({
        x: 0,
        y: R_cel * Math.cos(latRad),
        z: -R_cel * Math.sin(latRad)
      });
      const southHori2D = projectFn({
        x: 0,
        y: -R_cel * Math.cos(latRad),
        z: R_cel * Math.sin(latRad)
      });

      const ncp2D = projectFn({ x: 0, y: R_cel, z: 0 });
      const scp2D = projectFn({ x: 0, y: -R_cel, z: 0 });

      ctx.save();
      ctx.globalAlpha = alpha;

      function drawAngleSector(pA, pB, radiusPx, fillRgba, strokeRgba, labelText, textColor) {
        const angA = Math.atan2(pA.sy - originProj.sy, pA.sx - originProj.sx);
        const angB = Math.atan2(pB.sy - originProj.sy, pB.sx - originProj.sx);

        let diff = angB - angA;
        while (diff <= -Math.PI) diff += TWO_PI;
        while (diff > Math.PI) diff -= TWO_PI;

        const anticlockwise = diff < 0;
        const midAng = angA + diff * 0.5;

        ctx.fillStyle = fillRgba;
        ctx.beginPath();
        ctx.moveTo(originProj.sx, originProj.sy);
        ctx.arc(originProj.sx, originProj.sy, radiusPx, angA, angB, anticlockwise);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = strokeRgba;
        ctx.lineWidth = 2.0;
        ctx.beginPath();
        ctx.arc(originProj.sx, originProj.sy, radiusPx, angA, angB, anticlockwise);
        ctx.stroke();

        const textR = radiusPx + 24;
        const tx = originProj.sx + Math.cos(midAng) * textR;
        const ty = originProj.sy + Math.sin(midAng) * textR;
        drawCleanText(
          labelText,
          tx,
          ty,
          textColor,
          "bold 12px -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif"
        );
      }

      const absLat = Math.round(Math.abs(currentLat));
      const eqTilt = 90 - absLat;

      if (currentLat > 2) {
        drawAngleSector(
          northHori2D,
          ncp2D,
          Math.min(72, R_cel * 0.24),
          "rgba(56, 189, 248, 0.22)",
          "rgba(56, 189, 248, 0.92)",
          `極星仰角 = ${absLat}° (緯度)`,
          "#38bdf8"
        );

        if (absLat <= 88) {
          const northEqApex2D = projectFn({ x: 0, y: 0, z: R_cel });
          drawAngleSector(
            southHori2D,
            northEqApex2D,
            Math.min(64, R_cel * 0.21),
            "rgba(250, 204, 21, 0.18)",
            "rgba(250, 204, 21, 0.88)",
            `星軌仰角 = ${eqTilt}° (90°−緯度)`,
            "#facc15"
          );
        }
      } else if (currentLat < -2) {
        drawAngleSector(
          southHori2D,
          scp2D,
          Math.min(72, R_cel * 0.24),
          "rgba(251, 113, 133, 0.22)",
          "rgba(251, 113, 133, 0.92)",
          `天南極仰角 = ${absLat}° (緯度)`,
          "#fb7185"
        );

        if (absLat <= 88) {
          const southEqApex2D = projectFn({ x: 0, y: 0, z: R_cel });
          drawAngleSector(
            northHori2D,
            southEqApex2D,
            Math.min(64, R_cel * 0.21),
            "rgba(250, 204, 21, 0.18)",
            "rgba(250, 204, 21, 0.88)",
            `星軌仰角 = ${eqTilt}° (90°−緯度)`,
            "#facc15"
          );
        }
      } else {
        drawCleanText(
          "赤道 (0°)：天軸貼平地平線，所有星軌垂直昇落 (90°)",
          originProj.sx,
          originProj.sy - R_cel * 0.16,
          "#38bdf8",
          "bold 12px -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif"
        );
      }

      ctx.restore();
    }

    // =========================================================================
    // 繪製攝影機觀察者與動態同步特效
    // =========================================================================
    function drawCameraObserver(x, y, rotAngleRad, scaleX, scaleY, thrustRatio, dt) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotAngleRad);
      ctx.scale(scaleX, scaleY);

      if (!isPaused && thrustRatio > 0.05) {
        const spawnCount = Math.ceil(thrustRatio * 5);
        for (let i = 0; i < spawnCount; i++) {
          flameParticles.push({
            lx: -9 + (Math.random() - 0.5) * 2.0,
            ly: -12 + (Math.random() - 0.5) * 2.8,
            vx: -(50 + thrustRatio * 120 + Math.random() * 40),
            vy: (Math.random() - 0.5) * 10,
            life: 1.0,
            maxLife: 0.24 + thrustRatio * 0.26,
            size: 2.2 + thrustRatio * 3.8
          });
        }
      }

      for (let i = flameParticles.length - 1; i >= 0; i--) {
        const fp = flameParticles[i];
        if (!isPaused) {
          fp.lx += fp.vx * dt;
          fp.ly += fp.vy * dt;
          fp.life -= dt / fp.maxLife;
        }
        if (fp.life <= 0) {
          flameParticles.splice(i, 1);
          continue;
        }
        const alpha = Math.max(0, fp.life);
        const r = fp.size * (0.4 + fp.life * 0.8);
        const grad = ctx.createRadialGradient(fp.lx, fp.ly, 0, fp.lx, fp.ly, r * 1.8);
        grad.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
        grad.addColorStop(0.35, `rgba(251, 191, 36, ${alpha * 0.92})`);
        grad.addColorStop(0.75, `rgba(249, 115, 22, ${alpha * 0.65})`);
        grad.addColorStop(1, "rgba(239, 68, 68, 0)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(fp.lx, fp.ly, r * 1.8, 0, TWO_PI);
        ctx.fill();
      }

      if (thrustRatio > 0.05) {
        const coneLen = 18 + thrustRatio * 52 + Math.sin(performance.now() * 0.045) * 3;
        const coneGrad = ctx.createLinearGradient(-8, -12, -8 - coneLen, -12);
        coneGrad.addColorStop(0, "rgba(255, 255, 255, 0.96)");
        coneGrad.addColorStop(0.3, "rgba(250, 204, 21, 0.88)");
        coneGrad.addColorStop(0.7, "rgba(249, 115, 22, 0.48)");
        coneGrad.addColorStop(1, "rgba(239, 68, 68, 0)");
        ctx.fillStyle = coneGrad;
        ctx.beginPath();
        ctx.moveTo(-8, -15.5);
        ctx.lineTo(-8 - coneLen, -12);
        ctx.lineTo(-8, -8.5);
        ctx.closePath();
        ctx.fill();
      }

      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 1.8;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-4, 0);
      ctx.lineTo(0, -8);
      ctx.lineTo(4, 0);
      ctx.stroke();

      ctx.fillStyle = "#475569";
      ctx.beginPath();
      ctx.moveTo(-6, -14.5);
      ctx.lineTo(-9, -15.8);
      ctx.lineTo(-9, -8.2);
      ctx.lineTo(-6, -9.5);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#f1f5f9";
      ctx.strokeStyle = "#334155";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.roundRect(-6.5, -16.5, 13, 9, 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#cbd5e1";
      ctx.beginPath();
      ctx.arc(-3, -18.5, 2.7, 0, TWO_PI);
      ctx.arc(2.5, -18.5, 2.7, 0, TWO_PI);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#38bdf8";
      ctx.beginPath();
      ctx.moveTo(6.5, -14.5);
      ctx.lineTo(11, -16.2);
      ctx.lineTo(11, -7.8);
      ctx.lineTo(6.5, -9.5);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#e0f2fe";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(11, -15.6);
      ctx.lineTo(11, -8.4);
      ctx.stroke();

      const recGlow = thrustRatio > 0.05 ? (0.6 + 0.4 * Math.sin(performance.now() * 0.015)) : 0.85;
      ctx.fillStyle = `rgba(239, 68, 68, ${recGlow})`;
      ctx.beginPath();
      ctx.arc(3.5, -14.2, 1.4, 0, TWO_PI);
      ctx.fill();

      ctx.restore();
    }

    // =========================================================================
    // 主渲染迴圈
    // =========================================================================
    let lastTime = performance.now();

    function render(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      // 模型切換的淡出淡入獨立於時間暫停，方便暫停時逐步講解。
      const constellationTarget = constellationsEnabled ? 1 : 0;
      constellationOpacity = lerp(constellationOpacity, constellationTarget, 1 - Math.exp(-5 * dt));

      // 1. 狀態平滑過渡計算
      if (!isPaused) {
        currentLat = lerp(currentLat, targetLat, 1 - Math.exp(-6 * dt));
        currentChaseRatio = lerp(currentChaseRatio, targetChaseRatio, 1 - Math.exp(-4.5 * dt));
        currentSideYawOffset = lerp(currentSideYawOffset, targetSideYawOffset, 1 - Math.exp(-7 * dt));

        // 北極星方位顯示光束平滑淡入淡出
        const targetBeamFade = polarisPulseEnabled ? 1.0 : 0.0;
        polarisBeamFade = lerp(polarisBeamFade, targetBeamFade, 1 - Math.exp(-6.5 * dt));
        if (polarisBeamFade > 0.005) {
          polarisPulseTime += dt;
        }

        // 全階段通用的地球尺度縮放平滑過渡（接近實際尺度 <-> 誇張地球尺度）
        const targetTiny = isEarthTiny ? 1.0 : 0.0;
        earthTinyProgress = lerp(earthTinyProgress, targetTiny, 1 - Math.exp(-4.2 * dt));

        if (recenterUserView && !isDragging) {
          userYaw = lerp(userYaw, 0, 1 - Math.exp(-4.5 * dt));
          userPitch = lerp(userPitch, 0, 1 - Math.exp(-4.5 * dt));
          if (Math.abs(userYaw) < 0.001 && Math.abs(userPitch) < 0.001) {
            userYaw = 0;
            userPitch = 0;
            recenterUserView = false;
            if (pendingAction !== null) {
              const act = pendingAction;
              pendingAction = null;
              if (act.type === "slide") goToSlide(act.index);
              else if (act.type === "stage") setStage(act.stage);
            }
          }
        }

        if (stage >= 2 && zoomInProgress < 1) {
          zoomInProgress = Math.min(1, zoomInProgress + dt / 1.6);
        } else if (stage === 1 && zoomInProgress > 0) {
          zoomInProgress = Math.max(0, zoomInProgress - dt * 1.6);
        }

        // 階段 3 六步驟遞進控制：
        // 3-1: localZoomProgress -> 1（地表局部切平面）
        // 3-2: centerAnchorProgress -> 1（接近實際尺度，切面無縫收斂為過地球球心）
        // 3-3: zoomOutCutProgress -> 1（拉遠天球視角）
        // 3-4: planeGrowProgress -> 1（切出天球平面）
        // 3-5: intersectionLineProgress -> 1（描繪半球邊線）
        // 3-6: earthTinyProgress -> 0（誇張地球尺度，過球心原地放大不平移）
        const targetLocalZoom = (stage >= 4 || (stage === 3 && cutawayStep >= 1)) ? 1 : 0;
        const targetCenterAnchor = (stage >= 4 || (stage === 3 && cutawayStep >= 2)) ? 1 : 0;
        const wantsZoomOut = (stage >= 4 || (stage === 3 && cutawayStep >= 3)) ? 1 : 0;
        const targetZoomOut = (stage >= 4 || earthTinyProgress > 0.75 || cutawayStep >= 4) ? wantsZoomOut : 0;
        const wantsPlaneGrow = (stage >= 4 || (stage === 3 && cutawayStep >= 4)) ? 1 : 0;
        const targetPlaneGrow = zoomOutCutProgress > 0.72 ? wantsPlaneGrow : 0;
        const wantsIntersection = (stage >= 4 || (stage === 3 && cutawayStep >= 5)) ? 1 : 0;
        const targetIntersection = planeGrowProgress > 0.72 ? wantsIntersection : 0;
        const targetLevel = (stage >= 4 && intersectionLineProgress > 0.85) ? 1 : 0;
        const targetSideProfile = (stage >= 5 && levelProgress > 0.92) ? 1 : 0;

        localZoomProgress = lerp(localZoomProgress, targetLocalZoom, 1 - Math.exp(-2.4 * dt));
        centerAnchorProgress = lerp(centerAnchorProgress, targetCenterAnchor, 1 - Math.exp(-3.6 * dt));
        zoomOutCutProgress = lerp(zoomOutCutProgress, targetZoomOut, 1 - Math.exp(-1.9 * dt));
        planeGrowProgress = lerp(planeGrowProgress, targetPlaneGrow, 1 - Math.exp(-2.1 * dt));
        intersectionLineProgress = lerp(intersectionLineProgress, targetIntersection, 1 - Math.exp(-2.3 * dt));
        levelProgress = lerp(levelProgress, targetLevel, 1 - Math.exp(-1.9 * dt));
        sideProfileProgress = lerp(sideProfileProgress, targetSideProfile, 1 - Math.exp(-1.9 * dt));

        const spatialStudy = stage === 3 && cutawayStep >= 1;
        if (!spatialStudy) {
          const baseOmega = 0.68;
          const earthSpeed = (1 - currentChaseRatio) * baseOmega;
          const skySpeed = currentChaseRatio * baseOmega;
          earthAngle = (earthAngle + earthSpeed * dt) % TWO_PI;
          skyAngle = (skyAngle + skySpeed * dt) % TWO_PI;
        }
      }

      const easeZoomIn = easeInOutCubic(zoomInProgress);
      const easeLocalZoom = easeInOutCubic(localZoomProgress);
      const easeCenterAnchor = easeInOutCubic(centerAnchorProgress);
      const easeZoomOutCut = easeInOutCubic(zoomOutCutProgress);
      const easePlaneGrow = easeInOutCubic(planeGrowProgress);
      const easeIntersection = easeInOutCubic(intersectionLineProgress);
      const easeLevel = easeInOutCubic(levelProgress);
      const easeSideProfile = easeInOutCubic(sideProfileProgress);
      const easeTiny = easeInOutCubic(earthTinyProgress);

      const backHemiAlpha = lerp(0.045, 0.012, easeLevel);

      // 2. 清空畫布與深空背景
      const W = window.innerWidth;
      const H = window.innerHeight;
      ctx.fillStyle = "#050810";
      ctx.fillRect(0, 0, W, H);

      const bgGrad = ctx.createRadialGradient(W * 0.5, H * 0.48, 30, W * 0.5, H * 0.48, Math.max(W, H) * 0.75);
      bgGrad.addColorStop(0, "#0e1629");
      bgGrad.addColorStop(1, "#04060b");
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      bgStars.forEach(s => {
        ctx.fillStyle = `rgba(148, 163, 184, ${s.a})`;
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * H, s.r, 0, TWO_PI);
        ctx.fill();
      });

      // 3. 鏡頭縮放與中心定位計算
      const minDim = Math.min(W, H);
      const baseCelR = minDim * 0.41;

      let camScale = 1.0;
      camScale = lerp(camScale, 2.15, easeZoomIn * (1 - easeTiny * 0.72));
      camScale = lerp(camScale, 3.85, easeLocalZoom * (1 - easeZoomOutCut));
      camScale = lerp(camScale, 0.94, easeZoomOutCut);
      camScale = lerp(camScale, 1.08, easeLevel);
      camScale = lerp(camScale, 1.12, easeSideProfile);

      const R_cel = baseCelR * camScale;

      // 地球半徑由全階段通用的 easeTiny 控制（誇張地球尺度 0.27 * R_cel <-> 接近實際尺度 0.012 * R_cel）
      const earthRatio = lerp(0.27, 0.012, easeTiny);
      const R_earth = R_cel * earthRatio;

      const obsDir3D = getZenithVec(currentLat);
      // 核心幾何規則：僅 3-1 切於地表 (R_earth)；自 3-2 收斂為接近實際尺度起，地平面錨點永遠鎖定過地球球心 (0)，後續縮放地球不平移！
      const activePlaneOffset = R_earth * (1 - easeCenterAnchor) * (1 - easeTiny);

      function isAboveCuttingPlane(p) {
        return horizonDot(p, currentLat) >= activePlaneOffset - 0.001;
      }

      let cx = W * 0.5;
      let cy = H * 0.48;

      // 使用 3D 四元數 SLERP 計算剛體姿態旋轉（確保 3 -> 4 轉場沿最短空間弧線平滑扶正，絕無鏡像翻面或壓扁變形）
      const obliqueYaw = (-48 + (inverseAzimuthActive ? inverseAzimuthAnchor : 0)) * DEG + userYaw;
      const qTilted = quatMul(
        quatFromAxisAngle(0, 0, 1, -15 * DEG),
        quatMul(
          quatFromAxisAngle(1, 0, 0, 16 * DEG + userPitch),
          quatFromAxisAngle(0, 1, 0, obliqueYaw)
        )
      );

      const angleToUp = -(90 - currentLat) * DEG;
      const targetSideYaw = (-90 + currentSideYawOffset) * DEG;
      const obliqueLevelYaw = (-64 + (inverseAzimuthActive ? inverseAzimuthAnchor : 0)) * DEG;
      const yawAngle = lerp(obliqueLevelYaw, targetSideYaw, easeSideProfile) + userYaw;
      const pitchAngle = lerp(16 * DEG, 5 * DEG, easeSideProfile) + userPitch;
      const qLeveled = quatMul(
        quatFromAxisAngle(1, 0, 0, pitchAngle),
        quatMul(
          quatFromAxisAngle(0, 1, 0, yawAngle),
          quatFromAxisAngle(1, 0, 0, angleToUp)
        )
      );

      const activeQuat = easeLevel <= 0.0001
        ? qTilted
        : (easeLevel >= 0.9999 ? qLeveled : quatSlerp(qTilted, qLeveled, easeLevel));

      function projectRaw(p) {
        return applyQuat(p, activeQuat);
      }

      const focusWeight = easeZoomIn * (1 - easeZoomOutCut) * (1 - easeTiny * (1 - easeLocalZoom * 0.8));
      if (focusWeight > 0.001) {
        const obsWorld = {
          x: obsDir3D.x * R_earth * 0.88,
          y: obsDir3D.y * R_earth * 0.88,
          z: obsDir3D.z * R_earth * 0.88
        };
        const obsCam = projectRaw(obsWorld);
        cx -= obsCam.x * focusWeight * 0.78;
        cy += obsCam.y * focusWeight * 0.78;
      }

      cy += easeLevel * (minDim * 0.14);

      function project(p) {
        const q = projectRaw(p);
        return { sx: cx + q.x, sy: cy - q.y, z: q.z };
      }

      // =========================================================================
      // 4. 繪製立體半透明天球外殼
      // =========================================================================
      const celSphereAlpha = 1 - easeLevel * 0.92;
      if (celSphereAlpha > 0.02) {
        const backShellMult = easeIntersection > 0 ? lerp(1.0, 0.08, easeIntersection) : 1.0;
        const celGrad = ctx.createRadialGradient(
          cx - R_cel * 0.22, cy - R_cel * 0.22, R_cel * 0.1,
          cx, cy, R_cel
        );
        celGrad.addColorStop(0, "rgba(148, 163, 184, 0.01)");
        celGrad.addColorStop(0.68, `rgba(148, 163, 184, ${(0.03 * celSphereAlpha * backShellMult).toFixed(3)})`);
        celGrad.addColorStop(0.91, `rgba(186, 230, 253, ${(0.11 * celSphereAlpha * backShellMult).toFixed(3)})`);
        celGrad.addColorStop(1, `rgba(224, 242, 254, ${(0.32 * celSphereAlpha * backShellMult).toFixed(3)})`);

        ctx.fillStyle = celGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, R_cel, 0, TWO_PI);
        ctx.fill();

        ctx.strokeStyle = `rgba(148, 163, 184, ${(0.28 * celSphereAlpha * backShellMult).toFixed(3)})`;
        ctx.lineWidth = 1.0;
        ctx.setLineDash(easeIntersection > 0.2 ? [3, 5] : []);
        ctx.beginPath();
        ctx.arc(cx, cy, R_cel, 0, TWO_PI);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // 3-5 描繪半球邊線後，亮出上方可見觀察半球穹頂
      const step3DomeStrength = easeIntersection * (1 - easeLevel);
      if (step3DomeStrength > 0.01) {
        const latRad = currentLat * DEG;
        const planeCenter3D = {
          x: obsDir3D.x * activePlaneOffset,
          y: obsDir3D.y * activePlaneOffset,
          z: obsDir3D.z * activePlaneOffset
        };
        const domePath = buildObservedHemispherePath(cx, cy, R_cel, obsDir3D, planeCenter3D, latRad, project);

        const zen2D = project({
          x: obsDir3D.x * R_cel,
          y: obsDir3D.y * R_cel,
          z: obsDir3D.z * R_cel
        });
        const domeFillGrad = ctx.createRadialGradient(
          zen2D.sx, zen2D.sy, R_cel * 0.05,
          cx, cy, R_cel * 1.15
        );
        domeFillGrad.addColorStop(0, `rgba(224, 242, 254, ${(0.24 * step3DomeStrength).toFixed(3)})`);
        domeFillGrad.addColorStop(0.55, `rgba(186, 230, 253, ${(0.11 * step3DomeStrength).toFixed(3)})`);
        domeFillGrad.addColorStop(1, `rgba(148, 163, 184, ${(0.04 * step3DomeStrength).toFixed(3)})`);

        ctx.save();
        ctx.fillStyle = domeFillGrad;
        ctx.fill(domePath);
        ctx.restore();
      }

      function drawCelestialGrid(isFrontLayer) {
        if (!assists.celestialGrid) return;
        const eqSteps = 96;
        for (let i = 0; i < eqSteps; i++) {
          const a0 = (i / eqSteps) * TWO_PI;
          const a1 = ((i + 1) / eqSteps) * TWO_PI;
          const p0 = sphToCart(R_cel, 0, a0);
          const p1 = sphToCart(R_cel, 0, a1);
          const pm = sphToCart(R_cel, 0, (a0 + a1) * 0.5);

          let vis = 1.0;
          if (easeIntersection > 0 && !isAboveCuttingPlane(pm)) {
            vis = lerp(1.0, backHemiAlpha, easeIntersection);
          }
          if (vis <= 0.012) continue;

          const pr0 = project(p0), pr1 = project(p1), prm = project(pm);
          if ((prm.z >= 0) !== isFrontLayer) continue;
          const depth = prm.z >= 0 ? 1.0 : 0.28;
          ctx.strokeStyle = `rgba(250, 204, 21, ${(0.32 * depth * vis).toFixed(3)})`;
          ctx.lineWidth = 1.35;
          ctx.beginPath();
          ctx.moveTo(pr0.sx, pr0.sy);
          ctx.lineTo(pr1.sx, pr1.sy);
          ctx.stroke();
        }

        for (let m = 0; m < 12; m++) {
          const lon = -skyAngle + (m * Math.PI) / 6;
          const latSteps = 36;
          for (let j = 0; j < latSteps; j++) {
            const la0 = -90 + (j / latSteps) * 180;
            const la1 = -90 + ((j + 1) / latSteps) * 180;
            const p0 = sphToCart(R_cel, la0, lon);
            const p1 = sphToCart(R_cel, la1, lon);
            const pm = sphToCart(R_cel, (la0 + la1) * 0.5, lon);

            let vis = 1.0;
            if (easeIntersection > 0 && !isAboveCuttingPlane(pm)) {
              vis = lerp(1.0, backHemiAlpha, easeIntersection);
            }
            if (vis <= 0.012) continue;

            const pr0 = project(p0), pr1 = project(p1), prm = project(pm);
            if ((prm.z >= 0) !== isFrontLayer) continue;
            // Step 2 前後透明度差由 0.152 增為 0.1824（+20%）。
            const depth = prm.z >= 0 ? (stage === 2 ? 1.076 : 1.0) : (stage === 2 ? 0.164 : 0.24);
            ctx.strokeStyle = `rgba(148, 163, 184, ${(0.20 * depth * vis).toFixed(3)})`;
            ctx.lineWidth = 0.95;
            ctx.beginPath();
            ctx.moveTo(pr0.sx, pr0.sy);
            ctx.lineTo(pr1.sx, pr1.sy);
            ctx.stroke();
          }
        }
      }

      drawCelestialGrid(false);
      drawConstellations(false);

      // =========================================================================
      // 5. 彗星掃尾漸暗星軌繪製
      // =========================================================================
      const activeTailFraction = (stage === 1 ? 0 : currentChaseRatio) * maxTailFraction;

      function drawCometTrails(isFrontLayer) {
        if (!assists.cometTrails || activeTailFraction <= 0.005) return;

        const tailAngleSpan = activeTailFraction * TWO_PI;
        const segments = Math.max(36, Math.round(activeTailFraction * 150));

        indicatorStars.forEach(star => {
          const headLon = star.initLon * DEG - skyAngle;

          for (let i = 0; i < segments; i++) {
            const t0 = i / segments;
            const t1 = (i + 1) / segments;
            const lon0 = headLon + (1 - t0) * tailAngleSpan;
            const lon1 = headLon + (1 - t1) * tailAngleSpan;

            const p0 = sphToCart(R_cel, star.lat, lon0);
            const p1 = sphToCart(R_cel, star.lat, lon1);
            const pm = sphToCart(R_cel, star.lat, (lon0 + lon1) * 0.5);

            const proj0 = project(p0);
            const proj1 = project(p1);
            const projm = project(pm);

            if (isFrontLayer ? (projm.z < 0) : (projm.z >= 0)) continue;

            let horizonFactor = 1.0;
            if (easeIntersection > 0 && !isAboveCuttingPlane(pm)) {
              horizonFactor = lerp(1.0, backHemiAlpha, easeIntersection);
            }
            if (horizonFactor <= 0.01) continue;

            const fade = Math.pow(t1, 1.65);
            const depthDim = isFrontLayer ? 1.0 : 0.35;
            const alpha = fade * 0.95 * depthDim * horizonFactor;
            if (alpha <= 0.01) continue;

            ctx.strokeStyle = `rgba(${star.rgb}, ${alpha.toFixed(3)})`;
            ctx.lineWidth = (1.1 + fade * 2.5) * (isFrontLayer ? 1.0 : 0.85);
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(proj0.sx, proj0.sy);
            ctx.lineTo(proj1.sx, proj1.sy);
            ctx.stroke();
          }
        });
      }

      drawCometTrails(false);

      // =========================================================================
      // 6. 貫穿延伸至畫面邊界的南北極天軸 + 純文字南北極標示 + 軸心白星
      // =========================================================================
      const ncpSurf = project({ x: 0, y: R_cel, z: 0 });
      const scpSurf = project({ x: 0, y: -R_cel, z: 0 });
      const originProj = project({ x: 0, y: 0, z: 0 });

      if (assists.polarAxis) {
        const dx = ncpSurf.sx - originProj.sx;
        const dy = ncpSurf.sy - originProj.sy;
        const len = Math.hypot(dx, dy) || 1;
        const ux = dx / len;
        const uy = dy / len;
        const infDist = Math.max(W, H) * 2.2;

        ctx.save();
        ctx.strokeStyle = "rgba(56, 189, 248, 0.58)";
        ctx.lineWidth = 1.4;
        ctx.setLineDash([6, 5]);
        ctx.beginPath();
        ctx.moveTo(originProj.sx - ux * infDist, originProj.sy - uy * infDist);
        ctx.lineTo(originProj.sx + ux * infDist, originProj.sy + uy * infDist);
        ctx.stroke();
        ctx.setLineDash([]);

        const nOffset = easeLevel > 0.4 ? 22 : 18;
        const nLabelX = ncpSurf.sx + ux * nOffset;
        const nLabelY = ncpSurf.sy + uy * nOffset;
        const nAbove = currentLat >= 0;
        const nAlpha = easeLevel > 0.4 ? (nAbove ? 1.0 : 0.55) : 1.0;

        ctx.save();
        ctx.globalAlpha = nAlpha;
        drawCleanText(
          easeLevel > 0.4 ? "天北極 / 北極星 (N)" : "N (北極星方向)",
          nLabelX,
          nLabelY,
          "#38bdf8",
          "bold 12px -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif"
        );
        ctx.restore();

        const sOffset = easeLevel > 0.4 ? 22 : 18;
        const sLabelX = scpSurf.sx - ux * sOffset;
        const sLabelY = scpSurf.sy - uy * sOffset;
        const sAbove = currentLat < 0;
        const sAlpha = easeLevel > 0.4
          ? (sAbove ? 1.0 : 0.55)
          : (easeIntersection > 0 ? lerp(1.0, Math.max(0.28, backHemiAlpha * 3.5), easeIntersection) : 1.0);

        if (sAlpha > 0.05) {
          ctx.save();
          ctx.globalAlpha = sAlpha;
          drawCleanText(
            easeLevel > 0.4 ? "天南極 (S)" : "S",
            sLabelX,
            sLabelY,
            easeLevel > 0.4 ? "#fb7185" : "#94a3b8",
            "bold 12px -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif"
          );
          ctx.restore();
        }
        ctx.restore();
      }

      // 軸心白星（天北極星 & 天南極星）
      [
        { pt: ncpSurf, p3: { x: 0, y: R_cel, z: 0 }, color: "224, 242, 254" },
        { pt: scpSurf, p3: { x: 0, y: -R_cel, z: 0 }, color: "254, 205, 211" }
      ].forEach((poleObj, idx) => {
        const isNorth = idx === 0;
        if (easeLevel < 0.4 && !isNorth) return;
        const above = isAboveCuttingPlane(poleObj.p3);
        const poleAlpha = easeLevel >= 0.4 ? (above ? 1.0 : 0.35) : 1.0;

        ctx.save();
        ctx.globalAlpha = poleAlpha;
        const glow = ctx.createRadialGradient(poleObj.pt.sx, poleObj.pt.sy, 0, poleObj.pt.sx, poleObj.pt.sy, 12);
        glow.addColorStop(0, "rgba(255, 255, 255, 0.98)");
        glow.addColorStop(0.4, `rgba(${poleObj.color}, 0.55)`);
        glow.addColorStop(1, `rgba(${poleObj.color}, 0)`);
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(poleObj.pt.sx, poleObj.pt.sy, 12, 0, TWO_PI);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(poleObj.pt.sx, poleObj.pt.sy, above ? 4.0 : 3.0, 0, TWO_PI);
        ctx.fill();
        ctx.restore();
      });

      // =========================================================================
      // 7. 地表局部切平面 (3-1) → 過地球球心收斂 (3-2) → 切出天球平面 (3-4)
      // =========================================================================
      let horizonPlaneCache = null;

      if (easeLocalZoom > 0.01) {
        const lat = currentLat * DEG;
        const planeCenterR = activePlaneOffset;
        const planeCenter3D = {
          x: obsDir3D.x * planeCenterR,
          y: obsDir3D.y * planeCenterR,
          z: obsDir3D.z * planeCenterR
        };

        const maxHorizonR = Math.sqrt(Math.max(0, R_cel * R_cel - planeCenterR * planeCenterR));
        // 3-1 為與地球相切的小圓盤；3-2/3-3 保持過球心小圓盤；3-4 向外延伸完整切穿整顆天球
        const smallDiscR = lerp(Math.max(R_earth * 0.42, 16), 12, easeCenterAnchor);
        const currentDiskR = lerp(smallDiscR, maxHorizonR, easePlaneGrow) * easeLocalZoom;

        // 3-4 切出天球平面時顯示延伸平面外框輪廓，突顯空間切割感
        const quadAlpha = easePlaneGrow * (1 - easeLevel * 0.85);
        if (quadAlpha > 0.02) {
          const half = lerp(smallDiscR * 1.15, R_cel * 1.16, easePlaneGrow);
          const corners = [
            { e: -half, n: -half },
            { e:  half, n: -half },
            { e:  half, n:  half },
            { e: -half, n:  half }
          ].map(c => project({
            x: planeCenter3D.x + c.e,
            y: planeCenter3D.y + c.n * Math.cos(lat),
            z: planeCenter3D.z - c.n * Math.sin(lat)
          }));

          const sheetFillAlpha = lerp(0.18, 0.34, easePlaneGrow) * quadAlpha;
          ctx.fillStyle = `rgba(30, 58, 95, ${sheetFillAlpha.toFixed(3)})`;
          ctx.strokeStyle = `rgba(186, 230, 253, ${(0.38 * quadAlpha).toFixed(3)})`;
          ctx.lineWidth = 1.2;
          ctx.setLineDash([5, 4]);
          ctx.beginPath();
          corners.forEach((pt, idx) => idx === 0 ? ctx.moveTo(pt.sx, pt.sy) : ctx.lineTo(pt.sx, pt.sy));
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.setLineDash([]);
        }

        const steps = 140;
        const diskPts = [];
        for (let i = 0; i <= steps; i++) {
          const az = (i / steps) * TWO_PI;
          const north = Math.cos(az), east = Math.sin(az);
          const pt3D = {
            x: planeCenter3D.x + currentDiskR * east,
            y: planeCenter3D.y + currentDiskR * north * Math.cos(lat),
            z: planeCenter3D.z - currentDiskR * north * Math.sin(lat)
          };
          diskPts.push(project(pt3D));
        }

        // 圓盤／割平面填充：
        // 3-1 局部小圓盤：淡青綠色地面質感
        // 3-4 切出天球平面：半不透明霧面質感 (0.52)，清楚區隔地平線以上可見與下方被遮蔽空間
        const diskOpacity = lerp(0.74, 0.52, easePlaneGrow) * easeLocalZoom;

        ctx.beginPath();
        diskPts.forEach((p2D, i) => i === 0 ? ctx.moveTo(p2D.sx, p2D.sy) : ctx.lineTo(p2D.sx, p2D.sy));
        ctx.closePath();

        if (easePlaneGrow < 0.5) {
          ctx.fillStyle = `rgba(15, 118, 110, ${diskOpacity.toFixed(3)})`;
        } else {
          ctx.fillStyle = `rgba(71, 102, 138, ${diskOpacity.toFixed(3)})`;
        }
        ctx.fill();

        // 3-1 小圓盤加上同心圓刻度，加強「局部平坦圓盤」視覺
        const smallDiscDetailAlpha = (1 - easePlaneGrow) * easeLocalZoom;
        if (smallDiscDetailAlpha > 0.05) {
          ctx.save();
          ctx.strokeStyle = `rgba(167, 243, 208, ${(0.45 * smallDiscDetailAlpha).toFixed(3)})`;
          ctx.lineWidth = 1.0;
          [0.5, 0.8].forEach(ringRatio => {
            ctx.beginPath();
            for (let i = 0; i <= 64; i++) {
              const az = (i / 64) * TWO_PI;
              const north = Math.cos(az), east = Math.sin(az);
              const pt = project({
                x: planeCenter3D.x + currentDiskR * ringRatio * east,
                y: planeCenter3D.y + currentDiskR * ringRatio * north * Math.cos(lat),
                z: planeCenter3D.z - currentDiskR * ringRatio * north * Math.sin(lat)
              });
              if (i === 0) ctx.moveTo(pt.sx, pt.sy);
              else ctx.lineTo(pt.sx, pt.sy);
            }
            ctx.stroke();
          });
          ctx.restore();
        }

        // 圓盤／交線後側弧線（z < 0）
        ctx.save();
        ctx.strokeStyle = `rgba(186, 230, 253, ${(lerp(0.45, 0.34, easePlaneGrow) * easeLocalZoom).toFixed(3)})`;
        ctx.lineWidth = 1.2;
        ctx.setLineDash([3, 4]);
        ctx.beginPath();
        let backPenDown = false;
        for (let i = 0; i < steps; i++) {
          const p0 = diskPts[i];
          const p1 = diskPts[i + 1];
          const midZ = (p0.z + p1.z) * 0.5;
          if (midZ < 0) {
            if (!backPenDown) {
              ctx.moveTo(p0.sx, p0.sy);
              backPenDown = true;
            }
            ctx.lineTo(p1.sx, p1.sy);
          } else {
            backPenDown = false;
          }
        }
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();

        horizonPlaneCache = { lat, planeCenter3D, currentDiskR, steps, diskPts };
      }

      // =========================================================================
      // 8.【中間圖層】：繪製誇張地球尺度本體與地球 ±X / ±Y 十字座標軸
      // =========================================================================
      const earthDetailFade = 1 - easeTiny * 0.92;
      const earthAlpha = earthDetailFade;
      if (earthAlpha > 0.02 && R_earth > 2.5) {
        ctx.save();
        ctx.globalAlpha = earthAlpha;

        const atmoGrad = ctx.createRadialGradient(
          originProj.sx, originProj.sy, R_earth * 0.92,
          originProj.sx, originProj.sy, R_earth * 1.15
        );
        atmoGrad.addColorStop(0, "rgba(56, 189, 248, 0.28)");
        atmoGrad.addColorStop(1, "rgba(56, 189, 248, 0)");
        ctx.fillStyle = atmoGrad;
        ctx.beginPath();
        ctx.arc(originProj.sx, originProj.sy, R_earth * 1.15, 0, TWO_PI);
        ctx.fill();

        const eGrad = ctx.createRadialGradient(
          originProj.sx - R_earth * 0.32, originProj.sy - R_earth * 0.32, R_earth * 0.08,
          originProj.sx, originProj.sy, R_earth
        );
        eGrad.addColorStop(0, "#2563eb");
        eGrad.addColorStop(0.55, "#1d4ed8");
        eGrad.addColorStop(0.88, "#172554");
        eGrad.addColorStop(1, "#090e1a");

        ctx.fillStyle = eGrad;
        ctx.beginPath();
        ctx.arc(originProj.sx, originProj.sy, R_earth, 0, TWO_PI);
        ctx.fill();

        ctx.save();
        ctx.beginPath();
        ctx.arc(originProj.sx, originProj.sy, R_earth, 0, TWO_PI);
        ctx.clip();

        ctx.fillStyle = "#10b981";
        ctx.strokeStyle = "#6ee7b7";
        ctx.lineWidth = 0.9;
        continents.forEach(poly => {
          ctx.beginPath();
          let anyFront = false;
          poly.forEach(([lonDeg, latDeg], idx) => {
            const p3 = sphToCart(R_earth, latDeg, lonDeg * DEG + earthAngle);
            const p2 = project(p3);
            if (p2.z >= -R_earth * 0.1) anyFront = true;
            if (idx === 0) ctx.moveTo(p2.sx, p2.sy);
            else ctx.lineTo(p2.sx, p2.sy);
          });
          if (anyFront) {
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }
        });

        const shadeGrad = ctx.createRadialGradient(
          originProj.sx - R_earth * 0.35, originProj.sy - R_earth * 0.35, R_earth * 0.15,
          originProj.sx, originProj.sy, R_earth
        );
        shadeGrad.addColorStop(0, "rgba(255, 255, 255, 0.12)");
        shadeGrad.addColorStop(0.6, "rgba(15, 23, 42, 0.15)");
        shadeGrad.addColorStop(1, "rgba(2, 6, 23, 0.72)");
        ctx.fillStyle = shadeGrad;
        ctx.beginPath();
        ctx.arc(originProj.sx, originProj.sy, R_earth, 0, TWO_PI);
        ctx.fill();

        if (assists.earthAxes) {
          for (let m = 0; m < 12; m++) {
            const lon = earthAngle + (m * Math.PI) / 6;
            ctx.strokeStyle = "rgba(226, 232, 240, 0.32)";
            ctx.lineWidth = 0.9;
            ctx.beginPath();
            let started = false;
            for (let la = -85; la <= 85; la += 10) {
              const p3 = sphToCart(R_earth, la, lon);
              const p2 = project(p3);
              if (p2.z >= 0) {
                if (!started) { ctx.moveTo(p2.sx, p2.sy); started = true; }
                else ctx.lineTo(p2.sx, p2.sy);
              } else {
                started = false;
              }
            }
            ctx.stroke();
          }
          [-60, -30, 30, 60].forEach(latLine => {
            ctx.strokeStyle = "rgba(226, 232, 240, 0.28)";
            ctx.lineWidth = 0.85;
            ctx.beginPath();
            let started = false;
            for (let i = 0; i <= 72; i++) {
              const p3 = sphToCart(R_earth, latLine, (i / 72) * TWO_PI);
              const p2 = project(p3);
              if (p2.z >= 0) {
                if (!started) { ctx.moveTo(p2.sx, p2.sy); started = true; }
                else ctx.lineTo(p2.sx, p2.sy);
              } else {
                started = false;
              }
            }
            ctx.stroke();
          });
        }

        ctx.strokeStyle = "rgba(250, 204, 21, 0.82)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        let eqStarted = false;
        for (let i = 0; i <= 72; i++) {
          const p3 = sphToCart(R_earth, 0, (i / 72) * TWO_PI);
          const p2 = project(p3);
          if (p2.z >= 0) {
            if (!eqStarted) { ctx.moveTo(p2.sx, p2.sy); eqStarted = true; }
            else ctx.lineTo(p2.sx, p2.sy);
          } else {
            eqStarted = false;
          }
        }
        ctx.stroke();
        ctx.restore();

        ctx.strokeStyle = "rgba(96, 165, 250, 0.68)";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(originProj.sx, originProj.sy, R_earth, 0, TWO_PI);
        ctx.stroke();

        if (assists.earthAxes && easeLocalZoom < 0.5) {
          const axisLen = R_earth * 1.48;
          const crossAxes = [
            { pos: sphToCart(axisLen, 0, earthAngle),                   col: "rgba(248, 113, 113, 0.85)", label: "+X" },
            { pos: sphToCart(axisLen, 0, earthAngle + Math.PI),         col: "rgba(248, 113, 113, 0.55)", label: "-X" },
            { pos: sphToCart(axisLen, 0, earthAngle + Math.PI * 0.5),   col: "rgba(74, 222, 128, 0.85)",  label: "+Y" },
            { pos: sphToCart(axisLen, 0, earthAngle + Math.PI * 1.5),   col: "rgba(74, 222, 128, 0.55)",  label: "-Y" }
          ];

          ctx.font = "bold 10px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";

          crossAxes.forEach(ax => {
            const pEnd = project(ax.pos);
            ctx.strokeStyle = ax.col;
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(originProj.sx, originProj.sy);
            ctx.lineTo(pEnd.sx, pEnd.sy);
            ctx.stroke();

            ctx.fillStyle = ax.col;
            ctx.fillText(ax.label, pEnd.sx, pEnd.sy - 7);
          });
        }

        ctx.restore();
      }

      // 接近實際尺度時，在天球中心顯示代表地球的藍色微點
      const tinyEarthIndicatorAlpha = easeTiny;
      if (tinyEarthIndicatorAlpha > 0.05) {
        ctx.save();
        ctx.globalAlpha = tinyEarthIndicatorAlpha * 0.95;
        const dotGrad = ctx.createRadialGradient(originProj.sx, originProj.sy, 0, originProj.sx, originProj.sy, 11);
        dotGrad.addColorStop(0, "rgba(96, 165, 250, 0.98)");
        dotGrad.addColorStop(0.5, "rgba(56, 189, 248, 0.45)");
        dotGrad.addColorStop(1, "rgba(56, 189, 248, 0)");
        ctx.fillStyle = dotGrad;
        ctx.beginPath();
        ctx.arc(originProj.sx, originProj.sy, 11, 0, TWO_PI);
        ctx.fill();

        ctx.fillStyle = "#93c5fd";
        ctx.beginPath();
        ctx.arc(originProj.sx, originProj.sy, 3.0, 0, TWO_PI);
        ctx.fill();

        if (easeTiny > 0.5 && easeLevel < 0.4) {
          drawCleanText(
            "地球（接近實際尺度）",
            originProj.sx,
            originProj.sy + 18,
            "#93c5fd",
            "bold 11px -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif"
          );
        }
        ctx.restore();
      }

      // =========================================================================
      // 天球前半球位於地球之前；後半球已在地球本體之前繪製。
      // =========================================================================
      drawCelestialGrid(true);

      // 8.5.【地球前景圖層】：小圓盤邊緣 / 平面與天球相交的大圓邊線（3-5 亮出）+ 四方位
      // =========================================================================
      if (horizonPlaneCache) {
        const { lat, planeCenter3D, currentDiskR, steps, diskPts } = horizonPlaneCache;

        // 3-1 顯示小圓盤亮邊；3-4 切出天球平面時邊界為柔和平面輪廓；3-5 easeIntersection 亮出與天球相交的大圓邊線
        const rimHighlight = lerp(0.92, lerp(0.42, 1.0, easeIntersection), easePlaneGrow) * easeLocalZoom;
        ctx.save();
        if (easeIntersection > 0.05) {
          ctx.shadowColor = "rgba(125, 211, 252, 0.95)";
          ctx.shadowBlur = 16 * easeIntersection;
        }
        ctx.strokeStyle = easePlaneGrow < 0.5
          ? `rgba(167, 243, 208, ${rimHighlight.toFixed(3)})`
          : `rgba(224, 242, 254, ${rimHighlight.toFixed(3)})`;
        ctx.lineWidth = lerp(2.0, lerp(1.5, 3.0, easeIntersection), easePlaneGrow);
        ctx.lineCap = "round";
        ctx.beginPath();
        let frontPenDown = false;
        for (let i = 0; i < steps; i++) {
          const p0 = diskPts[i];
          const p1 = diskPts[i + 1];
          const midZ = (p0.z + p1.z) * 0.5;
          if (midZ >= 0) {
            if (!frontPenDown) {
              ctx.moveTo(p0.sx, p0.sy);
              frontPenDown = true;
            }
            ctx.lineTo(p1.sx, p1.sy);
          } else {
            frontPenDown = false;
          }
        }
        ctx.stroke();
        ctx.restore();

        // 階段 4 扶正後 & 階段 5 旋轉方位時，純文字標示東(E)、南(S)、西(W)、北(N)四方位
        if (easeLevel > 0.45) {
          const cardinals = [
            { label: "北 (N)", e: 0, n: 1, col: "#38bdf8" },
            { label: "東 (E)", e: 1, n: 0, col: "#facc15" },
            { label: "南 (S)", e: 0, n: -1, col: "#fb7185" },
            { label: "西 (W)", e: -1, n: 0, col: "#cbd5e1" }
          ];

          ctx.save();
          ctx.globalAlpha = Math.min(1, (easeLevel - 0.45) / 0.45);
          cardinals.forEach(c => {
            const pt = project({
              x: planeCenter3D.x + currentDiskR * c.e,
              y: planeCenter3D.y + currentDiskR * c.n * Math.cos(lat),
              z: planeCenter3D.z - currentDiskR * c.n * Math.sin(lat)
            });
            const dx = pt.sx - originProj.sx;
            const dy = pt.sy - originProj.sy;
            const dLen = Math.hypot(dx, dy) || 1;
            const lx = pt.sx + (dx / dLen) * 18;
            const ly = pt.sy + (dy / dLen) * 15;

            drawCleanText(c.label, lx, ly, c.col);
          });
          ctx.restore();
        }
      }

      // =========================================================================
      // 9. 繪製攝影機觀察者
      // =========================================================================
      const personAlpha = stage === 1 ? 0 : Math.min(1, zoomInProgress * 2.5);
      if (personAlpha > 0.02) {
        const hoverOffset = (1 - easeLocalZoom) * (R_earth * 0.14);
        const surfR = lerp(R_earth + hoverOffset, 0, easeTiny);
        const obsBase3D = sphToCart(surfR, currentLat, 0);
        const obsTop3D = sphToCart(surfR + 20, currentLat, 0);
        const obsEast3D = { x: obsBase3D.x + 20, y: obsBase3D.y, z: obsBase3D.z };

        const pBase = project(obsBase3D);
        const pTop = project(obsTop3D);
        const pEast = project(obsEast3D);

        const eastVecX = pEast.sx - pBase.sx;
        const eastVecY = pEast.sy - pBase.sy;
        const eastAngleRad = Math.atan2(eastVecY, eastVecX);

        const upVecX = pTop.sx - pBase.sx;
        const upVecY = pTop.sy - pBase.sy;
        const crossZ = eastVecX * upVecY - eastVecY * upVecX;
        const upSign = crossZ < 0 ? 1 : -1;

        const zenithAngleRad = Math.atan2(upVecY, upVecX) + Math.PI / 2;
        const rightNormX = Math.cos(zenithAngleRad);
        const rightNormY = Math.sin(zenithAngleRad);
        const eastDotRight = eastVecX * rightNormX + eastVecY * rightNormY;
        const lensFacingSign = eastDotRight >= 0 ? 1 : -1;

        let finalAngle = eastAngleRad;
        let finalScaleX = 1;
        let finalScaleY = upSign;

        if (easeLevel > 0.5) {
          finalAngle = zenithAngleRad;
          finalScaleX = lensFacingSign;
          finalScaleY = 1;
        }

        const personScale = lerp(1.18, 0.92, easeTiny);

        ctx.save();
        ctx.globalAlpha = personAlpha;
        const activeThrust = (stage === 2) ? currentChaseRatio : 0;
        drawCameraObserver(
          pBase.sx,
          pBase.sy,
          finalAngle,
          personScale * finalScaleX,
          personScale * finalScaleY,
          activeThrust,
          dt
        );
        ctx.restore();
      }

      // =========================================================================
      // 10. 被切出來的觀察半球「立體外框亮白描邊與經緯穹頂骨架」（3-5 亮出後顯示）
      // =========================================================================
      if (easeIntersection > 0.01) {
        const latRad = currentLat * DEG;
        const planeCenterR = activePlaneOffset;
        const planeCenter3D = {
          x: obsDir3D.x * planeCenterR,
          y: obsDir3D.y * planeCenterR,
          z: obsDir3D.z * planeCenterR
        };
        const domeR = Math.sqrt(Math.max(0, R_cel * R_cel - planeCenterR * planeCenterR));

        if (step3DomeStrength > 0.01) {
          const domePath = buildObservedHemispherePath(cx, cy, R_cel, obsDir3D, planeCenter3D, latRad, project);
          ctx.save();
          ctx.shadowColor = "rgba(224, 242, 254, 0.95)";
          ctx.shadowBlur = 16 * step3DomeStrength;
          ctx.strokeStyle = `rgba(255, 255, 255, ${(0.96 * step3DomeStrength).toFixed(3)})`;
          ctx.lineWidth = 2.8 * step3DomeStrength;
          ctx.stroke(domePath);

          ctx.shadowBlur = 0;
          ctx.strokeStyle = `rgba(125, 211, 252, ${(0.65 * step3DomeStrength).toFixed(3)})`;
          ctx.lineWidth = 1.2 * step3DomeStrength;
          ctx.stroke(domePath);
          ctx.restore();
        }

        const domeProfiles = [
          (rad) => ({
            x: planeCenter3D.x + domeR * Math.sin(rad),
            y: planeCenter3D.y + domeR * Math.cos(rad) * Math.sin(latRad),
            z: planeCenter3D.z + domeR * Math.cos(rad) * Math.cos(latRad)
          }),
          (rad) => ({
            x: planeCenter3D.x,
            y: planeCenter3D.y + domeR * (Math.cos(rad) * Math.sin(latRad) + Math.sin(rad) * Math.cos(latRad)),
            z: planeCenter3D.z + domeR * (Math.cos(rad) * Math.cos(latRad) - Math.sin(rad) * Math.sin(latRad))
          })
        ];

        ctx.save();
        const highlightBoost = easeIntersection * (1 - easeLevel * 0.45);
        ctx.strokeStyle = `rgba(248, 250, 252, ${lerp(0.32, 0.52, highlightBoost)})`;
        ctx.lineWidth = lerp(1.2, 1.6, highlightBoost);
        if (step3DomeStrength > 0.1) {
          ctx.setLineDash([4, 4]);
        }

        domeProfiles.forEach((profileFn, idx) => {
          if (idx === 0 && easeSideProfile > 0.85) return;
          ctx.beginPath();
          for (let a = -90; a <= 90; a += 3) {
            const p2 = project(profileFn(a * DEG));
            if (a === -90) ctx.moveTo(p2.sx, p2.sy);
            else ctx.lineTo(p2.sx, p2.sy);
          }
          ctx.stroke();
        });
        ctx.setLineDash([]);
        ctx.restore();
      }

      // =========================================================================
      // 11. 繪製前景層掃尾 (z >= 0) + 3 顆指標星本體 + 獨立開關分類與昇落標示
      // =========================================================================
      drawCometTrails(true);

      function drawConstellations(isFrontLayer) {
        if (constellationOpacity < 0.005) return;
        constellations.forEach(group => {
          const worldPoints = group.points.map(([lat, lon]) => sphToCart(R_cel, lat, lon * DEG - skyAngle));
          const points = worldPoints.map(project);
          const visibility = p => isAboveCuttingPlane(p) ? 1 : lerp(1, backHemiAlpha, easeIntersection);
          ctx.save();
          ctx.globalAlpha = constellationOpacity;
          ctx.lineWidth = 1.5;
          group.edges.forEach(([a, b]) => {
            // 沿球面細分，避免連線穿過球內；每段分別判斷深度及地平面。
            const onArc = t => {
              const p = {x: lerp(worldPoints[a].x, worldPoints[b].x, t), y: lerp(worldPoints[a].y, worldPoints[b].y, t), z: lerp(worldPoints[a].z, worldPoints[b].z, t)};
              const scale = R_cel / Math.hypot(p.x, p.y, p.z);
              return {x: p.x * scale, y: p.y * scale, z: p.z * scale};
            };
            for (let i = 0; i < 8; i++) {
              const middle = onArc((i + 0.5) / 8);
              const front = project(middle).z >= 0;
              if (front !== isFrontLayer) continue;
              const p0 = project(onArc(i / 8)), p1 = project(onArc((i + 1) / 8));
              ctx.strokeStyle = `rgba(203, 213, 225, ${(front ? 0.7 : 0.22) * visibility(middle)})`;
              ctx.beginPath();
              ctx.moveTo(p0.sx, p0.sy);
              ctx.lineTo(p1.sx, p1.sy);
              ctx.stroke();
            }
          });
          points.forEach((p, i) => {
            if ((p.z >= 0) !== isFrontLayer) return;
            ctx.fillStyle = `rgba(248, 250, 252, ${(p.z >= 0 ? 1 : 0.4) * visibility(worldPoints[i])})`;
            ctx.beginPath();
            ctx.arc(p.sx, p.sy, p.z >= 0 ? 3.2 : 2.2, 0, TWO_PI);
            ctx.fill();
          });
          const anchor = points[0];
          if ((anchor.z >= 0) === isFrontLayer) {
            ctx.globalAlpha = constellationOpacity * (anchor.z >= 0 ? 1 : 0.5) * visibility(worldPoints[0]);
            drawCleanText(group.name, anchor.sx, anchor.sy - 16, "#e2e8f0");
          }
          ctx.restore();
        });
      }

      drawConstellations(true);

      indicatorStars.forEach(star => {
        const indicatorOpacity = stage === 1 ? 1 - constellationOpacity : 1;
        if (indicatorOpacity < 0.005) return;
        const headLon = star.initLon * DEG - skyAngle;
        const pSurf3D = sphToCart(R_cel, star.lat, headLon);
        const pSurf2D = project(pSurf3D);

        const aboveHorizon = isAboveCuttingPlane(pSurf3D);
        let starAlpha = indicatorOpacity;
        if (easeIntersection > 0 && !aboveHorizon) {
          starAlpha *= lerp(1.0, backHemiAlpha, easeIntersection);
        }

        const isClassLabelEnabled = starLabelToggles[star.key];

        if (isClassLabelEnabled && easeLevel > 0.65 && easeSideProfile < 0.7) {
          const latRad = currentLat * DEG;
          const decRad = star.lat * DEG;
          const cosH0 = -Math.tan(latRad) * Math.tan(decRad);
          if (cosH0 > -1 && cosH0 < 1) {
            const H0 = Math.acos(cosH0);
            const risePt2D = project(sphToCart(R_cel, star.lat, H0));
            const setPt2D = project(sphToCart(R_cel, star.lat, -H0));

            const markerAlpha = Math.min(1, (easeLevel - 0.65) / 0.35) * (1 - easeSideProfile);
            [
              { pt: risePt2D, tag: "昇" },
              { pt: setPt2D, tag: "落" }
            ].forEach(m => {
              if (m.pt.z >= -R_cel * 0.2) {
                ctx.save();
                ctx.globalAlpha = markerAlpha * 0.9;
                ctx.fillStyle = star.color;
                ctx.beginPath();
                ctx.arc(m.pt.sx, m.pt.sy, 3.2, 0, TWO_PI);
                ctx.fill();
                drawCleanText(m.tag, m.pt.sx, m.pt.sy - 11, star.color, "bold 10px -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif");
                ctx.restore();
              }
            });
          }
        }

        if (starAlpha <= 0.015) return;

        const depthAlpha = (pSurf2D.z >= 0 ? 1.0 : 0.45) * starAlpha;
        const glowR = pSurf2D.z >= 0 ? 15 : 10;
        const grad = ctx.createRadialGradient(pSurf2D.sx, pSurf2D.sy, 0, pSurf2D.sx, pSurf2D.sy, glowR);
        grad.addColorStop(0, `rgba(255, 255, 255, ${0.98 * depthAlpha})`);
        grad.addColorStop(0.35, `rgba(${star.rgb}, ${0.72 * depthAlpha})`);
        grad.addColorStop(1, `rgba(${star.rgb}, 0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(pSurf2D.sx, pSurf2D.sy, glowR, 0, TWO_PI);
        ctx.fill();

        ctx.fillStyle = `rgba(255, 255, 255, ${depthAlpha})`;
        ctx.beginPath();
        ctx.arc(pSurf2D.sx, pSurf2D.sy, pSurf2D.z >= 0 ? 4.0 : 2.8, 0, TWO_PI);
        ctx.fill();

        if (isClassLabelEnabled && easeLevel > 0.55 && aboveHorizon && pSurf2D.z >= -R_cel * 0.15) {
          const labelAlpha = Math.min(1, (easeLevel - 0.55) / 0.35) * (pSurf2D.z >= 0 ? 1.0 : 0.55);
          const behavior = getStarBehaviorDesc(star.lat, currentLat);
          ctx.save();
          ctx.globalAlpha = labelAlpha;
          drawCleanText(
            `${star.shortName}｜${behavior}`,
            pSurf2D.sx,
            pSurf2D.sy - 16,
            star.color,
            "bold 11px -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif"
          );
          ctx.restore();
        }
      });

      // =========================================================================
      // 12. 階段 5 側視剖面「極星仰角＝緯度、星軌仰角＝90°−緯度」幾何標示
      // =========================================================================
      drawStage5ElevationAngles(originProj, R_cel, currentLat, easeSideProfile, currentSideYawOffset, project);

      // =========================================================================
      // 13. 北極星方位顯示光束特效
      // =========================================================================
      drawPolarisSinglePulseBeam(W, H, cx, cy, R_cel, R_earth, obsDir3D, easeTiny, project);

      requestAnimationFrame(render);
    }

    // 初始化所有 UI 狀態與開關
    updateUI();
    updateAzimuthUI();
    updateQuickLatButtons();
    updateAssistButtons();
    updateStarClassButtons();
    updatePolarisRayButton();
    updateLatText(targetLat);
    updateTailText(maxTailFraction);
    requestAnimationFrame(render);
  </script>
</body>
</html>
