<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>天球週日運動 — 3D 互動教學動畫（幾何定理與北極星脈衝光版）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden;
      background-color: #050810;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }
    .glass-panel {
      background: rgba(10, 15, 28, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: rgba(148, 163, 184, 0.25);
      border-radius: 999px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f8fafc;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(248, 250, 252, 0.7);
    }
    .toggle-chip {
      transition: all 0.18s ease;
    }
  </style>
</head>
<body>

  <!-- 全螢幕主畫布（單擊空白處可隱藏/顯示控制列） -->
  <canvas id="scene"></canvas>

  <!-- 左上角極簡狀態提示 -->
  <div id="topHint" class="fixed top-4 left-4 z-10 pointer-events-none transition-opacity duration-300 max-w-xl">
    <div class="glass-panel px-4 py-2.5 rounded-xl flex items-center gap-3 text-xs text-slate-200 shadow-lg">
      <span id="stageBadge" class="px-2.5 py-0.5 rounded-md bg-sky-500/20 border border-sky-400/40 text-sky-200 font-semibold shrink-0">階段 1 / 5</span>
      <span id="stageDesc" class="text-slate-200 leading-relaxed">宇宙視角：恆星位於天球上，地球自轉、天球靜止</span>
    </div>
  </div>

  <!-- 右上角北極星單束脈衝光開關、重播、暫停與設定齒輪工具 -->
  <div id="topRightTools" class="fixed top-4 right-4 z-10 flex flex-wrap items-center justify-end gap-2 transition-opacity duration-300">
    <button id="polarisRayBtn" onclick="togglePolarisRay()" title="開啟後持續從北極星方向發射單束能量脈衝光，演示無窮遠平行星光與極星仰角原理"
            class="glass-panel hover:bg-sky-500/25 border border-slate-700 bg-slate-900/75 text-slate-300 text-xs font-semibold px-3.5 py-2 rounded-xl transition cursor-pointer flex items-center gap-1.5 shadow-lg">
      <span id="polarisRayDot" class="w-2 h-2 rounded-full bg-slate-500 transition-colors"></span>
      <span id="polarisRayText">✦ 北極星脈衝光：關</span>
    </button>
    <button id="replayBtn" onclick="replayCurrentAction()"
            class="glass-panel hover:bg-slate-800/90 text-slate-200 text-xs px-3.5 py-2 rounded-xl transition cursor-pointer flex items-center gap-1.5 shadow-lg">
      <span id="replayBtnText">↻ 重播本階段</span>
    </button>
    <button onclick="toggleReverseMode()" id="reverseModeBtn" title="保留逆推模式，逐步返回前面的視角" class="glass-panel px-3 py-2 rounded-xl border border-violet-500/40 bg-violet-500/15 hover:bg-violet-500/25 text-violet-200 text-xs font-semibold transition cursor-pointer shadow-lg">逆推：關</button>
    <button id="pauseBtn" onclick="togglePause()"
            class="glass-panel hover:bg-slate-800/90 text-slate-200 text-xs px-3.5 py-2 rounded-xl transition cursor-pointer shadow-lg">
      暫停
    </button>
    <button id="gearBtn" onclick="toggleSettingsDrawer()" title="參數與輔助線設定"
            class="glass-panel hover:bg-slate-800/90 text-slate-200 text-sm px-3 py-1.5 rounded-xl transition cursor-pointer shadow-lg flex items-center gap-1">
      <span>⚙️</span>
    </button>
  </div>

  <!-- 可收合參數與輔助線設定面板（預設收進右上角齒輪） -->
  <div id="settingsDrawer" class="hidden fixed top-16 right-4 z-20 w-[92%] max-w-md transition-all duration-200">
    <div class="glass-panel rounded-2xl p-4 shadow-2xl flex flex-col gap-3.5 text-xs text-slate-300 border border-slate-700/80">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <span class="font-semibold text-slate-100">⚙️ 參數微調與空間輔助線</span>
        <button onclick="toggleSettingsDrawer()" class="text-slate-400 hover:text-white px-1.5 py-0.5 rounded cursor-pointer">✕</button>
      </div>

      <!-- 觀察位置（緯度）控制（-90° ~ +90° 涵蓋南北極點） -->
      <div class="flex flex-col gap-1.5">
        <div class="flex items-center justify-between">
          <span class="text-slate-400">觀察緯度（含南北極點）</span>
          <span id="latLabel" class="font-mono text-slate-100 font-semibold">35° N</span>
        </div>
        <div class="flex flex-wrap items-center gap-1.5">
          <button onclick="setLatitude(90)" class="px-2 py-1 rounded bg-slate-800/90 hover:bg-slate-700 text-sky-300 transition cursor-pointer">北極點</button>
          <button onclick="setLatitude(35)" class="px-2 py-1 rounded bg-slate-800/90 hover:bg-slate-700 text-slate-200 transition cursor-pointer">北半球</button>
          <button onclick="setLatitude(0)" class="px-2 py-1 rounded bg-slate-800/90 hover:bg-slate-700 text-slate-200 transition cursor-pointer">赤道</button>
          <button onclick="setLatitude(-35)" class="px-2 py-1 rounded bg-slate-800/90 hover:bg-slate-700 text-slate-200 transition cursor-pointer">南半球</button>
          <button onclick="setLatitude(-90)" class="px-2 py-1 rounded bg-slate-800/90 hover:bg-slate-700 text-rose-300 transition cursor-pointer">南極點</button>
        </div>
        <input id="latSlider" type="range" min="-90" max="90" value="35" step="1" class="w-full mt-1" />
      </div>

      <!-- 彗星掃尾長度測試滑桿 -->
      <div class="flex flex-col gap-1.5">
        <div class="flex items-center justify-between">
          <span class="text-slate-400">掃尾長度</span>
          <span id="tailLabel" class="font-mono text-slate-100 font-semibold">5/6 圈</span>
        </div>
        <input id="tailSlider" type="range" min="0" max="1" value="0.8333" step="0.0166" class="w-full" />
      </div>

      <!-- 三類代表性恆星分類標示（獨立開關） -->
      <div class="flex flex-col gap-2 pt-2 border-t border-slate-800/80">
        <div class="flex items-center justify-between">
          <span class="text-slate-400">三類代表性恆星分類標示（獨立開關）：</span>
          <button onclick="toggleAllStarClasses()" class="text-[10px] text-sky-400 hover:text-sky-300 cursor-pointer">全部切換</button>
        </div>
        <div class="grid grid-cols-1 gap-1.5 text-[11px]">
          <button onclick="toggleStarClass('northStar')" id="tog-star-northStar" class="toggle-chip px-2.5 py-1.5 rounded-lg border flex items-center justify-between cursor-pointer">
            <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#38BDF8]"></span><span>北天星 (+62°) 拱極／高緯分類標示</span></span>
            <span class="status-badge font-mono text-[10px]">開啟</span>
          </button>
          <button onclick="toggleStarClass('equatorStar')" id="tog-star-equatorStar" class="toggle-chip px-2.5 py-1.5 rounded-lg border flex items-center justify-between cursor-pointer">
            <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#FACC15]"></span><span>天赤道 (0°) 正東昇西落分類標示</span></span>
            <span class="status-badge font-mono text-[10px]">開啟</span>
          </button>
          <button onclick="toggleStarClass('southStar')" id="tog-star-southStar" class="toggle-chip px-2.5 py-1.5 rounded-lg border flex items-center justify-between cursor-pointer">
            <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#FB7185]"></span><span>南天星 (-32°) 偏南／低緯分類標示</span></span>
            <span class="status-badge font-mono text-[10px]">開啟</span>
          </button>
        </div>
      </div>

      <!-- 空間輔助線開關 -->
      <div class="flex flex-col gap-1.5 pt-2 border-t border-slate-800/80">
        <span class="text-slate-400">空間輔助線與幾何標示：</span>
        <div class="flex flex-wrap gap-1.5 text-[11px]">
          <button onclick="toggleAssist('polarAxis')" id="tog-polarAxis" class="toggle-chip px-2 py-1 rounded-md border border-sky-400/50 bg-sky-500/20 text-sky-200 cursor-pointer">✓ 貫穿天軸 (N/S)</button>
          <button onclick="toggleAssist('celestialGrid')" id="tog-celestialGrid" class="toggle-chip px-2 py-1 rounded-md border border-sky-400/50 bg-sky-500/20 text-sky-200 cursor-pointer">✓ 天球經緯網格</button>
          <button onclick="toggleAssist('earthAxes')" id="tog-earthAxes" class="toggle-chip px-2 py-1 rounded-md border border-sky-400/50 bg-sky-500/20 text-sky-200 cursor-pointer">✓ 地球經緯與十字軸</button>
          <button onclick="toggleAssist('cometTrails')" id="tog-cometTrails" class="toggle-chip px-2 py-1 rounded-md border border-sky-400/50 bg-sky-500/20 text-sky-200 cursor-pointer">✓ 彗星掃尾軌跡</button>
          <button onclick="toggleAssist('angleArcs')" id="tog-angleArcs" class="toggle-chip px-2 py-1 rounded-md border border-sky-400/50 bg-sky-500/20 text-sky-200 cursor-pointer">✓ 側視仰角幾何弧線</button>
        </div>
      </div>

    </div>
  </div>

  <!-- 底部五階段、專屬階段子功能列與緯度快捷控制列 -->
  <div id="controlBar" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-10 w-[95%] max-w-4xl transition-opacity duration-300 flex flex-col gap-2">
    <!-- 階段 1 專屬：地球尺度縮放預覽控制列 -->
    <div id="stage1SubBar" class="glass-panel border border-sky-500/30 rounded-xl px-3.5 py-2 flex flex-wrap items-center justify-between gap-2 text-xs shadow-lg">
      <div class="flex items-center gap-2 text-sky-300 font-medium">
        <span id="stage1ScaleHint">🔭 宇宙尺度預覽：觀察地球半徑相對於無窮遠天球極度渺小的幾何意義</span>
      </div>
      <button onclick="toggleEarthScalePreview()" id="earthScaleBtn-1"
              class="earth-scale-btn px-3 py-1 rounded-lg border border-sky-400/50 bg-sky-500/20 hover:bg-sky-500/30 text-sky-200 font-semibold transition cursor-pointer flex items-center gap-1.5 shadow">
        <span>🔭 縮放地球尺度（預覽無窮小）</span>
      </button>
    </div>

    <!-- 階段 2 專屬：三段式手動增速追趕控制列 + 地球尺度縮放 -->
    <div id="chaseSubBar" class="hidden glass-panel border border-amber-500/30 rounded-xl px-3.5 py-2 flex flex-wrap items-center justify-between gap-2 text-xs shadow-lg">
      <div class="flex items-center gap-2 text-amber-300 font-medium">
        <span>🎥 攝影機噴射追趕速度（分段加速）：</span>
      </div>
      <div class="flex flex-wrap items-center gap-1.5">
        <button onclick="setChaseStep(0)" id="chase-step-0" class="chase-btn px-2.5 py-1 rounded-lg border transition cursor-pointer">0% 未加速</button>
        <button onclick="setChaseStep(1)" id="chase-step-1" class="chase-btn px-2.5 py-1 rounded-lg border transition cursor-pointer">一段加速 (33%)</button>
        <button onclick="setChaseStep(2)" id="chase-step-2" class="chase-btn px-2.5 py-1 rounded-lg border transition cursor-pointer">二段加速 (66%)</button>
        <button onclick="setChaseStep(3)" id="chase-step-3" class="chase-btn px-2.5 py-1 rounded-lg border transition cursor-pointer">三段同步 (100%)</button>
        <button onclick="toggleEarthScalePreview()" id="earthScaleBtn-2"
                class="earth-scale-btn ml-1 px-2.5 py-1 rounded-lg border border-sky-400/50 bg-sky-500/20 hover:bg-sky-500/30 text-sky-200 font-semibold transition cursor-pointer flex items-center gap-1 shadow">
          <span>🔭 縮放地球尺度：標準比例</span>
        </button>
      </div>
    </div>

    <!-- 階段 3 專屬：觀察者特寫、切平面與拉遠 -->
    <div id="cutawaySubBar" class="hidden glass-panel border border-cyan-500/30 rounded-xl px-3.5 py-2 flex flex-wrap items-center justify-between gap-2 text-xs shadow-lg">
      <div class="flex items-center gap-2 text-cyan-300 font-medium"><span>🔎 先看空間；拉遠縮小地球至無窮遠比例後，切出完整半顆天球：</span></div>
      <div class="flex items-center gap-1.5">
        <button onclick="setCutawayStep(1)" id="cutaway-step-1" class="cutaway-btn px-2.5 py-1 rounded-lg border transition cursor-pointer">1. 深入觀察者</button>
        <button onclick="setCutawayStep(2)" id="cutaway-step-2" class="cutaway-btn px-2.5 py-1 rounded-lg border transition cursor-pointer">2. 延伸切平面</button>
        <button onclick="setCutawayStep(3)" id="cutaway-step-3" class="cutaway-btn px-2.5 py-1 rounded-lg border transition cursor-pointer">3. 拉遠看全貌</button>
      </div>
    </div>

    <!-- 階段 5 專屬：地平線下左右轉方位控制列 -->
    <div id="azimuthSubBar" class="hidden glass-panel border border-sky-500/30 rounded-xl px-3.5 py-2 flex flex-wrap items-center justify-between gap-2 text-xs shadow-lg">
      <div class="flex items-center gap-2 text-sky-300 font-medium">
        <span>🧭 地平方位旋轉：</span>
        <span id="azimuthStatusText" class="text-slate-200 font-mono">左：南 (S) ｜ 右：北 (N)</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="stepAzimuth(-45)" title="向左旋轉 45°" class="px-3 py-1 rounded-lg border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-semibold transition cursor-pointer">◀ 左轉</button>
        <button onclick="stepAzimuth(45)" title="向右旋轉 45°" class="px-3 py-1 rounded-lg border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-semibold transition cursor-pointer">右轉 ▶</button>
      </div>
    </div>

    <div class="glass-panel rounded-2xl p-2 shadow-2xl flex flex-col gap-1.5">
      <!-- 五階段切換按鈕 -->
      <div class="grid grid-cols-5 gap-1">
        <button id="btn-stage-1" onclick="setStage(1)" class="stage-btn py-1.5 px-1.5 rounded-lg text-[11px] sm:text-xs font-semibold bg-slate-100 text-slate-950 shadow transition cursor-pointer">1. 宇宙視角</button>
        <button id="btn-stage-2" onclick="setStage(2)" class="stage-btn py-1.5 px-1.5 rounded-lg text-[11px] sm:text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition cursor-pointer">2. 噴射追隨</button>
        <button id="btn-stage-3" onclick="setStage(3)" class="stage-btn py-1.5 px-1.5 rounded-lg text-[11px] sm:text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition cursor-pointer">3. 切面描邊</button>
        <button id="btn-stage-4" onclick="setStage(4)" class="stage-btn py-1.5 px-1.5 rounded-lg text-[11px] sm:text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition cursor-pointer">4. 扶正地平</button>
        <button id="btn-stage-5" onclick="setStage(5)" class="stage-btn py-1.5 px-1.5 rounded-lg text-[11px] sm:text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition cursor-pointer">5. 側視剖面</button>
      </div>

      <!-- 緯度快捷按鈕列（含北極點、北半球、赤道、南半球、南極點） + 階段 1/2 地球尺度縮放預覽 -->
      <div class="flex flex-wrap items-center justify-between gap-1.5 pt-1 border-t border-slate-800/80">
        <div class="flex flex-wrap items-center gap-1">
          <button id="quick-lat-90" onclick="setLatitude(90)" class="quick-lat-btn py-1 px-2 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 border border-transparent transition cursor-pointer">北極點 (90°N)</button>
          <button id="quick-lat-35" onclick="setLatitude(35)" class="quick-lat-btn py-1 px-2 rounded-lg text-xs font-semibold bg-sky-500/25 border border-sky-400/50 text-sky-200 transition cursor-pointer">北半球 (35°N)</button>
          <button id="quick-lat-0" onclick="setLatitude(0)" class="quick-lat-btn py-1 px-2 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 border border-transparent transition cursor-pointer">赤道 (0°)</button>
          <button id="quick-lat--35" onclick="setLatitude(-35)" class="quick-lat-btn py-1 px-2 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 border border-transparent transition cursor-pointer">南半球 (35°S)</button>
          <button id="quick-lat--90" onclick="setLatitude(-90)" class="quick-lat-btn py-1 px-2 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 border border-transparent transition cursor-pointer">南極點 (90°S)</button>
        </div>

        <button id="quickEarthScaleBtn" onclick="toggleEarthScalePreview()"
                class="py-1 px-2.5 rounded-lg text-xs font-semibold border border-sky-400/50 bg-sky-500/20 hover:bg-sky-500/30 text-sky-200 transition cursor-pointer flex items-center gap-1">
          <span>🔭 縮放地球尺度</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");

    // =========================================================================
    // 物理與教學動畫狀態變數
    // =========================================================================
    const DEG = Math.PI / 180;
    const TWO_PI = Math.PI * 2;

    let stage = 1;                // 1: 宇宙視角, 2: 攝影機追隨, 3: 切平面與描邊, 4: 扶正地平, 5: 左南右北側視
    let targetLat = 35;           // 目標緯度 (-90 ~ +90)
    let currentLat = 35;          // 平滑插值緯度
    let maxTailFraction = 5 / 6;  // 預設掃尾長度 5/6 圈
    let isPaused = false;
    let uiHidden = false;
    let settingsOpen = false;

    // 階段 2：分段追趕速度控制 (0: 0% 未加速, 1: 33%, 2: 66%, 3: 100%)
    let chaseStep = 0;            // 預設從 0% 未加速開始
    let targetChaseRatio = 0.0;
    let currentChaseRatio = 0.0;

    // 階段 2 貼近觀察者的 Zoom In 進度 (0 -> 1)
    let zoomInProgress = 0;
    let localZoomProgress = 0;

    // 階段 3：先長出與地球相切的觀察者地平面，再拉遠並將地球縮小至無窮遠尺度，切出完整半顆天球
    let planeGrowProgress = 0;
    let zoomOutCutProgress = 0;

    // 階段 4：扶正地平面為水平 (levelProgress: 0 -> 1)
    let levelProgress = 0;

    // 階段 5：將已扶正的半球轉向側視剖面 (sideProfileProgress: 0 -> 1) 並支援左右旋轉方位角
    let sideProfileProgress = 0;
    let targetSideYawOffset = 0;
    let currentSideYawOffset = 0;
    let cutawayStep = 0;
    let reverseMode = false;
    let inverseAzimuthActive = false;
    let inverseAzimuthAnchor = 0;

    // 北極星單束連續脈衝光束狀態（開關開啟時持續發射脈衝波）
    let polarisPulseEnabled = false;
    let polarisPulseTime = 0;
    let polarisBeamFade = 0;

    // 階段 1 與階段 2 地球尺度縮放預覽狀態（true = 縮小至無窮遠微點）
    let earthScalePreview = false;
    let earthScalePreviewProgress = 0;

    // 旋轉累積角（地球自轉 & 天球反轉）
    let earthAngle = 0;
    let skyAngle = 0;

    // 噴射火焰粒子系統
    const flameParticles = [];

    // 空間輔助線與幾何標示開關狀態
    const assists = {
      polarAxis: true,      // 貫穿畫面邊界的南北極天軸 (含 N/S 標示)
      celestialGrid: true,  // 天球經緯網格（增強球體立體感）
      earthAxes: true,      // 地球經緯與 ±X / ±Z 十字座標軸
      cometTrails: true,    // 彗星漸暗掃尾軌跡
      angleArcs: true       // 階段 5 側視仰角幾何弧線與度數標示
    };

    // 三類代表性恆星分類標示（獨立開關狀態）
    const starLabelToggles = {
      northStar: true,
      equatorStar: true,
      southStar: true
    };

    // 使用者滑鼠拖曳微調視角
    let userYaw = 0;
    let userPitch = 0;
    let recenterUserView = false;
    let pendingStage = null;
    let isDragging = false;
    let lastMouse = { x: 0, y: 0 };
    let dragDist = 0;

    // 地球大陸簡化輪廓多邊形（經緯度座標，增加地球自轉時的強烈視覺參照）
    const continents = [
      [[10, 35], [40, 42], [85, 55], [125, 45], [135, 22], [105, 12], [78, 8], [50, 12], [35, -25], [18, -33], [12, 5], [-12, 15], [-5, 34]],

    const indicatorStars = [

    // =========================================================================
    // 3D 向量與旋轉數學核心
    // =========================================================================
    function rotX(p, rad) {
      const c = Math.cos(rad), s = Math.sin(rad);
      return { x: p.x, y: p.y * c - p.z * s, z: p.y * s + p.z * c };
    }
    function rotY(p, rad) {
      const c = Math.cos(rad), s = Math.sin(rad);
      return { x: p.x * c + p.z * s, y: p.y, z: -p.x * s + p.z * c };
    }
    function rotZ(p, rad) {
      const c = Math.cos(rad), s = Math.sin(rad);
      return { x: p.x * c - p.y * s, y: p.x * s + p.y * c, z: p.z };
    }
    function sphToCart(r, latDeg, lonRad) {
      const lat = latDeg * DEG;
      return {
        x: r * Math.cos(lat) * Math.sin(lonRad),
        y: r * Math.sin(lat),
        z: r * Math.cos(lat) * Math.cos(lonRad)
      };
    }
    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }
    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    // 觀察者天頂單位向量
    function getZenithVec(latDeg) {
      const lat = latDeg * DEG;
      return { x: 0, y: Math.sin(lat), z: Math.cos(lat) };
    }

    // 計算某點在觀察者地平面上的高度（> 0 表示在地平線以上，< 0 表示在地平線以下）
    function horizonDot(p, latDeg) {
      const zVec = getZenithVec(latDeg);
      return p.x * zVec.x + p.y * zVec.y + p.z * zVec.z;
    }

    // 根據當前觀察緯度與星體赤緯，動態計算星體在當地天空的分類描述
    function getStarBehaviorDesc(starLat, obsLat) {
      const absObs = Math.abs(obsLat);
      if (absObs >= 89.5) {
        if ((obsLat > 0 && starLat > 0) || (obsLat < 0 && starLat < 0)) {
          return "周極平行繞轉（永不沒入）";
        } else if (Math.abs(starLat) < 0.5) {
          return "貼地平線水平繞轉";
        } else {
          return "位於地平線下（永不可見）";
        }
      }
      if (absObs < 0.5) {
        if (Math.abs(starLat) < 0.5) return "正東昇、正西落（過天頂）";
        return starLat > 0 ? "東北昇、西北落（垂直地面）" : "東南昇、西南落（垂直地面）";
      }
      if (obsLat > 0) {
        if (starLat >= 90 - obsLat) return "拱極恆顯星（永不沒入地平）";
        if (starLat <= -(90 - obsLat)) return "恆隱星（永不昇出地平）";
        if (Math.abs(starLat) < 0.5) return "天赤道（正東昇、正西落）";
        return starLat > 0 ? "東北昇、西北落（可見＞12hr）" : "東南昇、西南落（可見＜12hr）";
      } else {
        if (starLat <= -90 - obsLat) return "南天恆顯星（永不沒入地平）";
        if (starLat >= 90 + obsLat) return "恆隱星（永不昇出地平）";
        if (Math.abs(starLat) < 0.5) return "天赤道（正東昇、正西落）";
        return starLat < 0 ? "東南昇、西南落（可見＞12hr）" : "東北昇、西北落（可見＜12hr）";
      }
    }

    // 繪製純文字標籤（無卡片底框，僅保留微弱深色外暈確保清晰可讀）
    function drawCleanText(text, x, y, color, font = "bold 12px -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif", align = "center") {
      ctx.save();
      ctx.font = font;
      ctx.textAlign = align;
      ctx.textBaseline = "middle";
      ctx.shadowColor = "rgba(5, 8, 16, 0.95)";
      ctx.shadowBlur = 5;
      ctx.fillStyle = color;
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    // 專為階段 3 設計：計算被切出的觀察半球在 2D 畫面上的「真實球面裁切輪廓路徑」
    function buildObservedHemispherePath(cx, cy, R_cel, obsDir3D, planeCenter3D, latRad, projectFn) {
      const rDisk = Math.sqrt(Math.max(0, R_cel * R_cel - (planeCenter3D.x ** 2 + planeCenter3D.y ** 2 + planeCenter3D.z ** 2)));
      const N = 160;
      const rimPts = [];
      for (let i = 0; i < N; i++) {
        const az = (i / N) * TWO_PI;
        const north = Math.cos(az), east = Math.sin(az);
        const p3 = {
          x: planeCenter3D.x + rDisk * east,
          y: planeCenter3D.y + rDisk * north * Math.cos(latRad),
          z: planeCenter3D.z - rDisk * north * Math.sin(latRad)
        };
        const p2 = projectFn(p3);
        const dx = p2.sx - cx;
        const dy = p2.sy - cy;
        rimPts.push({
          sx: p2.sx,
          sy: p2.sy,
          z: p2.z,
          r2d: Math.hypot(dx, dy),
          ang: Math.atan2(dy, dx)
        });
      }

      let startIdx = -1;
      for (let i = 0; i < N; i++) {
        const prev = rimPts[(i - 1 + N) % N];
        const curr = rimPts[i];
        if (prev.z < 0 && curr.z >= 0) {
          startIdx = i;
          break;
        }
      }

      const path = new Path2D();
      if (startIdx === -1) {
        rimPts.forEach((pt, idx) => idx === 0 ? path.moveTo(pt.sx, pt.sy) : path.lineTo(pt.sx, pt.sy));
        path.closePath();
        return path;
      }

      const frontArc = [];
      let idx = startIdx;
      while (rimPts[idx].z >= 0 && frontArc.length < N) {
        frontArc.push(rimPts[idx]);
        idx = (idx + 1) % N;
      }

      if (frontArc.length < 2) {
        path.arc(cx, cy, R_cel, 0, TWO_PI);
        return path;
      }

      const pStart = frontArc[0];
      const pEnd = frontArc[frontArc.length - 1];

      path.moveTo(pStart.sx, pStart.sy);
      for (let i = 1; i < frontArc.length; i++) {
        path.lineTo(frontArc[i].sx, frontArc[i].sy);
      }

      const zenPt = projectFn({
        x: obsDir3D.x * R_cel,
        y: obsDir3D.y * R_cel,
        z: obsDir3D.z * R_cel
      });
      const zenAng = Math.atan2(zenPt.sy - cy, zenPt.sx - cx);
      const aEnd = Math.atan2(pEnd.sy - cy, pEnd.sx - cx);
      const aStart = Math.atan2(pStart.sy - cy, pStart.sx - cx);

      const norm = (a) => ((a % TWO_PI) + TWO_PI) % TWO_PI;
      const ccwSpan = norm(aStart - aEnd);
      const ccwToZen = norm(zenAng - aEnd);
      const anticlockwise = !(ccwToZen <= ccwSpan);

      path.arc(cx, cy, R_cel, aEnd, aStart, anticlockwise);
      path.closePath();
      return path;
    }

    function setStage(newStage) {
      const requestedStage = Math.max(1, Math.min(5, newStage));
      if (reverseMode && stage === 5 && requestedStage === 3) {
        setStage(4);
        return;
      }
      if (Math.abs(userYaw) > 0.001 || Math.abs(userPitch) > 0.001) {
        pendingStage = requestedStage;
        recenterUserView = true;
        return;
      }
      pendingStage = null;
      const previousStage = stage;
      if (previousStage === 5 && requestedStage === 4 && reverseMode) {
        inverseAzimuthAnchor = targetSideYawOffset;
        inverseAzimuthActive = true;
      }
      stage = requestedStage;
      if (stage > 2 && earthScalePreview) {
        earthScalePreview = false;
      }
      if (stage === 1) {
        setChaseStep(0);
        cutawayStep = 0;
        inverseAzimuthActive = false;
      } else if (stage === 2) {
        setChaseStep(0);
        inverseAzimuthActive = false;
      } else if (stage === 3) {
        setChaseStep(3);
        if (previousStage < 3) cutawayStep = 1;
        else if (previousStage === 4 || previousStage === 5) cutawayStep = 3;
      } else if (stage === 4) {
        setChaseStep(3);
        cutawayStep = 3;
      } else if (stage === 5) {
        setChaseStep(3);
        cutawayStep = 3;
        if (previousStage < 4) targetSideYawOffset = currentSideYawOffset;
      }
      updateUI();
      updateAzimuthUI();
    }

    function getCardinalName(deg) {
      const norm = ((Math.round(deg) % 360) + 360) % 360;
      const dirs = [
        { a: 0, name: "北 (N)" },
        { a: 45, name: "東北 (NE)" },
        { a: 90, name: "東 (E)" },
        { a: 135, name: "東南 (SE)" },
        { a: 180, name: "南 (S)" },
        { a: 225, name: "西南 (SW)" },
        { a: 270, name: "西 (W)" },
        { a: 315, name: "西北 (NW)" }
      ];
      let best = dirs[0], minD = 999;
      dirs.forEach(d => {
        const dist = Math.min(Math.abs(norm - d.a), 360 - Math.abs(norm - d.a));
        if (dist < minD) { minD = dist; best = d; }
      });
      return best.name;
    }
