<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>天球週日運動 — 3D 互動教學動畫（課堂教學版）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden;
      background-color: #050810;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }
    .glass-panel {
      background: rgba(10, 15, 28, 0.84);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.2);
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: rgba(148, 163, 184, 0.25);
      border-radius: 999px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f8fafc;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(248, 250, 252, 0.7);
    }
    .toggle-chip {
      transition: all 0.18s ease;
    }
  </style>
</head>
<body>

  <!-- 全螢幕主畫布（單擊空白處可隱藏/顯示控制列） -->
  <canvas id="scene"></canvas>

  <!-- 左上角教師課堂引導提示 -->
  <div id="topHint" class="fixed top-4 left-4 z-10 pointer-events-none transition-opacity duration-300 max-w-lg">
    <div class="glass-panel px-4 py-2.5 rounded-xl flex items-center gap-3 text-xs sm:text-[13px] text-slate-100 shadow-lg">
      <span id="stageBadge" class="px-2.5 py-0.5 rounded-md bg-sky-500/20 border border-sky-400/40 text-sky-200 font-semibold shrink-0">階段 1 / 5</span>
      <span id="stageDesc" class="text-slate-100 leading-relaxed">從宇宙視角觀察，天球遠比地球龐大得多。在接近實際尺度下，地球原本就只是一個微小的點，並沿著傾斜的自轉軸持續自轉。</span>
    </div>
  </div>

  <!-- 右上角三層緊湊工具區（播放與系統控制 / 教學圖層與全階段尺度 / 觀察者緯度快捷） -->
  <div id="topRightTools" class="fixed top-4 right-4 z-10 flex flex-col items-end gap-1.5 transition-opacity duration-300">
    <!-- 第一層：重播、逆推、播放/暫停、設定 -->
    <div class="flex items-center justify-end gap-1.5">
      <button id="replayBtn" onclick="replayCurrentAction()" title="重播目前步驟動畫"
              class="glass-panel hover:bg-slate-800/90 text-slate-200 text-xs px-3 py-1.5 rounded-xl transition cursor-pointer flex items-center gap-1 shadow-lg">
        <span>重播</span>
      </button>
      <button onclick="toggleReverseMode()" id="reverseModeBtn" title="保留逆推模式，逐步返回前面的視角"
              class="glass-panel px-3 py-1.5 rounded-xl border border-violet-500/40 bg-violet-500/15 hover:bg-violet-500/25 text-violet-200 text-xs font-semibold transition cursor-pointer shadow-lg">
        逆推：關
      </button>
      <button id="pauseBtn" onclick="togglePause()" title="播放或暫停（快捷鍵：空白鍵 Space）"
              class="glass-panel hover:bg-slate-800/90 text-slate-200 text-xs px-3.5 py-1.5 rounded-xl transition cursor-pointer font-medium shadow-lg">
        暫停
      </button>
      <button id="gearBtn" onclick="toggleSettingsDrawer()" title="參數微調與空間輔助線設定"
              class="glass-panel hover:bg-slate-800/90 text-slate-200 text-xs px-3 py-1.5 rounded-xl transition cursor-pointer font-medium shadow-lg">
        設定
      </button>
    </div>

    <!-- 第二層：北極星方位、星座與地球尺度（全階段皆可切換） -->
    <div class="flex flex-wrap max-w-[calc(100vw-2rem)] items-center justify-end gap-1.5">
      <button id="polarisRayBtn" onclick="togglePolarisRay()" title="開啟後顯示北極星方向光束，演示無窮遠平行星光與極星仰角原理"
              class="glass-panel hover:bg-sky-500/25 border border-slate-700 bg-slate-900/75 text-slate-300 text-xs font-semibold px-3 py-1.5 rounded-xl transition cursor-pointer flex items-center gap-1.5 shadow-lg">
        <span id="polarisRayDot" class="w-2 h-2 rounded-full bg-slate-500 transition-colors"></span>
        <span id="polarisRayText">北極星方位顯示：關</span>
      </button>
      <button id="constellationBtn" onclick="toggleConstellations()" title="各階段皆可開關星座，星座隨天球座標旋轉"
              class="glass-panel border border-sky-400/50 bg-sky-500/20 text-sky-200 text-xs font-semibold px-3 py-1.5 rounded-xl transition cursor-pointer shadow-lg" aria-pressed="true">
        <span id="constellationText">星座顯示：開</span>
      </button>
      <button id="earthScaleBtn" onclick="toggleEarthScale()" title="階段 1～5 任一步驟皆可隨時切換接近實際尺度與誇張地球尺度"
              class="glass-panel hover:bg-sky-500/25 border border-sky-400/50 bg-sky-500/20 text-sky-200 text-xs font-semibold px-3 py-1.5 rounded-xl transition cursor-pointer flex items-center gap-1.5 shadow-lg">
        <span id="earthScaleText">地球顯示尺度：接近實際尺度</span>
      </button>
    </div>

    <!-- 第三層：觀察者緯度快捷切換（北極點、北半球、赤道、南半球、南極點） -->
    <div class="glass-panel p-1 rounded-xl flex items-center gap-0.5 shadow-lg">
      <button id="quick-lat-90" onclick="setLatitude(90)" class="quick-lat-btn py-1 px-2 rounded-lg text-[11px] font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 border border-transparent transition cursor-pointer">北極點</button>
      <button id="quick-lat-35" onclick="setLatitude(35)" class="quick-lat-btn py-1 px-2 rounded-lg text-[11px] font-semibold bg-sky-500/25 border border-sky-400/50 text-sky-200 transition cursor-pointer">北半球</button>
      <button id="quick-lat-0" onclick="setLatitude(0)" class="quick-lat-btn py-1 px-2 rounded-lg text-[11px] font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 border border-transparent transition cursor-pointer">赤道</button>
      <button id="quick-lat--35" onclick="setLatitude(-35)" class="quick-lat-btn py-1 px-2 rounded-lg text-[11px] font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 border border-transparent transition cursor-pointer">南半球</button>
      <button id="quick-lat--90" onclick="setLatitude(-90)" class="quick-lat-btn py-1 px-2 rounded-lg text-[11px] font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 border border-transparent transition cursor-pointer">南極點</button>
    </div>
  </div>

  <!-- 可收合參數與輔助線設定面板（點擊右上角「設定」開啟） -->
  <div id="settingsDrawer" class="hidden fixed top-32 right-4 z-20 w-[92%] max-w-md transition-all duration-200">
    <div class="glass-panel rounded-2xl p-4 shadow-2xl flex flex-col gap-3.5 text-xs text-slate-300 border border-slate-700/80">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <span class="font-semibold text-slate-100">參數微調與空間輔助線</span>
        <button onclick="toggleSettingsDrawer()" class="text-slate-400 hover:text-white px-1.5 py-0.5 rounded cursor-pointer">✕</button>
      </div>

      <!-- 觀察位置（緯度）滑桿微調 -->
      <div class="flex flex-col gap-1.5">
        <div class="flex items-center justify-between">
          <span class="text-slate-400">觀察緯度微調（-90° ~ +90°）</span>
          <span id="latLabel" class="font-mono text-slate-100 font-semibold">35° N</span>
        </div>
        <input id="latSlider" type="range" min="-90" max="90" value="35" step="1" class="w-full mt-1" />
      </div>

      <!-- 彗星掃尾長度測試滑桿 -->
      <div class="flex flex-col gap-1.5">
        <div class="flex items-center justify-between">
          <span class="text-slate-400">掃尾長度</span>
          <span id="tailLabel" class="font-mono text-slate-100 font-semibold">5/6 圈</span>
        </div>
        <input id="tailSlider" type="range" min="0" max="1" value="0.8333" step="0.0166" class="w-full" />
      </div>

      <!-- 三類代表性恆星分類標示（獨立開關） -->
      <div class="flex flex-col gap-2 pt-2 border-t border-slate-800/80">
        <div class="flex items-center justify-between">
          <span class="text-slate-400">三類代表性恆星分類標示（獨立開關）：</span>
          <button onclick="toggleAllStarClasses()" class="text-[10px] text-sky-400 hover:text-sky-300 cursor-pointer">全部切換</button>
        </div>
        <div class="grid grid-cols-1 gap-1.5 text-[11px]">
          <button onclick="toggleStarClass('northStar')" id="tog-star-northStar" class="toggle-chip px-2.5 py-1.5 rounded-lg border flex items-center justify-between cursor-pointer">
            <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#38BDF8]"></span><span>北天星 (+62°) 拱極／高緯分類標示</span></span>
            <span class="status-badge font-mono text-[10px]">開啟</span>
          </button>
          <button onclick="toggleStarClass('equatorStar')" id="tog-star-equatorStar" class="toggle-chip px-2.5 py-1.5 rounded-lg border flex items-center justify-between cursor-pointer">
            <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#FACC15]"></span><span>天赤道 (0°) 正東昇西落分類標示</span></span>
            <span class="status-badge font-mono text-[10px]">開啟</span>
          </button>
          <button onclick="toggleStarClass('southStar')" id="tog-star-southStar" class="toggle-chip px-2.5 py-1.5 rounded-lg border flex items-center justify-between cursor-pointer">
            <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#FB7185]"></span><span>南天星 (-32°) 偏南／低緯分類標示</span></span>
            <span class="status-badge font-mono text-[10px]">開啟</span>
          </button>
        </div>
      </div>

      <!-- 空間輔助線開關 -->
      <div class="flex flex-col gap-1.5 pt-2 border-t border-slate-800/80">
        <span class="text-slate-400">空間輔助線與幾何標示：</span>
        <div class="flex flex-wrap gap-1.5 text-[11px]">
          <button onclick="toggleAssist('polarAxis')" id="tog-polarAxis" class="toggle-chip px-2 py-1 rounded-md border border-sky-400/50 bg-sky-500/20 text-sky-200 cursor-pointer">✓ 貫穿天軸 (N/S)</button>
          <button onclick="toggleAssist('celestialGrid')" id="tog-celestialGrid" class="toggle-chip px-2 py-1 rounded-md border border-sky-400/50 bg-sky-500/20 text-sky-200 cursor-pointer">✓ 天球經緯網格</button>
          <button onclick="toggleAssist('earthAxes')" id="tog-earthAxes" class="toggle-chip px-2 py-1 rounded-md border border-sky-400/50 bg-sky-500/20 text-sky-200 cursor-pointer">✓ 地球經緯與十字軸</button>
          <button onclick="toggleAssist('cometTrails')" id="tog-cometTrails" class="toggle-chip px-2 py-1 rounded-md border border-sky-400/50 bg-sky-500/20 text-sky-200 cursor-pointer">✓ 彗星掃尾軌跡</button>
          <button onclick="toggleAssist('angleArcs')" id="tog-angleArcs" class="toggle-chip px-2 py-1 rounded-md border border-sky-400/50 bg-sky-500/20 text-sky-200 cursor-pointer">✓ 側視仰角幾何弧線</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部五階段與簡報上一頁／下一頁導覽列（第二層靠右緊緻排版） -->
  <div id="controlBar" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-10 w-[96%] max-w-4xl transition-opacity duration-300 flex flex-col items-end gap-2">
    <!-- 階段 1 專屬：地球顯示尺度切換（靠右緊緻） -->
    <div id="scaleSubBar" class="glass-panel border border-sky-500/30 rounded-xl px-3.5 py-2 w-fit max-w-full self-end flex flex-wrap items-center justify-end gap-2 text-xs shadow-lg">
      <div class="flex items-center text-sky-300 font-medium">
        <span>初始模型：</span>
      </div>
      <div class="flex flex-wrap items-center gap-1.5">
        <button onclick="setIntroStep(1)" id="intro-step-1" class="scale-step-btn px-2.5 py-1 rounded-lg border transition cursor-pointer">1-1 星座初始情況</button>
        <button onclick="setIntroStep(2)" id="intro-step-2" class="scale-step-btn px-2.5 py-1 rounded-lg border transition cursor-pointer">1-2 簡化恆星</button>
        <button onclick="setIntroStep(3)" id="intro-step-3" class="scale-step-btn px-2.5 py-1 rounded-lg border transition cursor-pointer">1-3 誇大地球尺寸</button>
      </div>
    </div>

    <!-- 階段 2 專屬：座標同步程度控制列（靠右緊緻） -->
    <div id="chaseSubBar" class="hidden glass-panel border border-amber-500/30 rounded-xl px-3.5 py-2 w-fit max-w-full self-end flex flex-wrap items-center justify-end gap-2 text-xs shadow-lg">
      <div class="flex items-center text-amber-300 font-medium">
        <span>座標同步程度：</span>
      </div>
      <div class="flex flex-wrap items-center gap-1.5">
        <button onclick="setChaseStep(0, true)" id="chase-intro" class="chase-btn px-2.5 py-1 rounded-lg border transition cursor-pointer">2-1 顯示星座</button>
        <button onclick="setChaseStep(0)" id="chase-step-0" class="chase-btn px-2.5 py-1 rounded-lg border transition cursor-pointer">2-2 0% 未同步</button>
        <button onclick="setChaseStep(1)" id="chase-step-1" class="chase-btn px-2.5 py-1 rounded-lg border transition cursor-pointer">2-3 30% 同步</button>
        <button onclick="setChaseStep(2)" id="chase-step-2" class="chase-btn px-2.5 py-1 rounded-lg border transition cursor-pointer">2-4 70% 同步</button>
        <button onclick="setChaseStep(3)" id="chase-step-3" class="chase-btn px-2.5 py-1 rounded-lg border transition cursor-pointer">2-5 100% 同步</button>
      </div>
    </div>

    <!-- 階段 3 專屬：六步驟切面描邊與尺度演進（靠右緊緻） -->
    <div id="cutawaySubBar" class="hidden glass-panel border border-cyan-500/30 rounded-xl px-3.5 py-2 w-fit max-w-full self-end flex flex-wrap items-center justify-end gap-1.5 text-xs shadow-lg">
      <button onclick="setCutawayStep(1)" id="cutaway-step-1" class="cutaway-btn px-2.5 py-1 rounded-lg border transition cursor-pointer">3-1 地表切平面</button>
      <button onclick="setCutawayStep(2)" id="cutaway-step-2" class="cutaway-btn px-2.5 py-1 rounded-lg border transition cursor-pointer">3-2 接近實際尺度</button>
      <button onclick="setCutawayStep(3)" id="cutaway-step-3" class="cutaway-btn px-2.5 py-1 rounded-lg border transition cursor-pointer">3-3 拉遠天球視角</button>
      <button onclick="setCutawayStep(4)" id="cutaway-step-4" class="cutaway-btn px-2.5 py-1 rounded-lg border transition cursor-pointer">3-4 切出天球平面</button>
      <button onclick="setCutawayStep(5)" id="cutaway-step-5" class="cutaway-btn px-2.5 py-1 rounded-lg border transition cursor-pointer">3-5 描繪半球邊線</button>
      <button onclick="setCutawayStep(6)" id="cutaway-step-6" class="cutaway-btn px-2.5 py-1 rounded-lg border transition cursor-pointer">3-6 誇張地球尺度</button>
    </div>

    <!-- 階段 5 專屬：地平線下左右轉方位控制列（靠右緊緻） -->
    <div id="azimuthSubBar" class="hidden glass-panel border border-sky-500/30 rounded-xl px-3.5 py-2 w-fit max-w-full self-end flex flex-wrap items-center justify-end gap-2.5 text-xs shadow-lg">
      <div class="flex items-center gap-1.5 text-sky-300 font-medium">
        <span>地平方位旋轉：</span>
        <span id="azimuthStatusText" class="text-slate-200 font-mono">左：南 (S) ｜ 右：北 (N)</span>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="stepAzimuth(-45)" title="向左旋轉 45°" class="px-3 py-1 rounded-lg border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-semibold transition cursor-pointer">◀ 左轉</button>
        <button onclick="stepAzimuth(45)" title="向右旋轉 45°" class="px-3 py-1 rounded-lg border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-semibold transition cursor-pointer">右轉 ▶</button>
      </div>
    </div>

    <!-- 主導覽列：上一頁 + 五階段按鈕 + 下一頁 -->
    <div class="glass-panel rounded-2xl p-1.5 shadow-2xl flex items-center gap-1.5 w-full">
      <button id="prevSlideBtn" onclick="prevSlide()" title="上一步驟（快捷鍵：方向鍵 ← / PageUp）"
              class="px-3 py-2 rounded-xl border border-slate-700/90 bg-slate-800/80 hover:bg-slate-700 text-slate-100 text-xs font-semibold transition cursor-pointer shrink-0 flex items-center gap-1">
        <span>◀ 上一頁</span>
      </button>

      <div class="grid grid-cols-5 gap-1 flex-1">
        <button id="btn-stage-1" onclick="setStage(1)" class="stage-btn py-2 px-1.5 rounded-xl text-[11px] sm:text-xs font-semibold bg-slate-100 text-slate-950 shadow transition cursor-pointer">1. 宇宙視角</button>
        <button id="btn-stage-2" onclick="setStage(2)" class="stage-btn py-2 px-1.5 rounded-xl text-[11px] sm:text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition cursor-pointer">2. 座標轉換</button>
        <button id="btn-stage-3" onclick="setStage(3)" class="stage-btn py-2 px-1.5 rounded-xl text-[11px] sm:text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition cursor-pointer">3. 切面描邊</button>
        <button id="btn-stage-4" onclick="setStage(4)" class="stage-btn py-2 px-1.5 rounded-xl text-[11px] sm:text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition cursor-pointer">4. 扶正地平</button>
        <button id="btn-stage-5" onclick="setStage(5)" class="stage-btn py-2 px-1.5 rounded-xl text-[11px] sm:text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition cursor-pointer">5. 側視剖面</button>
      </div>

      <button id="nextSlideBtn" onclick="nextSlide()" title="下一步驟（快捷鍵：方向鍵 → / PageDown）"
              class="px-3 py-2 rounded-xl border border-sky-400/50 bg-sky-500/25 hover:bg-sky-500/35 text-sky-100 text-xs font-semibold transition cursor-pointer shrink-0 flex items-center gap-1">
        <span>下一頁 ▶</span>
      </button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");

    // =========================================================================
    // 物理與教學動畫狀態變數
    // =========================================================================
    const DEG = Math.PI / 180;
    const TWO_PI = Math.PI * 2;
    const CHASE_RATIOS = [0.0, 0.3, 0.7, 1.0];

    let stage = 1;                // 1: 宇宙視角, 2: 座標轉換, 3: 切面描邊, 4: 扶正地平, 5: 側視剖面
    let targetLat = 35;           // 目標緯度 (-90 ~ +90)
    let currentLat = 35;          // 平滑插值緯度
    let maxTailFraction = 5 / 6;  // 預設掃尾長度 5/6 圈
    let isPaused = false;
    let uiHidden = false;
    let settingsOpen = false;

    // 階段 2：座標同步程度控制 (0: 0% 未同步, 1: 30% 同步, 2: 70% 同步, 3: 100% 同步)
    let chaseStep = 0;
    let syncIntro = false;
    let targetChaseRatio = 0.0;
    let currentChaseRatio = 0.0;

    // 階段 2 貼近觀察者的 Zoom In 進度 (0 -> 1)
    let zoomInProgress = 0;

    // 階段 3 六步驟細分進度：
    // 3-1: localZoomProgress (鏡頭貼近地表 + 腳下局部小圓盤出現)
    // 3-2: isEarthTiny = true + centerAnchorProgress = 1 (地球縮為接近實際尺度微點，切面無縫收斂為過地球球心)
    // 3-3: zoomOutCutProgress (保持接近實際尺度，鏡頭拉遠顯示完整巨型天球)
    // 3-4: planeGrowProgress (將過球心平面向外延伸，完整切穿整顆天球)
    // 3-5: intersectionLineProgress (描繪平面與天球相交的亮色大圓邊線，區分上下半球)
    // 3-6: isEarthTiny = false (切回誇張地球尺度，以球心為原點原地放大，平面不平移)
    let localZoomProgress = 0;
    let centerAnchorProgress = 0;
    let zoomOutCutProgress = 0;
    let planeGrowProgress = 0;
    let intersectionLineProgress = 0;

    // 階段 4：扶正地平面為水平 (levelProgress: 0 -> 1)
    let levelProgress = 0;

    // 階段 5：將已扶正的半球轉向側視剖面 (sideProfileProgress: 0 -> 1)

    // =========================================================================
    // 3D 向量、旋轉與四元數 SLERP 剛體旋轉核心
    // =========================================================================
    function quatFromAxisAngle(ax, ay, az, rad) {
      const half = rad * 0.5;
      const s = Math.sin(half);
      return { x: ax * s, y: ay * s, z: az * s, w: Math.cos(half) };
    }
    function quatMul(a, b) {
      return {
        w: a.w * b.w - a.x * b.x - a.y * b.y - a.z * b.z,
        x: a.w * b.x + a.x * b.w + a.y * b.z - a.z * b.y,
        y: a.w * b.y - a.x * b.z + a.y * b.w + a.z * b.x,
        z: a.w * b.z + a.x * b.y - a.y * b.x + a.z * b.w
      };
    }
    function quatSlerp(qa, qb, t) {
      let bx = qb.x, by = qb.y, bz = qb.z, bw = qb.w;
      let cosHalfTheta = qa.x * bx + qa.y * by + qa.z * bz + qa.w * bw;
      if (cosHalfTheta < 0) {
        bx = -bx; by = -by; bz = -bz; bw = -bw;
        cosHalfTheta = -cosHalfTheta;
      }
      if (cosHalfTheta >= 0.9999) {
        const len = Math.hypot(
          qa.x + (bx - qa.x) * t,
          qa.y + (by - qa.y) * t,
          qa.z + (bz - qa.z) * t,
          qa.w + (bw - qa.w) * t
        ) || 1;
        return {
          x: (qa.x + (bx - qa.x) * t) / len,
          y: (qa.y + (by - qa.y) * t) / len,
          z: (qa.z + (bz - qa.z) * t) / len,
          w: (qa.w + (bw - qa.w) * t) / len
        };
      }
      const halfTheta = Math.acos(Math.min(1, Math.max(-1, cosHalfTheta)));
      const sinHalfTheta = Math.sqrt(1 - cosHalfTheta * cosHalfTheta);
      const ratioA = Math.sin((1 - t) * halfTheta) / sinHalfTheta;
      const ratioB = Math.sin(t * halfTheta) / sinHalfTheta;
      return {
        x: qa.x * ratioA + bx * ratioB,
        y: qa.y * ratioA + by * ratioB,
        z: qa.z * ratioA + bz * ratioB,
        w: qa.w * ratioA + bw * ratioB
      };
    }
    function applyQuat(p, q) {
      const ix =  q.w * p.x + q.y * p.z - q.z * p.y;
      const iy =  q.w * p.y + q.z * p.x - q.x * p.z;
      const iz =  q.w * p.z + q.x * p.y - q.y * p.x;
      const iw = -q.x * p.x - q.y * p.y - q.z * p.z;
      return {
        x: ix * q.w + iw * -q.x + iy * -q.z - iz * -q.y,
        y: iy * q.w + iw * -q.y + iz * -q.x - ix * -q.z,
        z: iz * q.w + iw * -q.z + ix * -q.y - iy * -q.x
      };
    }

    function sphToCart(r, latDeg, lonRad) {
      const lat = latDeg * DEG;
      return {
        x: r * Math.cos(lat) * Math.sin(lonRad),
        y: r * Math.sin(lat),
        z: r * Math.cos(lat) * Math.cos(lonRad)
      };
    }
    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }
    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function getZenithVec(latDeg) {
      const lat = latDeg * DEG;
      return { x: 0, y: Math.sin(lat), z: Math.cos(lat) };
    }

    function horizonDot(p, latDeg) {
      const zVec = getZenithVec(latDeg);
      return p.x * zVec.x + p.y * zVec.y + p.z * zVec.z;
    }

    function getStarBehaviorDesc(starLat, obsLat) {
      const absObs = Math.abs(obsLat);
      if (absObs >= 89.5) {
        if ((obsLat > 0 && starLat > 0) || (obsLat < 0 && starLat < 0)) {
          return "周極平行繞轉（永不沒入）";
        } else if (Math.abs(starLat) < 0.5) {
          return "貼地平線水平繞轉";
        } else {
          return "位於地平線下（永不可見）";
        }
      }
      if (absObs < 0.5) {
        if (Math.abs(starLat) < 0.5) return "正東昇、正西落（過天頂）";
        return starLat > 0 ? "東北昇、西北落（垂直地面）" : "東南昇、西南落（垂直地面）";
      }
      if (obsLat > 0) {
        if (starLat >= 90 - obsLat) return "拱極恆顯星（永不沒入地平）";
        if (starLat <= -(90 - obsLat)) return "恆隱星（永不昇出地平）";
        if (Math.abs(starLat) < 0.5) return "天赤道（正東昇、正西落）";
        return starLat > 0 ? "東北昇、西北落（可見＞12hr）" : "東南昇、西南落（可見＜12hr）";
      } else {
        if (starLat <= -90 - obsLat) return "南天恆顯星（永不沒入地平）";
        if (starLat >= 90 + obsLat) return "恆隱星（永不昇出地平）";
        if (Math.abs(starLat) < 0.5) return "天赤道（正東昇、正西落）";
        return starLat < 0 ? "東南昇、西南落（可見＞12hr）" : "東北昇、西北落（可見＜12hr）";
      }
    }

    // 計算被切出的觀察半球在 2D 畫面上的真實球面裁切輪廓路徑
    function buildObservedHemispherePath(cx, cy, R_cel, obsDir3D, planeCenter3D, latRad, projectFn) {
      const rDisk = Math.sqrt(Math.max(0, R_cel * R_cel - (planeCenter3D.x ** 2 + planeCenter3D.y ** 2 + planeCenter3D.z ** 2)));
      const N = 160;
      const rimPts = [];
      for (let i = 0; i < N; i++) {
        const az = (i / N) * TWO_PI;
        const north = Math.cos(az), east = Math.sin(az);
        const p3 = {
          x: planeCenter3D.x + rDisk * east,
          y: planeCenter3D.y + rDisk * north * Math.cos(latRad),
          z: planeCenter3D.z - rDisk * north * Math.sin(latRad)
        };
        const p2 = projectFn(p3);
        rimPts.push({ sx: p2.sx, sy: p2.sy, z: p2.z });
      }

      let startIdx = -1;
      for (let i = 0; i < N; i++) {
        const prev = rimPts[(i - 1 + N) % N];
        const curr = rimPts[i];
        if (prev.z < 0 && curr.z >= 0) {
          startIdx = i;
          break;
        }
      }

      const path = new Path2D();
      if (startIdx === -1) {
        rimPts.forEach((pt, idx) => idx === 0 ? path.moveTo(pt.sx, pt.sy) : path.lineTo(pt.sx, pt.sy));
        path.closePath();
        return path;
      }

      const frontArc = [];
      let idx = startIdx;
      while (rimPts[idx].z >= 0 && frontArc.length < N) {
        frontArc.push(rimPts[idx]);
        idx = (idx + 1) % N;
      }

      if (frontArc.length < 2) {
        path.arc(cx, cy, R_cel, 0, TWO_PI);
        return path;
      }

      const pStart = frontArc[0];
      const pEnd = frontArc[frontArc.length - 1];

      path.moveTo(pStart.sx, pStart.sy);
      for (let i = 1; i < frontArc.length; i++) {
        path.lineTo(frontArc[i].sx, frontArc[i].sy);
      }

      const zenPt = projectFn({
        x: obsDir3D.x * R_cel,
        y: obsDir3D.y * R_cel,
        z: obsDir3D.z * R_cel
      });
      const zenAng = Math.atan2(zenPt.sy - cy, zenPt.sx - cx);
      const aEnd = Math.atan2(pEnd.sy - cy, pEnd.sx - cx);
      const aStart = Math.atan2(pStart.sy - cy, pStart.sx - cx);

      const norm = (a) => ((a % TWO_PI) + TWO_PI) % TWO_PI;
      const ccwSpan = norm(aStart - aEnd);
      const ccwToZen = norm(zenAng - aEnd);
      const anticlockwise = !(ccwToZen <= ccwSpan);

      path.arc(cx, cy, R_cel, aEnd, aStart, anticlockwise);
      path.closePath();
      return path;
    }

          desc: "切回誇張地球尺度（以球心為原點原地放大，地平面不平移），方便看清地球自轉軸與觀察者所在緯度的幾何關係。"
        };
      }
      if (stage === 4) {
        return {
          badge: "階段 4 / 5",
          desc: "把頭頂方向轉正，切平面就是眼前的地平線，星星從東邊升起、西邊落下。"
        };
      }
      return {
        badge: "階段 5 / 5",
        desc: "從側面剖開觀察：北極星仰角剛好等於當地緯度，星軌傾角則是 90° 減緯度。"
      };
    }

    function applySlideState(slideObj) {
      const previousStage = stage;
      const requestedStage = slideObj.stage;

      if (previousStage === 5 && requestedStage === 4 && reverseMode) {
        inverseAzimuthAnchor = targetSideYawOffset;
        inverseAzimuthActive = true;
      } else if (requestedStage < 4) {
        inverseAzimuthActive = false;
      }

      stage = requestedStage;
      if (stage === 1) {
        introStep = slideObj.introStep;
        constellationsEnabled = introStep === 1;
      } else if (stage === 2 && (previousStage !== 2 || slideObj.syncIntro)) {
        constellationsEnabled = true;
      } else if (stage === 3 && previousStage !== 3) {
        constellationsEnabled = false;
      }
      setChaseStep(slideObj.chaseStep, slideObj.syncIntro);
      cutawayStep = slideObj.cutawayStep;
      isEarthTiny = slideObj.earthTiny;

      if (stage === 5 && previousStage < 4) {
        targetSideYawOffset = currentSideYawOffset;
      }

      updateUI();
      updateAzimuthUI();
    }

    function goToSlide(idx) {
      const clamped = Math.max(0, Math.min(SLIDE_SEQUENCE.length - 1, idx));
      if (Math.abs(userYaw) > 0.001 || Math.abs(userPitch) > 0.001) {
        pendingAction = { type: "slide", index: clamped };
        recenterUserView = true;
        return;
      }
      pendingAction = null;
      currentSlideIndex = clamped;
      applySlideState(SLIDE_SEQUENCE[currentSlideIndex]);
    }

    function nextSlide() {
      if (currentSlideIndex < SLIDE_SEQUENCE.length - 1) {
        goToSlide(currentSlideIndex + 1);
      }
    }

    function prevSlide() {
      if (reverseMode && stage === 5) {
        goToSlide(SLIDE_SEQUENCE.findIndex(s => s.stage === 4));
        return;
      }
      if (currentSlideIndex > 0) {
        goToSlide(currentSlideIndex - 1);
      }
    }

    function syncSlideIndexToCurrentState() {
      let bestIdx = 0;
      for (let i = 0; i < SLIDE_SEQUENCE.length; i++) {
        const s = SLIDE_SEQUENCE[i];
        if (s.stage === stage) {
          bestIdx = i;
          if (stage === 1 && s.introStep === introStep) break;
          if (stage === 2 && s.chaseStep === chaseStep && Boolean(s.syncIntro) === syncIntro) break;
          if (stage === 3 && s.cutawayStep === cutawayStep) break;
        }
      }
      currentSlideIndex = bestIdx;
    }

    function togglePolarisRay() {
      polarisPulseEnabled = !polarisPulseEnabled;
      updatePolarisRayButton();
    }

    function toggleConstellations() {
      constellationsEnabled = !constellationsEnabled;
      updateConstellationButton();
    }

    function updateConstellationButton() {
      const btn = document.getElementById("constellationBtn");
      btn.setAttribute("aria-pressed", String(constellationsEnabled));
      btn.className = constellationsEnabled
        ? "glass-panel border border-sky-400/50 bg-sky-500/20 text-sky-200 text-xs font-semibold px-3 py-1.5 rounded-xl transition cursor-pointer shadow-lg"
        : "glass-panel hover:bg-sky-500/25 border border-slate-700 bg-slate-900/75 text-slate-300 text-xs font-semibold px-3 py-1.5 rounded-xl transition cursor-pointer shadow-lg";
      document.getElementById("constellationText").textContent = `星座顯示：${constellationsEnabled ? "開" : "關"}`;
    }

    function setEarthScale(actualScale) {
      isEarthTiny = Boolean(actualScale);
      if (stage === 1) introStep = isEarthTiny ? (introStep === 1 ? 1 : 2) : 3;
      syncSlideIndexToCurrentState();
      updateUI();
    }

    function toggleEarthScale() {
      setEarthScale(!isEarthTiny);
    }

    function setIntroStep(step) {
      goToSlide(SLIDE_SEQUENCE.findIndex(s => s.stage === 1 && s.introStep === step));
    }

    function updateEarthScaleButtonUI() {
      const btn = document.getElementById("earthScaleBtn");
      const txt = document.getElementById("earthScaleText");
      if (btn && txt) {
        if (isEarthTiny) {
          btn.className = "glass-panel border border-sky-300 bg-sky-500/35 text-white text-xs font-semibold px-3 py-1.5 rounded-xl transition cursor-pointer flex items-center gap-1.5 shadow-[0_0_16px_rgba(56,189,248,0.4)]";
          txt.textContent = "地球顯示尺度：接近實際尺度";
        } else {
          btn.className = "glass-panel hover:bg-sky-500/25 border border-sky-400/50 bg-sky-500/20 text-sky-200 text-xs font-semibold px-3 py-1.5 rounded-xl transition cursor-pointer flex items-center gap-1.5 shadow-lg";
          txt.textContent = "地球顯示尺度：誇張地球尺度";
        }
      }

      for (let i = 1; i <= 3; i++) {
        const btn = document.getElementById(`intro-step-${i}`);

          ? "scale-step-btn px-2.5 py-1 rounded-lg border border-sky-400 bg-sky-500/25 text-sky-200 font-semibold transition cursor-pointer shadow"
          : "scale-step-btn px-2.5 py-1 rounded-lg border border-slate-700 bg-slate-800/70 text-slate-300 hover:bg-slate-700 transition cursor-pointer";
      }
    }

    function updatePolarisRayButton() {
      const btn = document.getElementById("polarisRayBtn");
      const dot = document.getElementById("polarisRayDot");
      const txt = document.getElementById("polarisRayText");
      if (!btn || !dot || !txt) return;

        dot.className = "w-2 h-2 rounded-full bg-sky-300 animate-ping";

        dot.className = "w-2 h-2 rounded-full bg-slate-500";
        txt.textContent = "北極星方位顯示：關";
      }
    }

    function toggleStarClass(starKey) {
      starLabelToggles[starKey] = !starLabelToggles[starKey];
      updateStarClassButtons();
    }

    function toggleAllStarClasses() {
      const anyOff = !starLabelToggles.northStar || !starLabelToggles.equatorStar || !starLabelToggles.southStar;
      const target = anyOff ? true : false;
      starLabelToggles.northStar = target;
      starLabelToggles.equatorStar = target;
      starLabelToggles.southStar = target;
      updateStarClassButtons();
    }

    function updateStarClassButtons() {
      const styles = {
        northStar: "border-sky-400/50 bg-sky-500/20 text-sky-200",
        equatorStar: "border-amber-400/50 bg-amber-500/20 text-amber-200",
        southStar: "border-rose-400/50 bg-rose-500/20 text-rose-200"
      };
      for (const [key, activeCls] of Object.entries(styles)) {
        const btn = document.getElementById(`tog-star-${key}`);
        if (!btn) continue;
        const badge = btn.querySelector(".status-badge");
        if (starLabelToggles[key]) {

          if (badge) badge.textContent = "開啟";
