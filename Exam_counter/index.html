let periods=[],events=[],grade=3,selectedClass='',selectedCourse='',viewMonth=new Date(),termStart=null,vacations=[],currentSemester=null;
const pad=n=>String(n).padStart(2,'0');const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const parse=value=>{const [y,m,d]=value.split(/[/-]/).map(Number);return new Date(y,m-1,d,12)};const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};const classGrade=id=>Number(String(id)[0]);
function csv(text){text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);const [head,...data]=rows;return data.map(values=>Object.fromEntries(head.map((name,i)=>[name.trim(),(values[i]||'').trim()])))}
function gradeColumn(targetGrade){return targetGrade===3?'高三':'高一二'}
function affects(event,targetGrade){return Number(event[gradeColumn(targetGrade)])===1}
function applies(event,targetGrade,period){if(event['扣時數事件']!=='1'||!affects(event,targetGrade))return false;const p=event['影響節次'];return !p||p.split(/[、，,]/).map(Number).includes(Number(period))}
function termStarts(){return events.filter(e=>e['分段事件']==='1').map(e=>e.date).sort((a,b)=>a-b)}
function semesterFor(d){return termStarts().filter(s=>s<=d).length<2?1:2}
async function loadPeriods(sem){periods=csv(PERIOD_CSV[sem]);currentSemester=sem;selectedClass='';selectedCourse=''}
async function ensurePeriods(asOf){const sem=semesterFor(asOf);if(sem!==currentSemester)await loadPeriods(sem)}
function classes(){return[...new Set(periods.filter(r=>classGrade(r['班級'])===grade).map(r=>r['班級']))].sort((a,b)=>Number(a)-Number(b))}
function coursesForClass(){const found=new Map;periods.filter(r=>r['班級']===selectedClass).forEach(r=>{const id=[r['教師代碼'],r['課程名稱'],r['主授科目'],r['細科目']].join('|');if(!found.has(id))found.set(id,{id,...r,lessons:[]});found.get(id).lessons.push({day:Number(r['星期']),period:Number(r['節次'])})});return[...found.values()].sort((a,b)=>a['課程名稱'].localeCompare(b['課程名稱'])||a['教師代碼'].localeCompare(b['教師代碼']))}
function currentCourse(){return coursesForClass().find(c=>c.id===selectedCourse)}
function inVacation(d){return vacations.some(v=>d>v.start&&d<v.end)}
function blockersFor(classId,d,lesson){return events.filter(e=>key(e.date)===key(d)&&applies(e,classGrade(classId),lesson.period))}
function blockers(d,lesson){return blockersFor(selectedClass,d,lesson)}
function daily(course,d){if(!course||d.getDay()===0||d.getDay()===6||(termStart&&d<termStart)||inVacation(d))return{scheduled:0,open:0,blocked:[]};const lessons=course.lessons.filter(x=>x.day===d.getDay()),blocked=lessons.flatMap(x=>blockers(d,x));return{scheduled:lessons.length,open:lessons.length-blocked.length,blocked:[...new Map(blocked.map(x=>[x['行程事項'],x])).values()]}}
function eventKey(event){return `${key(event.date)}|${event['行程事項']}`}
function eventLoss(course,event){return course.lessons.filter(lesson=>lesson.day===event.date.getDay()&&applies(event,grade,lesson.period)).length}
function currentExam(asOf){return events.find(e=>key(e.date)===key(asOf)&&affects(e,grade)&&/期中考|期末考|畢業考/.test(e['行程事項']))}
function nextBoundary(asOf){const relevant=events.filter(e=>e.date>=asOf&&affects(e,grade)&&(/期中考|期末考|畢業考/.test(e['行程事項']))).sort((a,b)=>a.date-b.date);return relevant[0]||{date:add(asOf,90),行程事項:'下一個考試日尚未設定',virtual:true}}
function previousBoundary(asOf){const relevant=events.filter(e=>e.date<asOf&&affects(e,grade)&&(/期中考|期末考|畢業考/.test(e['行程事項']))).sort((a,b)=>a.date-b.date);const last=relevant.at(-1);if(last)return add(last.date,1);return termStarts().filter(s=>s<=asOf).sort((a,b)=>b-a)[0]||add(asOf,-45)}
function comparisonCourses(){const active=currentCourse();if(!active)return[];const found=new Map;periods.filter(row=>classGrade(row['班級'])===grade&&row['課程名稱']===active['課程名稱']&&row['細科目']===active['細科目']).forEach(row=>{const id=row['班級'];if(!found.has(id))found.set(id,{classId:id,lessons:[]});found.get(id).lessons.push({day:Number(row['星期']),period:Number(row['節次'])})});return[...found.values()].sort((a,b)=>Number(a.classId)-Number(b.classId))}
function comparisonStats(course,start,end,asOf){const slots=[];for(let d=new Date(start);d<end;d=add(d,1)){if(d.getDay()===0||d.getDay()===6||(termStart&&d<termStart)||inVacation(d))continue;course.lessons.filter(lesson=>lesson.day===d.getDay()).forEach(lesson=>{const blocked=blockersFor(course.classId,d,lesson);if(blocked.length)slots.push({date:new Date(d),status:'lost',reason:blocked.map(e=>e['行程事項']).join('、')});else slots.push({date:new Date(d),status:d<=asOf?'done':'open'})})}const done=slots.filter(s=>s.status==='done').length,open=slots.filter(s=>s.status==='open').length;return{...course,slots,done,open,lost:slots.length-done-open}}
function monthBand(d){return (d.getFullYear()*12+d.getMonth())%2===0?'month-a':'month-b'}
function renderComparison(){const host=document.getElementById('comparison'),asOf=parse(document.getElementById('asOf').value),boundary=nextBoundary(asOf);if(boundary.virtual){host.innerHTML='';return}const end=boundary.date,rows=comparisonCourses().map(course=>comparisonStats(course,previousBoundary(asOf),end,asOf));if(rows.length<2){host.innerHTML='';return}host.innerHTML=`<div class="compare-legend"><span class="compare-legend-item"><i class="compare-swatch done"></i>已上課</span><span class="compare-legend-item"><i class="compare-swatch open"></i>未上課</span><span class="compare-legend-item"><i class="compare-swatch lost"></i>扣課</span><span class="compare-legend-item"><i class="compare-swatch today"></i>今天</span><span class="compare-legend-item"><i class="compare-swatch month"></i>月份（交替）</span></div><div class="compare-body"><div class="compare-labels">${rows.map(r=>`<div class="compare-label"><span class="compare-class">${r.classId}</span><span class="compare-remain">剩${r.open}節</span></div>`).join('')}</div><div class="compare-scroll"><div class="compare-tracks">${rows.map(r=>`<div class="compare-track">${r.slots.map(s=>{const today=key(s.date)===key(asOf),month=monthBand(s.date);if(s.status==='lost')return `<i class="compare-slot lost ${month}${today?' today':''}" data-tip="${encodeURIComponent(`${format(s.date)}・${s.reason}`)}"></i>`;const label=s.status==='done'?`已上 ${r.done} 節`:`未上 ${r.open} 節`;return `<i class="compare-slot ${s.status} ${month}${today?' today':''}" data-tip="${encodeURIComponent(label)}"></i>`}).join('')}</div>`).join('')}</div></div></div>`;const tip=document.getElementById('compareTip');host.querySelectorAll('.compare-slot').forEach(el=>{el.onpointerenter=e=>{tip.textContent=decodeURIComponent(el.dataset.tip);tip.classList.add('show');const r=e.target.getBoundingClientRect();tip.style.left=`${Math.max(8,Math.min(innerWidth-218,r.left))}px`;tip.style.top=`${r.bottom+8}px`};el.onpointerleave=()=>tip.classList.remove('show')})}
function format(d){return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}（週${DAYS[d.getDay()]}）`}
function renderSelectors(){const list=classes();if(!list.includes(selectedClass))selectedClass=list[0]||'';document.getElementById('classLabel').textContent=`${GRADES[grade]}・選擇班級`;document.getElementById('classes').innerHTML=list.length?list.map(c=>`<button class="class-btn ${c===selectedClass?'active':''}" data-class="${c}">${c}</button>`).join(''):'<span style="color:var(--muted);font-size:.85rem">此學期課表尚未建立</span>';const courseList=coursesForClass();if(!courseList.some(c=>c.id===selectedCourse))selectedCourse=courseList[0]?.id||'';document.getElementById('subjects').innerHTML=courseList.map(c=>`<button class="subject-tab ${c.id===selectedCourse?'active':''}" data-course="${encodeURIComponent(c.id)}">${c['課程名稱']}<small> ${c['教師代碼']}</small></button>`).join('')||'<span class="subject-tab">無課程</span>';document.querySelectorAll('.class-btn').forEach(b=>b.onclick=()=>{selectedClass=b.dataset.class;selectedCourse='';render()});document.querySelectorAll('.subject-tab[data-course]').forEach(b=>b.onclick=()=>{selectedCourse=decodeURIComponent(b.dataset.course);render()})}
function nearbyLosses(course,asOf){const end=add(asOf,(7-asOf.getDay())+7);const collected=new Map;events.filter(e=>e.date>asOf&&e.date<end&&affects(e,grade)).forEach(e=>{const lost=course.lessons.filter(lesson=>lesson.day===e.date.getDay()&&applies(e,grade,lesson.period)).length;if(lost){const id=`${key(e.date)}|${e['行程事項']}`;const item=collected.get(id)||{...e,lost:0};item.lost+=lost;collected.set(id,item)}});return[...collected.values()].sort((a,b)=>a.date-b.date)}
function renderSummary(){const course=currentCourse(),asOf=parse(document.getElementById('asOf').value);if(!course){document.getElementById('summary').innerHTML=`<div class="empty">${periods.length?'此年級沒有課表資料':'此學期課表尚未建立'}</div>`;return}const exam=currentExam(asOf);if(exam){document.getElementById('summary').innerHTML=`<div class="timer-header">${selectedClass}・${course['課程名稱']}</div><div class="timer-main" style="font-size:2.6rem;color:var(--exam)">正在${exam['行程事項']}</div><div class="timer-sub">${format(exam.date)}</div>`;return}const boundary=nextBoundary(asOf);if(boundary.virtual){document.getElementById('summary').innerHTML=`<div class="timer-header">${selectedClass}・${course['課程名稱']}</div><div class="timer-main" style="font-size:1.8rem;color:var(--muted)">尚未設定下次考試</div><div class="timer-sub">請確認 schedule.csv 是否已建立下次段考／期末考資料</div>`;return}let left=0,lost=0;for(let d=add(asOf,1);d<boundary.date;d=add(d,1)){const stat=daily(course,d);left+=stat.open;lost+=stat.scheduled-stat.open}const nearby=nearbyLosses(course,asOf);const nearbyHtml=nearby.length?`<section class="nearby"><h3>本週／下週扣課</h3>${nearby.map(e=>`<div class="nearby-item">${format(e.date)}・${e['行程事項']}（扣 ${e.lost} 節）</div>`).join('')}</section>`:'';document.getElementById('summary').innerHTML=`<div class="timer-header">${selectedClass}・${course['課程名稱']} ${boundary['行程事項']}範圍</div><div class="timer-main">${left}<span class="timer-unit">節</span> <span style="margin-left:8px;color:#526275;font-size:1.05rem;font-weight:600">(扣${lost}節)</span></div><div class="timer-sub">${boundary['行程事項']}：${format(boundary.date)}</div>${nearbyHtml}`}
function renderExamCountdown(){const el=document.getElementById('examCountdown');if(grade!==3){el.innerHTML='';return}const asOf=parse(document.getElementById('asOf').value),target=events.filter(e=>/學科能力測驗/.test(e['行程事項'])).map(e=>e.date).sort((a,b)=>a-b).find(d=>d>=asOf);if(!target){el.innerHTML='';return}const days=Math.round((target-asOf)/86400000);el.innerHTML=`<span class="countdown-label">學測倒數</span><span class="countdown-days">${days}</span><span class="countdown-unit">天</span><span class="countdown-date">${format(target)}</span>`}
function highlightEvents(encodedKeys){const keys=encodedKeys.split(',').filter(Boolean).map(decodeURIComponent);const cards=[...document.querySelectorAll('.key-card[data-event]')];cards.forEach(card=>card.classList.toggle('highlight',keys.includes(card.dataset.event)));const first=cards.find(card=>keys.includes(card.dataset.event));if(first)first.scrollIntoView({behavior:'smooth',block:'center'})}
function renderCalendar(){const grid=document.getElementById('calendar'),course=currentCourse(),asOf=parse(document.getElementById('asOf').value),year=viewMonth.getFullYear(),month=viewMonth.getMonth(),first=new Date(year,month,1,12),days=new Date(year,month+1,0).getDate();document.getElementById('calendarTitle').textContent=`${year} 年 ${month+1} 月`;let html='';for(let i=0;i<first.getDay();i++)html+='<div class="cal-day empty"></div>';for(let day=1;day<=days;day++){const d=new Date(year,month,day,12),stat=daily(course,d),eventList=stat.blocked,weekend=d.getDay()===0||d.getDay()===6,isToday=key(d)===key(asOf),eventKeys=eventList.map(eventKey).map(encodeURIComponent).join(',');const badge=eventList.length?'<span class="badge-x">×</span>':stat.open?`<span class="badge">${stat.open}</span>`:'';const note=eventList[0]?`<span class="day-note">${eventList[0]['行程事項']}</span>`:'';html+=`<button class="cal-day ${weekend?'weekend':''} ${key(d)<key(asOf)?'past':''} ${isToday?'today':''} ${eventList.length?'event':''}" data-events="${eventKeys}" title="${eventList.map(e=>e['行程事項']).join('、')||format(d)}"><span class="date-num">${day}</span>${badge}${note}</button>`}grid.innerHTML=html;grid.querySelectorAll('.cal-day.event').forEach(button=>button.onclick=()=>highlightEvents(button.dataset.events))}
function renderEvents(){const course=currentCourse();if(!course){document.getElementById('events').innerHTML='';return}const year=viewMonth.getFullYear(),month=viewMonth.getMonth(),list=events.filter(e=>e.date.getFullYear()===year&&e.date.getMonth()===month&&affects(e,grade)&&eventLoss(course,e)>0).sort((a,b)=>a.date-b.date);document.getElementById('events').innerHTML=list.map(e=>{const exam=/考/.test(e['行程事項']),lost=eventLoss(course,e);return `<article class="key-card ${exam?'exam':'lesson'}" data-event="${eventKey(e)}"><div class="key-title"><span class="key-dot"></span>${exam?'考試／模擬考':'停課行事'}</div><div class="key-date">${format(e.date)}</div><div class="key-tag">${e['行程事項']}・扣 ${lost} 節</div></article>`}).join('')||'<div class="empty">本月沒有扣到這門課的行事</div>'}
function render(){renderSelectors();renderSummary();renderComparison();renderExamCountdown();renderCalendar();renderEvents();document.querySelectorAll('.grade-btn').forEach(b=>b.classList.toggle('active',Number(b.dataset.grade)===grade))}
async function init(){try{events=csv(SCHEDULE_CSV).map(r=>({...r,date:parse(r['日期'])}));const starts=termStarts();termStart=starts[0]||null;vacations=events.filter(e=>e['分段事件']==='2').map(e=>e.date).map(end=>{const next=starts.find(s=>s>end);return next?{start:end,end:next}:null}).filter(Boolean);const today=new Date();document.getElementById('asOf').value=key(today);viewMonth=new Date(today.getFullYear(),today.getMonth(),1,12);await ensurePeriods(today);render()}catch(error){document.querySelector('main').innerHTML=`<div class="empty">無法讀取資料：${error.message}。請用本機網頁伺服器開啟。</div>`}}
document.querySelectorAll('.grade-btn').forEach(b=>b.onclick=()=>{grade=Number(b.dataset.grade);selectedClass='';selectedCourse='';render()});document.getElementById('asOf').onchange=async e=>{const d=parse(e.target.value);viewMonth=new Date(d.getFullYear(),d.getMonth(),1,12);try{await ensurePeriods(d)}catch(error){document.querySelector('main').innerHTML=`<div class="empty">無法讀取資料：${error.message}</div>`;return}render()};document.getElementById('previous').onclick=()=>{viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()-1,1,12);renderCalendar();renderEvents()};document.getElementById('next').onclick=()=>{viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+1,1,12);renderCalendar();renderEvents()};init();
</script>
