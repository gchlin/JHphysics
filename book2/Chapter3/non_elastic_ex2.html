<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>單擺與小球完全非彈性碰撞</title>
    <style>
        html, body { width: 100%; height: 100%; height: 100dvh; margin: 0; overflow: hidden; }
        body { box-sizing: border-box; padding: 8px; display: flex; flex-direction: column; align-items: stretch; justify-content: center; gap: 6px; }
        #zero-scroll-layout { width: 100%; height: 100%; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
        #zero-scroll-layout > .sim-container { width: 100%; max-width: 900px; max-height: 100%; min-height: 0; box-sizing: border-box; padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
        #zero-scroll-layout canvas { width: auto !important; height: auto !important; max-width: 100%; max-height: 100%; object-fit: contain; flex: 0 1 auto; }
        #zero-scroll-layout .sim-title { margin: 0; padding: 2px 0 5px; font-size: clamp(14px, 3vh, 20px); }
        #zero-scroll-layout .controls, #zero-scroll-layout .controls-row { flex: 0 0 auto; max-width: 100%; max-height: 30%; overflow: auto; box-sizing: border-box; margin: 0; padding: 5px 8px; gap: 6px; flex-wrap: wrap; justify-content: center; font-size: 12px; }
        #zero-scroll-layout button, #zero-scroll-layout select { min-height: 36px; padding: 6px 9px; font-size: 13px; touch-action: manipulation; }
        #zero-scroll-layout .fixed-val { font-size: 14px; }
        #zero-scroll-layout .divider { height: 16px; margin: 0 2px; }
        #zero-scroll-layout .chapter-navigation { width: 100%; max-width: 900px; max-height: 20%; box-sizing: border-box; overflow: auto; flex: 0 0 auto; margin: 0 !important; padding: 4px 6px !important; font-size: 11px; line-height: 1.5; }
        @media (orientation: landscape) and (max-height: 500px) {
            body { padding: 4px; gap: 3px; }
            #zero-scroll-layout { gap: 3px; }
            #zero-scroll-layout > .sim-container { padding: 4px; gap: 3px; }
            #zero-scroll-layout .controls, #zero-scroll-layout .controls-row { max-height: 35%; padding: 3px 5px; }
            #zero-scroll-layout button, #zero-scroll-layout select { min-height: 32px; padding: 4px 7px; }
            #zero-scroll-layout .chapter-navigation { max-height: 16%; font-size: 10px; }
        }
        body { margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; background-color: #f0f4f8; font-family: sans-serif; }
        .sim-container { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 6px 12px rgba(0,0,0,0.08); }
        .sim-title { font-size: 20px; font-weight: bold; text-align: center; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        canvas { background-color: #E6F2F2; border-radius: 8px; display: block; }
        .controls { margin-top: 15px; display: flex; gap: 20px; align-items: center; justify-content: center; background: #fafafa; padding: 15px; border-radius: 8px; }
        select { font-size: 16px; padding: 4px 8px; }
        button { font-size: 16px; padding: 6px 16px; cursor: pointer; border: none; border-radius: 4px; color: white; transition: 0.2s; }
        .btn-play { background-color: #4CAF50; } .btn-play:hover { background-color: #45a049; }
        .btn-reset { background-color: #F44336; } .btn-reset:hover { background-color: #da190b; }
            /* Keep the canvas in the space left after controls and navigation. */
        #zero-scroll-layout { justify-content: flex-start; }
        #zero-scroll-layout > .sim-container { flex: 1 1 0; overflow: hidden; }
        #zero-scroll-layout canvas { flex: 1 1 0; min-width: 0; min-height: 0; width: 100% !important; height: 100% !important; }
        #zero-scroll-layout .controls, #zero-scroll-layout .controls-row { max-height: none; overflow: visible; flex-shrink: 0; }
        #zero-scroll-layout .chapter-navigation { max-height: none; overflow: hidden; flex-shrink: 0; line-height: 1.35; }
        body { padding: 8px; background: #f4f7f6; }
        #zero-scroll-layout { justify-content: flex-start; }
        #zero-scroll-layout > .sim-container { width: 100%; max-width: none; height: 100%; min-width: 0; min-height: 0; box-sizing: border-box; padding: 8px; display: flex; flex-direction: row; align-items: stretch; gap: 2px; overflow: hidden; }
        #zero-scroll-layout canvas { flex: 1 1 auto; min-width: 0; min-height: 0; width: 100% !important; height: 100% !important; object-fit: contain; }
        #zero-scroll-layout .sim-title, #zero-scroll-layout .chapter-navigation { display: none !important; }
        #zero-scroll-layout .controls { flex: 0 0 78px; min-width: 0; box-sizing: border-box; margin: 0; padding: 5px; display: flex; flex-direction: column; justify-content: center; align-items: stretch; gap: 5px; }
        #zero-scroll-layout .controls > div { display: flex; flex-direction: column; align-items: stretch; gap: 2px; font-size: 10px; }
        #zero-scroll-layout select { width: 100%; min-width: 0; box-sizing: border-box; min-height: 30px; padding: 3px 0; font-size: 11px; touch-action: manipulation; }
        #zero-scroll-layout button { width: 100%; min-width: 0; min-height: 30px; padding: 3px 0; font-size: 11px; touch-action: manipulation; }
        #zero-scroll-layout .btn-play { background: #68727d; } #zero-scroll-layout .btn-play:hover { background: #56616c; }
        #zero-scroll-layout .btn-reset { background: #89939d; } #zero-scroll-layout .btn-reset:hover { background: #737e89; }
        #zero-scroll-layout .mode-control { display: flex; flex-direction: column; gap: 2px; font-size: 10px; }
        #zero-scroll-layout .mode-control select { width: 100%; min-height: 30px; box-sizing: border-box; padding: 2px 0; font-size: 9px; }
        #zero-scroll-layout .height-guides-button { background: #68727d; }
        #zero-scroll-layout .height-guides-button[aria-pressed="false"] { background: #89939d; }
        @media (max-width: 600px) { body { padding: 4px; } #zero-scroll-layout > .sim-container { padding: 4px; gap: 1px; } #zero-scroll-layout .controls { flex-basis: 73px; padding: 3px; } }
    </style>
</head>
<body>
<div id="zero-scroll-layout">
    <div class="sim-container">
        <div class="sim-title">單擺與小球完全非彈性碰撞</div>
        <canvas id="canvas" width="800" height="400"></canvas>
        <div class="controls">
            <label class="mode-control" for="modeSelect">模式
                <select id="modeSelect" aria-label="碰撞模式">
                    <option value="inelastic" selected>完全非彈性</option>
                    <option value="elastic">雙單擺彈性碰撞</option>
                </select>
            </label>
            <div>擺錘質量: 
                <select id="m1">
                    <option value="1">1m</option><option value="2">2m</option><option value="3">3m</option><option value="4">4m</option><option value="5">5m</option>
                </select>
            </div>
            <div>靜止小球質量: 
                <select id="m2">
                    <option value="1">1m</option><option value="2" selected>2m</option><option value="3">3m</option><option value="4">4m</option><option value="5">5m</option>
                </select>
            </div>
            <button id="heightGuidesBtn" class="height-guides-button" type="button" aria-label="隱藏高度虛線" aria-pressed="true" title="隱藏高度虛線">◉</button>
            <button id="playBtn" class="btn-play" aria-label="播放" title="播放">▶</button>
            <button id="resetBtn" class="btn-reset" aria-label="重置" title="重置">↻</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const sceneWidth = 800;
        const sceneHeight = 400;
        function resizeCanvasResolution() {
            const rect = canvas.getBoundingClientRect();
            if (!rect.width || !rect.height) return;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const pixelWidth = Math.max(1, Math.round(rect.width * dpr));
            const pixelHeight = Math.max(1, Math.round(rect.height * dpr));
            if (canvas.width !== pixelWidth) canvas.width = pixelWidth;
            if (canvas.height !== pixelHeight) canvas.height = pixelHeight;
            ctx.setTransform(canvas.width / sceneWidth, 0, 0, canvas.height / sceneHeight, 0, 0);
        }
        let isPlaying = false, reqId = null;
        let showHeightGuides = true;
        
        const sim = {
            L: 250, pivotX: 400, pivotY: 40, g: 0.2,
            init() {
                this.m1 = parseInt(document.getElementById('m1').value);
                this.m2 = parseInt(document.getElementById('m2').value);
                this.r1 = 15 + this.m1 * 3;
                this.r2 = 15 + this.m2 * 3;
                // 雙擺模式共用相同的球心軌道半徑；繩長各自為軌道半徑減球半徑。
                // 因此「繩長 + 球半徑」相等，球心在最低點同高，碰撞線通過兩球球心。
                this.effectiveRadius = this.L;
                this.stringLength1 = this.effectiveRadius - this.r1;
                this.stringLength2 = this.effectiveRadius - this.r2;
                this.theta = -Math.PI / 3; 
                this.omega = 0;
                this.theta2 = 0;
                this.omega2 = 0;
                this.mode = document.getElementById('modeSelect').value;
                this.state = this.mode === 'elastic' ? 'elastic' : 'falling';
                this.hasElasticCollision = false;
                this.maxHeight1Reached = false;
                this.maxHeight2Reached = false;
                this.initialHeight1 = this.effectiveRadius * (1 - Math.cos(Math.PI / 3));
                this.initialHeight2 = 0;
                const incomingSpeed = Math.sqrt(2 * this.g * this.initialHeight1);
                const outgoingSpeed1 = incomingSpeed * (this.m1 - this.m2) / (this.m1 + this.m2);
                const outgoingSpeed2 = incomingSpeed * (2 * this.m1) / (this.m1 + this.m2);
                this.targetHeight1 = Math.min(2 * this.L, outgoingSpeed1 ** 2 / (2 * this.g));
                this.targetHeight2 = Math.min(2 * this.L, outgoingSpeed2 ** 2 / (2 * this.g));
                const inelasticSpeed = incomingSpeed * this.m1 / (this.m1 + this.m2);
                this.inelasticTargetHeight = inelasticSpeed ** 2 / (2 * this.g);
                this.draw();
            },
            update() {
                if (!isPlaying) return;
                if (this.mode === 'elastic') {
                    this.updateElasticPendulums();
                    return;
                }
                const previousOmega = this.omega;
                let alpha = -(this.g / this.L) * Math.sin(this.theta);
                this.omega += alpha;
                this.theta += this.omega;

                if (this.state === 'falling' && this.theta >= 0) {
                    this.theta = 0;
                    this.omega = this.omega * (this.m1 / (this.m1 + this.m2));
                    this.state = 'swinging';
                } else if (this.state === 'swinging' && previousOmega * this.omega <= 0 && Math.abs(this.theta) > 0.02) {
                    this.maxHeight1Reached = true;
                }
            },
            updateElasticPendulums() {
                const collisionWasActive = this.hasElasticCollision;
                const previousOmega1 = this.omega;
                const previousOmega2 = this.omega2;
                this.omega += -(this.g / this.effectiveRadius) * Math.sin(this.theta);
                this.theta += this.omega;
                this.omega2 += -(this.g / this.effectiveRadius) * Math.sin(this.theta2);
                this.theta2 += this.omega2;

                const p1x = 350;
                const p2x = p1x;
                const x1 = p1x + this.effectiveRadius * Math.sin(this.theta);
                const y1 = this.pivotY + this.L * Math.cos(this.theta);
                const x2 = p2x + this.effectiveRadius * Math.sin(this.theta2);
                const y2 = this.pivotY + this.L * Math.cos(this.theta2);
                const dx = x2 - x1;
                const dy = y2 - y1;
                const distance = Math.hypot(dx, dy);
                const minDistance = this.r1 + this.r2;

                if (distance <= minDistance + 1 && distance > 0) {
                    const nx = dx / distance;
                    const ny = dy / distance;
                    const v1x = this.effectiveRadius * Math.cos(this.theta) * this.omega;
                    const v1y = -this.effectiveRadius * Math.sin(this.theta) * this.omega;
                    const v2x = this.effectiveRadius * Math.cos(this.theta2) * this.omega2;
                    const v2y = -this.effectiveRadius * Math.sin(this.theta2) * this.omega2;
                    const relativeNormalSpeed = (v2x - v1x) * nx + (v2y - v1y) * ny;

                    if (relativeNormalSpeed < 0) {
                        const impulse = -2 * relativeNormalSpeed / (1 / this.m1 + 1 / this.m2);
                        const nextV1x = v1x - impulse * nx / this.m1;
                        const nextV1y = v1y - impulse * ny / this.m1;
                        const nextV2x = v2x + impulse * nx / this.m2;
                        const nextV2y = v2y + impulse * ny / this.m2;
                        this.omega = (nextV1x * Math.cos(this.theta) - nextV1y * Math.sin(this.theta)) / this.effectiveRadius;
                        this.omega2 = (nextV2x * Math.cos(this.theta2) - nextV2y * Math.sin(this.theta2)) / this.effectiveRadius;
                        this.hasElasticCollision = true;
                        if (Math.abs(this.omega) < 0.002) this.maxHeight1Reached = true;
                        if (Math.abs(this.omega2) < 0.002) this.maxHeight2Reached = true;
                    }
                }
                if (collisionWasActive) {
                    if (previousOmega1 * this.omega <= 0 && Math.abs(this.theta) > 0.02) this.maxHeight1Reached = true;
                    if (previousOmega2 * this.omega2 <= 0 && Math.abs(this.theta2) > 0.02) this.maxHeight2Reached = true;
                }
            },
            draw() {
                ctx.clearRect(0, 0, sceneWidth, sceneHeight);
                
                ctx.fillStyle = '#C4C4C4';
                ctx.fillRect(300, 20, 200, 20);
                const floorTop = this.pivotY + this.L + (this.mode === 'elastic' ? Math.max(this.r1, this.r2) : this.r2) + 4;
                ctx.fillRect(0, floorTop, sceneWidth, 20);

                if (this.mode === 'elastic') {
                    const p1x = 350;
                    const p2x = p1x;
                    const bx1 = p1x + this.effectiveRadius * Math.sin(this.theta);
                    const by1 = this.pivotY + this.L * Math.cos(this.theta);
                    const bx2 = p2x + this.effectiveRadius * Math.sin(this.theta2);
                    const by2 = this.pivotY + this.L * Math.cos(this.theta2);
                    this.drawElasticHeightGuides(p1x);
                    const ropeEnd1x = p1x + this.stringLength1 * Math.sin(this.theta);
                    const ropeEnd1y = this.pivotY + this.stringLength1 * Math.cos(this.theta);
                    const ropeEnd2x = p2x + this.stringLength2 * Math.sin(this.theta2);
                    const ropeEnd2y = this.pivotY + this.stringLength2 * Math.cos(this.theta2);
                    this.drawRope(p1x, this.pivotY, ropeEnd1x, ropeEnd1y, '#a7353b');
                    this.drawRope(p2x, this.pivotY, ropeEnd2x, ropeEnd2y, '#176b9e');
                    this.drawSharedPivot(p1x, this.pivotY);
                    this.drawSphere(bx1, by1, this.r1, '#e04f5f', this.m1 + 'm');
                    this.drawSphere(bx2, by2, this.r2, '#3CA6D8', this.m2 + 'm');
                    return;
                }

                let bx1 = this.pivotX + this.L * Math.sin(this.theta);
                let by1 = this.pivotY + this.L * Math.cos(this.theta);

                this.drawInelasticHeightGuides();

                ctx.beginPath();
                ctx.moveTo(this.pivotX, this.pivotY);
                ctx.lineTo(bx1, by1);
                ctx.strokeStyle = '#8C5C3D';
                ctx.lineWidth = 2;
                ctx.stroke();

                if (this.state === 'falling') {
                    let bx2 = this.pivotX + this.r1 + this.r2; 
                    let by2 = this.pivotY + this.L;
                    // 將球上的文字改為動態連動的變數
                    this.drawSphere(bx2, by2, this.r2, '#3CA6D8', this.m2 + 'm');
                    this.drawSphere(bx1, by1, this.r1, '#3CA6D8', this.m1 + 'm');
                } else {
                    let bx2 = this.pivotX + this.L * Math.sin(this.theta) + (this.r1 + this.r2) * Math.cos(this.theta);
                    let by2 = this.pivotY + this.L * Math.cos(this.theta) - (this.r1 + this.r2) * Math.sin(this.theta);
                    this.drawSphere(bx1, by1, this.r1, '#3CA6D8', this.m1 + 'm');
                    this.drawSphere(bx2, by2, this.r2, '#3CA6D8', this.m2 + 'm');
                }
            },
            drawHeightGuide(y, x1, x2, color, label) {
                ctx.save();
                ctx.setLineDash([7, 6]);
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y);
                ctx.stroke();
                if (label) {
                    ctx.setLineDash([]);
                    ctx.fillStyle = color;
                    ctx.font = '12px sans-serif';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText(label, x1 + 6, y - 3);
                }
                ctx.restore();
            },
            drawElasticHeightGuides(p1x) {
                if (!showHeightGuides) return;
                const p2x = p1x + this.r1 + this.r2;
                const splitX = (p1x + p2x) / 2;
                const initialY1 = this.pivotY + this.L - this.initialHeight1;
                const initialY2 = this.pivotY + this.L - this.initialHeight2;
                this.drawHeightGuide(initialY1, 0, splitX - 4, '#982d35', '紅球 碰前');
                this.drawHeightGuide(initialY2, splitX + 4, sceneWidth, '#145b88', '藍球 碰前');
                if (this.maxHeight1Reached) {
                    this.drawHeightGuide(this.pivotY + this.L - this.targetHeight1, 0, splitX - 4, '#e5a0a4', '紅球 撞後最高');
                }
                if (this.maxHeight2Reached) {
                    this.drawHeightGuide(this.pivotY + this.L - this.targetHeight2, splitX + 4, sceneWidth, '#91c4e2', '藍球 撞後最高');
                }
            },
            drawInelasticHeightGuides() {
                if (!showHeightGuides) return;
                const initialY = this.pivotY + this.L - this.initialHeight1;
                this.drawHeightGuide(initialY, 0, this.pivotX - 12, '#555b61', '碰前高度');
                if (this.maxHeight1Reached) {
                    const bottomCenterY = this.pivotY + this.L;
                    this.drawHeightGuide(bottomCenterY - this.inelasticTargetHeight, this.pivotX + 12, sceneWidth, '#aab0b4', '撞後最高');
                }
            },
            drawRope(x1, y1, x2, y2, color = '#8C5C3D') {
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.stroke();
            },
            drawPivot(x, y, color) {
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.stroke();
            },
            drawSharedPivot(x, y) {
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#a7353b';
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(x, y - 5);
                ctx.arc(x, y, 5, -Math.PI / 2, Math.PI / 2);
                ctx.closePath();
                ctx.fillStyle = '#176b9e';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.stroke();
            },
            drawSphere(x, y, r, color, text) {
                let grad = ctx.createRadialGradient(x - r/3, y - r/3, r/4, x, y, r);
                if (color === '#e04f5f') {
                    grad.addColorStop(0, '#ffadb5');
                    grad.addColorStop(1, '#b52d3d');
                } else {
                    grad.addColorStop(0, '#88D4F8');
                    grad.addColorStop(1, '#207BB0');
                }
                ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
                ctx.fillStyle = grad; ctx.fill();
                ctx.fillStyle = '#fff'; ctx.font = '16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(text, x, y);
            },
            loop() {
                this.update(); this.draw();
                if (isPlaying) reqId = requestAnimationFrame(() => this.loop());
            }
        };

        document.getElementById('playBtn').onclick = function() {
            isPlaying = !isPlaying;
            this.textContent = isPlaying ? 'Ⅱ' : '▶';
            this.setAttribute('aria-label', isPlaying ? '暫停' : '播放');
            this.title = isPlaying ? '暫停' : '播放';
            this.style.backgroundColor = isPlaying ? '#56616c' : '#68727d';
            if (isPlaying) sim.loop();
            else cancelAnimationFrame(reqId);
        };
        document.getElementById('resetBtn').onclick = function() {
            isPlaying = false; cancelAnimationFrame(reqId);
            document.getElementById('playBtn').textContent = '▶';
            document.getElementById('playBtn').setAttribute('aria-label', '播放');
            document.getElementById('playBtn').title = '播放';
            document.getElementById('playBtn').style.backgroundColor = '#68727d';
            sim.init();
        };
        document.getElementById('modeSelect').addEventListener('change', () => document.getElementById('resetBtn').click());
        document.getElementById('heightGuidesBtn').addEventListener('click', function() {
            showHeightGuides = !showHeightGuides;
            this.setAttribute('aria-pressed', String(showHeightGuides));
            this.setAttribute('aria-label', showHeightGuides ? '隱藏高度虛線' : '顯示高度虛線');
            this.title = showHeightGuides ? '隱藏高度虛線' : '顯示高度虛線';
            this.textContent = showHeightGuides ? '◉' : '○';
            sim.draw();
        });
        ['m1', 'm2'].forEach(id => document.getElementById(id).onchange = () => { 
            sim.init();
            if(!isPlaying) document.getElementById('resetBtn').click(); 
        });
        
        resizeCanvasResolution();
        const canvasResizeObserver = 'ResizeObserver' in window ? new ResizeObserver(() => { resizeCanvasResolution(); sim.draw(); }) : null;
        if (canvasResizeObserver) canvasResizeObserver.observe(canvas);
        else window.addEventListener('resize', () => { resizeCanvasResolution(); sim.draw(); });
        sim.init();
    </script>

</div>
