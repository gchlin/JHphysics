<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>一維彈性碰撞與彈簧位能轉換 (質心速度對照版)</title>
    <style>
        html, body { width: 100%; height: 100%; height: 100dvh; margin: 0; overflow: hidden; }
        body { box-sizing: border-box; padding: 8px; background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #zero-scroll-layout { width: 100%; height: 100%; min-height: 0; }
        #zero-scroll-layout > .sim-container { position: relative; width: 100%; height: 100%; min-width: 0; min-height: 0; box-sizing: border-box; padding: 8px; display: flex; flex-direction: row; align-items: stretch; gap: 0; background: #fff; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        #zero-scroll-layout canvas { flex: 0 0 auto; min-width: 0; min-height: 0; object-fit: contain; }
        #zero-scroll-layout .sim-title, #zero-scroll-layout .chapter-navigation { display: none !important; }
        .sim-title {
            font-size: 20px; font-weight: bold; color: #333; margin-bottom: 12px; 
            width: 100%; text-align: center; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px;
        }
        canvas {
            background-color: #EBF1F4; border-radius: 8px; border: 1px solid #dcdcdc; display: block;
            width: 800px; height: 340px; 
        }
        .playback-controls { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-content: center; gap: 8px; }
        button, select {
            font-size: 14px; padding: 6px 12px; cursor: pointer; border: none; border-radius: 6px; 
            font-weight: 600; transition: background 0.2s, transform 0.1s; outline: none;
        }
        button:active { transform: scale(0.96); }
        select { border: 1px solid #ccc; background: white; color: #333; }
        
        .btn-play, .btn-reset, .btn-help { width: 44px; height: 42px; min-width: 44px; padding: 0; color: white; background: #0878d1; font-size: 19px; box-shadow: 0 2px 5px rgba(0,0,0,.24); }
        .btn-play:hover, .btn-reset:hover, .btn-help:hover { background: #005bb5; }
        .help-dialog { width: min(420px, calc(100vw - 40px)); box-sizing: border-box; border: 0; border-radius: 12px; padding: 22px 24px; color: #263746; box-shadow: 0 8px 28px rgba(0,0,0,.28); font: 15px/1.65 'Segoe UI', sans-serif; }
        .help-dialog::backdrop { background: rgba(24, 37, 48, .45); }
        .help-dialog h2 { margin: 0 0 12px; font-size: 20px; }
        .help-dialog ul { margin: 0; padding-left: 22px; }
        .help-dialog li + li { margin-top: 8px; }
        .help-dialog button { display: block; margin: 18px 0 0 auto; min-width: 72px; min-height: 38px; color: white; background: #0878d1; }
        @media (max-width: 600px) {
            body { padding: 4px; }
            #zero-scroll-layout > .sim-container { padding: 4px; gap: 1px; }
            #zero-scroll-layout button { min-height: 40px; touch-action: manipulation; }
            .playback-controls { gap: 6px; }
            .btn-play, .btn-reset, .btn-help { width: 42px; height: 40px; min-width: 42px; }
        }
    </style>
</head>
<body>
<div id="zero-scroll-layout">

    <div class="sim-container">
        <canvas id="simCanvas"></canvas>
        
        <div class="playback-controls" aria-label="動畫播放控制">
            <button id="playBtn" class="btn-play" aria-label="播放" title="播放">▶</button>
            <button id="resetBtn" class="btn-reset" aria-label="重置" title="重置">↻</button>
            <button id="helpBtn" class="btn-help" aria-label="使用說明" title="使用說明">?</button>
        </div>
        <dialog id="helpDialog" class="help-dialog" aria-labelledby="helpTitle">
            <h2 id="helpTitle">操作說明</h2>
            <ul>
                <li>點左側眼睛圖示，顯示或隱藏能量圖表、動量圖示。</li>
                <li>週期鐘的小圈代表正常播放；點大圈的階段區段，可單獨慢動作播放該階段。</li>
                <li>慢動作時點小圈，可恢復正常播放。</li>
                <li>點週期鐘的「最大壓縮」標記，可查看彈簧壓縮最大的狀態。</li>
            </ul>
            <button id="closeHelpBtn" type="button">關閉</button>
        </dialog>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let isPlaying = false;
        let animationId;

        const displayWidth = 800;
        const displayHeight = 340; 
        const container = canvas.parentElement;
        const controls = container.querySelector('.playback-controls');
        let viewScale = 1;
        function resizeCanvasResolution() {
            const style = getComputedStyle(container);
            const paddingX = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
            const paddingY = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);
            const gap = parseFloat(style.columnGap || style.gap) || 0;
            const availableWidth = container.clientWidth - paddingX - controls.offsetWidth - gap;
            const availableHeight = container.clientHeight - paddingY;
            if (availableWidth <= 0 || availableHeight <= 0) return false;
            viewScale = Math.min(availableWidth / displayWidth, availableHeight / displayHeight);
            const cssWidth = displayWidth * viewScale;
            const cssHeight = displayHeight * viewScale;
            canvas.style.width = `${cssWidth}px`;
            canvas.style.height = `${cssHeight}px`;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const pixelWidth = Math.max(1, Math.round(cssWidth * dpr));
            const pixelHeight = Math.max(1, Math.round(cssHeight * dpr));
            if (canvas.width !== pixelWidth) canvas.width = pixelWidth;
            if (canvas.height !== pixelHeight) canvas.height = pixelHeight;
            ctx.setTransform(dpr * viewScale, 0, 0, dpr * viewScale, 0, 0);
            return true;
        }
        resizeCanvasResolution();

        const sim = {
            m: 10,        
            k: 0.04,      
            v0: 3.5,      
            L0: 120,      
            cartW: 90,    
            cartH: 60,    
            floorY: 280,  
            timeSpeed: 0.25, 
            snapshots: {},
            phaseIndex: 0,
            phaseElapsed: 0,
            phaseClockDone: false,
            showEnergy: true,
            showMomentum: true,
            replayPhase: null,
            savedTimeSpeed: 0.25,

            init() {
                this.xA = 50; this.xB = 450;
                this.vA = this.v0; this.vB = 0;
                this.phaseIndex = 0; this.phaseElapsed = 0; this.phaseClockDone = false;
                this.totalE = 0.5 * this.m * this.v0 * this.v0; 
                this.totalP = this.m * this.v0; 
                // 質心速度 V_c = (m1*v1 + m2*v2) / (m1 + m2)
                this.vc = this.totalP / (this.m * 2);
                
                this.calculateSnapshots();
                this.draw();
            },

            calculateSnapshots() {
                let simXA = 50, simXB = 450, simVA = this.v0, simVB = 0;
                let dt = 0.05, stage = 'approaching';
                
                for (let i = 0; i < 20000; i++) {
                    let springLeftX = simXB - this.L0;
                    let aRightX = simXA + this.cartW;
                    let force = 0;

                    if (stage === 'approaching' && aRightX >= springLeftX) {
                        this.snapshots['before'] = { xA: springLeftX - this.cartW, xB: simXB, vA: simVA, vB: simVB };
                        stage = 'compressing';
                    }

                    if (aRightX > springLeftX) force = this.k * (aRightX - springLeftX);
                    simVA += (-force / this.m) * dt; simVB += (force / this.m) * dt;
                    simXA += simVA * dt; simXB += simVB * dt;

                    if (stage === 'compressing' && force > 0 && Math.abs(simVA - simVB) < 0.01) {
                        this.snapshots['closest'] = { xA: simXA, xB: simXB, vA: simVA, vB: simVB };
                        stage = 'expanding';
                    }
                    if (stage === 'expanding' && force === 0 && simVB > simVA) {
                        this.snapshots['after'] = { xA: simXA, xB: simXB, vA: simVA, vB: simVB };
                        break;
                    }
                }
            },

            update() {
                if (!isPlaying) return;
                const steps = 10;
                const dt = (1 / steps) * this.timeSpeed;
                for (let i = 0; i < steps; i++) {
                    const gap = (this.xB - this.L0) - (this.xA + this.cartW);
                    if (this.phaseIndex === 0 && gap <= 0) {
                        this.phaseIndex = 1;
                        this.phaseElapsed = 0;
                    } else if (this.phaseIndex === 1 && gap > 0 && this.phaseElapsed > 0) {
                        this.phaseIndex = 2;
                        this.phaseElapsed = 0;
                    }
                    if (this.phaseIndex === 2) {
                        this.phaseElapsed = Math.min(8, this.phaseElapsed + dt);
                        if (this.phaseElapsed >= 8) this.phaseClockDone = true;
                    } else {
                        this.phaseElapsed += dt;
                    }
                    let force = 0;
                    if (this.xA + this.cartW > this.xB - this.L0) force = this.k * ((this.xA + this.cartW) - (this.xB - this.L0));
                    this.vA += (-force / this.m) * dt; this.vB += (force / this.m) * dt;
                    this.xA += this.vA * dt; this.xB += this.vB * dt;
                    if ((this.replayPhase === 0 && this.phaseIndex === 1) ||
                        (this.replayPhase === 1 && this.phaseIndex === 2)) {
                        finishPhaseReplay();
                        break;
                    }
                    if (this.replayPhase === 2 && this.phaseClockDone) {
                        finishPhaseReplay();
                        break;
                    }
                }
            },

            draw() {
                ctx.clearRect(0, 0, displayWidth, displayHeight);
                this.drawCharts();

                ctx.fillStyle = '#9CA6B0'; 
                ctx.fillRect(0, this.floorY, displayWidth, displayHeight - this.floorY);

                let springLeftX = Math.max(this.xA + this.cartW, this.xB - this.L0);
                this.drawSpring(springLeftX, this.floorY - this.cartH / 2, this.xB, this.floorY - this.cartH / 2);

                this.drawCart(this.xA, this.floorY, 'm1', this.vA, '#D59B78');
                this.drawCart(this.xB, this.floorY, 'm2', this.vB, '#D59B78');

                // 繪製系統唯一的質心速度 V_c 箭頭 (將箭頭中心點對齊兩車中央)
                let centerX = (this.xA + this.xB + this.cartW) / 2;
                let vcArrowY = this.floorY - this.cartH - 50; // 位置提高，避免與滑車速度標示重疊
                let vcLength = this.vc * 25;
                let vcStartX = centerX - vcLength / 2;
                
                // 紫色粗箭頭
                this.drawArrow(vcStartX, vcArrowY, vcStartX + vcLength, vcArrowY, '#8E44AD', 4); 
                
                // 繪製標籤 V_c (透過精算寬度與 y 軸偏移，精準渲染下標)
                ctx.fillStyle = '#8E44AD';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
                
                ctx.font = 'italic bold 20px "Times New Roman", serif';
                let wV = ctx.measureText('V').width;
                ctx.font = 'italic bold 14px "Times New Roman", serif';
                let wc = ctx.measureText('c').width;
                
                let textStartX = centerX - (wV + wc) / 2;
                let textY = vcArrowY - 8;

                // 畫主體 V
                ctx.font = 'italic bold 20px "Times New Roman", serif';
                ctx.fillText('V', textStartX, textY);
                // 畫下標 c (Y軸向下偏移 4px)
                ctx.font = 'italic bold 14px "Times New Roman", serif';
                ctx.fillText('c', textStartX + wV + 1, textY + 4);
            },

            drawCart(x, floorY, nameText, v, color) {
                let y = floorY - this.cartH - 12; 
                ctx.fillStyle = color; ctx.fillRect(x, y, this.cartW, this.cartH);
                ctx.fillStyle = '#222'; ctx.font = 'italic bold 24px "Times New Roman", serif';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(nameText, x + this.cartW / 2, y + this.cartH / 2);

                this.drawWheel(x + 20, floorY - 12, 12);
                this.drawWheel(x + this.cartW - 20, floorY - 12, 12);

                let arrowStartX = x + this.cartW / 2;
                
                // 繪製實時速度 v 箭頭 (動態長度，加粗)
                if (v > 0.05) {
                    let arrowY = y - 18;
                    let arrowLength = v * 25; 
                    this.drawArrow(arrowStartX, arrowY, arrowStartX + arrowLength, arrowY, '#4CAF50', 4); // 綠色加粗
                    
                    ctx.fillStyle = '#222'; 
                    ctx.font = 'italic bold 20px "Times New Roman", serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'alphabetic';
                    ctx.fillText('v', arrowStartX + arrowLength / 2, arrowY - 8);
                }
            },

            drawWheel(x, y, r) {
                ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = '#666'; ctx.fill();
                ctx.lineWidth = 3; ctx.strokeStyle = '#333'; ctx.stroke();
                ctx.beginPath(); ctx.arc(x, y, r * 0.4, 0, Math.PI * 2); ctx.fillStyle = '#ddd'; ctx.fill();
            },

            drawSpring(startX, y, endX, endY) {
                ctx.beginPath(); ctx.moveTo(startX, y);
                let coils = 12; let step = (endX - startX) / coils;
                for (let i = 0; i < coils; i++) {
                    ctx.lineTo((startX + step * i + startX + step * (i + 1)) / 2, y - 10);
                    ctx.lineTo(startX + step * (i + 1), y + 10);
                }
                ctx.lineTo(endX, y);
                ctx.strokeStyle = '#7f8c8d'; ctx.lineWidth = 3.5; ctx.lineJoin = 'round'; ctx.stroke();
            },

            drawArrow(fromX, fromY, toX, toY, color, width) {
                const headlen = 10; const angle = Math.atan2(toY - fromY, toX - fromX);
                ctx.beginPath(); ctx.moveTo(fromX, fromY); ctx.lineTo(toX, toY);
                ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
                ctx.moveTo(toX, toY);
                ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
                ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
            },

            drawCharts() {
                // 左側 70% 顯示動能與彈力位能兩列；右上角以三段圓環顯示碰撞進程。
                let ekA = 0.5 * this.m * this.vA * this.vA;
                let ekB = 0.5 * this.m * this.vB * this.vB;
                let compression = Math.max(0, (this.xA + this.cartW) - (this.xB - this.L0));
                let uSpring = 0.5 * this.k * compression * compression;

                const labelX = 38, barX = 142, barWidth = 425, barHeight = 26;
                ctx.fillStyle = '#56616c';
                ctx.font = '12px "Segoe UI", sans-serif';
                ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                const energyRows = [
                    { label: 'K₁ + K₂', y: 25, total: ekA + ekB, parts: [[ekA, '#1A5276', 'K₁'], [ekB, '#5DADE2', 'K₂']] },
                    { label: 'U', y: 67, total: uSpring, parts: [[uSpring, '#222222']] }
                ];
                if (this.showEnergy) energyRows.forEach(row => {
                    ctx.fillStyle = '#263746';
                    ctx.font = 'bold 19px "Segoe UI", sans-serif';
                    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                    ctx.fillText(row.label, labelX, row.y + barHeight / 2);
                    ctx.fillStyle = '#eef2f5';
                    ctx.fillRect(barX, row.y, barWidth, barHeight);
                    let offset = 0;
                    row.parts.forEach(([value, color, partLabel]) => {
                        const width = Math.max(0, Math.min(barWidth - offset, (value / this.totalE) * barWidth));
                        ctx.fillStyle = color;
                        ctx.fillRect(barX + offset, row.y, width, barHeight);
                        if (partLabel && width >= 34) {
                            ctx.fillStyle = '#fff';
                            ctx.font = 'bold 13px "Segoe UI", sans-serif';
                            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                            ctx.fillText(partLabel, barX + offset + width / 2, row.y + barHeight / 2);
                        }
                        offset += width;
                    });
                    ctx.strokeStyle = '#87939d'; ctx.lineWidth = 1;
                    ctx.strokeRect(barX, row.y, barWidth, barHeight);
                    ctx.fillStyle = '#263746'; ctx.font = 'bold 15px "Segoe UI", sans-serif';
                    ctx.textAlign = 'right';
                    ctx.fillText(`${Math.round(row.total / this.totalE * 100)}%`, barX + barWidth - 7, row.y + barHeight / 2);
                });
                this.drawEyeIcon(14, 58, this.showEnergy);

                this.drawPhaseClock(690, 78, 38, 58);

                // 動量向量圖表
                let pY = 119; let pX = 142;
                let pScale = 250 / this.totalP; 
                let pTotalLen = this.totalP * pScale;
                let pALen = (this.m * this.vA) * pScale;
                let pBLen = (this.m * this.vB) * pScale;

                if (this.showMomentum) {
                    ctx.fillStyle = '#263746'; ctx.font = 'bold 17px "Segoe UI", sans-serif';
                    ctx.textAlign = 'left'; ctx.fillText('動量', labelX, pY + 12);
                    ctx.textAlign = 'left';
                    this.drawArrow(pX, pY, pX + pTotalLen, pY, '#000000', 4);
                    ctx.fillStyle = '#000'; ctx.fillText('P (系統總動量)', pX + pTotalLen + 8, pY);
                    if (pALen > 2) {
                        this.drawArrow(pX, pY + 22, pX + pALen, pY + 22, '#1A5276', 4);
                        ctx.textAlign = 'center';
                        ctx.fillStyle = '#1A5276'; ctx.fillText('p₁', pX + pALen / 2, pY + 38);
                    }
                    if (pBLen > 2) {
                        this.drawArrow(pX + pALen, pY + 22, pX + pALen + pBLen, pY + 22, '#5DADE2', 4);
                        ctx.textAlign = 'center';
                        ctx.fillStyle = '#5DADE2'; ctx.fillText('p₂', pX + pALen + pBLen / 2, pY + 38);
                    }
                }
                this.drawEyeIcon(14, pY + 12, this.showMomentum);
            },

            drawEyeIcon(x, y, isVisible) {
                ctx.save();
                ctx.strokeStyle = '#52616d'; ctx.fillStyle = '#52616d'; ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x - 9, y);
                ctx.quadraticCurveTo(x, y - 8, x + 9, y);
                ctx.quadraticCurveTo(x, y + 8, x - 9, y);
                ctx.stroke();
                if (isVisible) {
                    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
                } else {
                    ctx.beginPath(); ctx.moveTo(x - 9, y + 9); ctx.lineTo(x + 9, y - 9); ctx.stroke();
                }
                ctx.restore();
            },

            isSlowMotion() {
                return this.timeSpeed < this.savedTimeSpeed;
            },

            drawPhaseClock(x, y, normalRadius, slowRadius) {
                const startAngle = -Math.PI / 2;
                const sector = Math.PI * 2 / 3;
                const colors = ['#5DADE2', '#E9A23B', '#58A987'];
                const labels = ['碰撞前到接觸', '接觸到分離', '分離後'];
                const expected = [
                    Math.max(1, ((450 - this.L0) - (50 + this.cartW)) / this.v0),
                    Math.PI / Math.sqrt(2 * this.k / this.m),
                    8
                ];
                const fraction = this.phaseClockDone ? 1 : Math.min(1, this.phaseElapsed / expected[this.phaseIndex]);
                const maxCompressionAngle = startAngle + sector + sector / 2;
                const activeRadius = isPlaying ? (this.isSlowMotion() ? slowRadius : normalRadius) : null;
                ctx.save();
                ctx.lineWidth = 10;
                ctx.lineCap = 'butt';
                [normalRadius, slowRadius].forEach(radius => {
                    for (let i = 0; i < 3; i++) {
                        const a0 = startAngle + i * sector + 0.035;
                        const a1 = startAngle + (i + 1) * sector - 0.035;
                        ctx.beginPath(); ctx.arc(x, y, radius, a0, a1);
                        ctx.strokeStyle = '#dce3e8'; ctx.stroke();
                        if (radius === activeRadius) {
                            if (this.phaseClockDone || i < this.phaseIndex) {
                                ctx.beginPath(); ctx.arc(x, y, radius, a0, a1);
                                ctx.strokeStyle = colors[i]; ctx.stroke();
                            } else if (i === this.phaseIndex && fraction > 0) {
                                ctx.beginPath(); ctx.arc(x, y, radius, a0, a0 + Math.max(0.01, fraction * (a1 - a0)));
                                ctx.strokeStyle = colors[i]; ctx.stroke();
                            }
                        }
                    }
                    ctx.beginPath();
                    ctx.moveTo(x + Math.cos(maxCompressionAngle) * (radius - 7), y + Math.sin(maxCompressionAngle) * (radius - 7));
                    ctx.lineTo(x + Math.cos(maxCompressionAngle) * (radius + 7), y + Math.sin(maxCompressionAngle) * (radius + 7));
                    ctx.strokeStyle = '#8a4b08'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.stroke();
                });
                ctx.beginPath();
                const handAngle = this.phaseClockDone ? startAngle : startAngle + this.phaseIndex * sector + fraction * sector;
                const handRadius = activeRadius || normalRadius;
                ctx.moveTo(x, y);
                ctx.lineTo(x + Math.cos(handAngle) * (handRadius - 9), y + Math.sin(handAngle) * (handRadius - 9));
                ctx.strokeStyle = colors[this.phaseIndex]; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();
                ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#34495e'; ctx.fill();
                ctx.restore();
                this.drawClockLabels(x, y, slowRadius + 17, labels, startAngle, sector);
                ctx.save();
                ctx.fillStyle = '#8a4b08'; ctx.font = 'bold 10px "Segoe UI", sans-serif';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('最大壓縮', x + slowRadius + 20, y + slowRadius - 8);
                ctx.restore();
            },

            drawClockLabels(x, y, labelRadius, labels, startAngle, sector) {
                const radius = labelRadius - 17;
                ctx.save();
                ctx.fillStyle = '#46545f';
                ctx.font = '11px "Segoe UI", sans-serif';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(labels[0], x + radius * 0.6 + 18, y - radius * 0.7);
                ctx.fillText(labels[1], x, y + labelRadius + 4);
                ctx.fillText(labels[2], x - radius - 27, y);
                ctx.font = '12px "Segoe UI", sans-serif';
                ctx.fillStyle = '#56616c';
                ctx.font = '10px "Segoe UI", sans-serif';
                ctx.restore();
            },

            loop() {
                this.update(); this.draw();
                if (isPlaying) { animationId = requestAnimationFrame(() => this.loop()); }
            }
        };

        const playBtn = document.getElementById('playBtn');
        playBtn.addEventListener('click', function() {
            isPlaying = !isPlaying;
            if (!isPlaying && sim.replayPhase !== null) {
                sim.timeSpeed = sim.savedTimeSpeed;
                sim.replayPhase = null;
            }
            this.innerHTML = isPlaying ? 'Ⅱ' : '▶';
            this.setAttribute('aria-label', isPlaying ? '暫停' : '播放');
            this.title = isPlaying ? '暫停' : '播放';
            this.style.backgroundColor = isPlaying ? '#005bb5' : '#0878d1';
            if (isPlaying) sim.loop();
            else cancelAnimationFrame(animationId);
        });

        document.getElementById('resetBtn').addEventListener('click', function() {
            pauseSimulation();
            sim.init();
        });

        const helpDialog = document.getElementById('helpDialog');
        document.getElementById('helpBtn').addEventListener('click', () => helpDialog.showModal());
        document.getElementById('closeHelpBtn').addEventListener('click', () => helpDialog.close());

        function pauseSimulation() {
            isPlaying = false;
            cancelAnimationFrame(animationId);
            if (sim.replayPhase !== null) {
                sim.timeSpeed = sim.savedTimeSpeed;
                sim.replayPhase = null;
            }
            playBtn.innerHTML = '▶';
            playBtn.setAttribute('aria-label', '播放');
            playBtn.title = '播放';
            playBtn.style.backgroundColor = '#0878d1';
        }

        function finishPhaseReplay() {
            isPlaying = false;
            cancelAnimationFrame(animationId);
            sim.timeSpeed = sim.savedTimeSpeed;
            sim.replayPhase = null;
            playBtn.innerHTML = '▶';
            playBtn.setAttribute('aria-label', '播放');
            playBtn.title = '播放';
            playBtn.style.backgroundColor = '#0878d1';
        }

        function startSlowPhase(phaseIndex) {
            pauseSimulation();
            sim.savedTimeSpeed = sim.timeSpeed;
            sim.timeSpeed = Math.max(0.02, sim.savedTimeSpeed / 4);
            sim.phaseClockDone = false;
            sim.replayPhase = phaseIndex;

            if (phaseIndex === 0) {
                sim.init();
            } else {
                const snap = sim.snapshots[phaseIndex === 1 ? 'before' : 'after'];
                sim.xA = snap.xA; sim.xB = snap.xB;
                sim.vA = snap.vA; sim.vB = snap.vB;
                sim.phaseIndex = phaseIndex;
                sim.phaseElapsed = 0;
                sim.draw();
            }
            isPlaying = true;
            playBtn.innerHTML = 'Ⅱ';
            playBtn.setAttribute('aria-label', '暫停');
            playBtn.title = '暫停';
            playBtn.style.backgroundColor = '#005bb5';
            sim.loop();
        }

        function showClosestSnapshot() {
            pauseSimulation();
            const snap = sim.snapshots.closest;
            if (!snap) return;
            sim.xA = snap.xA; sim.xB = snap.xB;
            sim.vA = snap.vA; sim.vB = snap.vB;
            sim.phaseClockDone = false;
            sim.phaseIndex = 1;
            sim.phaseElapsed = Math.PI / (2 * Math.sqrt(2 * sim.k / sim.m));
            sim.draw();
        }

        function resumeAtNormalSpeed() {
            if (sim.replayPhase !== null) pauseSimulation();
            else if (sim.isSlowMotion()) sim.timeSpeed = sim.savedTimeSpeed;
            if (isPlaying) return;
            isPlaying = true;
            playBtn.innerHTML = 'Ⅱ';
            playBtn.setAttribute('aria-label', '暫停');
            playBtn.title = '暫停';
            playBtn.style.backgroundColor = '#005bb5';
            sim.loop();
        }

        canvas.addEventListener('click', event => {
            const rect = canvas.getBoundingClientRect();
            const x = (event.clientX - rect.left) / viewScale;
            const y = (event.clientY - rect.top) / viewScale;
            if (x <= 28 && y >= 38 && y <= 78) {
                sim.showEnergy = !sim.showEnergy;
                sim.draw();
                return;
            }
            if (x <= 28 && y >= 116 && y <= 149) {
                sim.showMomentum = !sim.showMomentum;
                sim.draw();
                return;
            }
            const clockX = 690, clockY = 78;
            const dx = x - clockX, dy = y - clockY;
            const distance = Math.hypot(dx, dy);
            const smallRingHit = Math.abs(distance - 38) <= 10;
            const largeRingHit = Math.abs(distance - 58) <= 10;
            if (!smallRingHit && !largeRingHit) return;
            let angle = Math.atan2(dy, dx) + Math.PI / 2;
            angle = (angle + Math.PI * 2) % (Math.PI * 2);
            const maxCompressionAngle = Math.PI;
            const markerAngleDelta = Math.atan2(Math.sin(angle - maxCompressionAngle), Math.cos(angle - maxCompressionAngle));
            if (Math.abs(markerAngleDelta) < 0.18) {
                showClosestSnapshot();
                return;
            }
            const phaseIndex = Math.floor(angle / (Math.PI * 2 / 3));
            if (largeRingHit && (!smallRingHit || Math.abs(distance - 58) < Math.abs(distance - 38))) {
                startSlowPhase(phaseIndex);
            } else {
                resumeAtNormalSpeed();
            }
        });

        canvas.addEventListener('pointermove', event => {
            const rect = canvas.getBoundingClientRect();
            const x = (event.clientX - rect.left) / viewScale;
            const y = (event.clientY - rect.top) / viewScale;
            const clockDistance = Math.hypot(x - 690, y - 78);
            const overIcon = x <= 28 && ((y >= 38 && y <= 78) || (y >= 116 && y <= 149));
            const overClockRing = Math.abs(clockDistance - 38) <= 10 || Math.abs(clockDistance - 58) <= 10;
            canvas.style.cursor = overIcon || overClockRing ? 'pointer' : 'default';
        });

        const resizeAndDraw = () => { if (resizeCanvasResolution()) sim.draw(); };
        const canvasResizeObserver = 'ResizeObserver' in window ? new ResizeObserver(resizeAndDraw) : null;
        if (canvasResizeObserver) { canvasResizeObserver.observe(container); canvasResizeObserver.observe(controls); }
        window.addEventListener('resize', resizeAndDraw);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', resizeAndDraw);
        sim.init();
    </script>
</div>
</body>
</html>
