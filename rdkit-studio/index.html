<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RDKit SVG Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="loadingScreen" class="loading-screen" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="loading-icon" aria-hidden="true">&#9883;</div>
      <strong>準備 RDKit 化學繪圖</strong>
      <p id="loadingPhase">正在下載繪圖核心（約 6.9 MB）</p>
      <progress id="wasmProgress" max="6913251" value="0"></progress>
      <p id="loadingAmount">0.0 / 6.9 MB（0%）</p>
      <button id="retryLoading" type="button" hidden>重新載入</button>
    </div>
  </div>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">&#9883;</span>
        <div><strong>化學結構圖工作台</strong><small>高中化學&#183;教學工具</small></div>
      </div>
      <div class="top-actions">
        <div class="status-wrap"><span id="statusDot" class="status-dot"></span><span id="statusText">RDKit 載入中</span></div>
        <button id="openGallery" class="gallery-button" type="button">&#x7bc4;&#x4f8b;&#x5eab;</button>
      </div>
    </header>

    <main>
      <section class="workspace-grid" aria-label="輸入與預覽工作區">
        <div class="editor-column">
        <section class="panel editor-panel">
          <div class="structure-entry">
            <label for="structureInput">輸入 SMILES、化學式或名稱</label>
            <input id="structureInput" type="text" autocomplete="off" placeholder="例如：CCO、C2H6O、乙醇、苯">
            <small>可輸入常用名稱、示性式或 SMILES；分子式有多個已收錄結構時會請你選擇。</small>
          </div>
          <textarea id="codeInput" hidden aria-hidden="true"></textarea>
          <div class="quick-row">
            <span>快速載入</span>
            <button type="button" data-code="benzene">苯</button>
            <button type="button" data-code="caffeine">咖啡因</button>
            <button type="button" data-code="aspirin">阿斯匹靈</button>
            <button type="button" data-code="dna">腺嘌呤</button>
          </div>
          <div class="quick-row chiral-samples" aria-label="立體化學範例">
            <span>手性範例</span>
            <button type="button" data-smiles="C[C@@H](O)C(=O)O" data-label="(R)-乳酸">(R)-乳酸</button>
            <button type="button" data-smiles="C[C@H](O)C(=O)O" data-label="(S)-乳酸">(S)-乳酸</button>
            <button type="button" data-smiles="C[C@H](N)C(=O)O" data-label="L-丙胺酸">L-丙胺酸</button>
            <button type="button" data-smiles="O=C1CC[C@H](N2C(=O)c3ccccc3C2=O)C(=O)N1" data-label="手性沙利竇邁">手性沙利竇邁</button>
            <button type="button" data-smiles="F/C=C/F" data-label="(E)-二氟乙烯">(E)-二氟乙烯</button>
          </div>
          <div class="action-row">
            <button id="renderButton" class="primary-button" type="button" disabled><span aria-hidden="true">&#9654;</span> 編譯 SVG</button>
            <span class="shortcut">輸入後按此按鈕編譯</span>
          </div>
          <div id="errorBox" class="error-box" role="alert"></div>
          <div id="candidateList" class="candidate-list" aria-label="結構候選" hidden></div>
        </section>

        <section class="style-strip" aria-label="圖像樣式">
          <div class="style-group"><strong>樣式預設</strong><div class="segmented" role="group" aria-label="樣式預設">
            <button type="button" data-preset="standard" aria-pressed="true">標準</button>
            <button type="button" data-preset="acs" aria-pressed="false" title="ACS 圖稿規格的近似預設；請依期刊要求檢查最終輸出">ACS 參考</button>
            <button type="button" data-preset="teaching" aria-pressed="false">教學簡化</button>
          </div></div>
          <div class="style-group beauty-group"><strong>結構排版</strong><label class="mini-switch" title="使用 CoordGen 產生 2D 結構座標"><input id="coordGenInput" type="checkbox" checked><i></i> 結構美化</label></div>
          <div class="style-group"><strong>顏色</strong><div class="segmented" role="group" aria-label="顏色模式">
            <button type="button" data-color="color" aria-pressed="true">彩色</button>
            <button type="button" data-color="mono" aria-pressed="false">黑白</button>
          </div></div>
          <div class="style-group"><strong>氫原子</strong><div class="segmented" role="group" aria-label="氫原子顯示">
            <button type="button" data-hydrogens="implicit" aria-pressed="false">隱藏</button>
            <button type="button" data-hydrogens="hetero" aria-pressed="true">雜原子</button>
            <button type="button" data-hydrogens="all" aria-pressed="false">全部</button>
          </div></div>
          <div class="style-group"><strong>碳原子</strong><div class="segmented" role="group" aria-label="碳原子顯示">
            <button type="button" data-carbons="hide" aria-pressed="true" title="隱藏碳符號，保留骨架線">隱藏</button>
            <button type="button" data-carbons="show" aria-pressed="false">顯示</button>
          </div></div>
          <div class="style-group"><strong>立體鍵表示</strong><div class="segmented" role="group" aria-label="立體鍵與 R/S、E/Z 標註">
            <button type="button" data-stereo="wedge" aria-pressed="true" title="用實心楔形與虛線楔形表示立體方向">楔形鍵</button>
            <button type="button" data-stereo="both" aria-pressed="false" title="保留楔形鍵，並加上 R/S、E/Z 標註">楔形＋標註</button>
            <button type="button" data-stereo="labels" aria-pressed="false" title="將楔形鍵改為普通線段，以 R/S、E/Z 文字標示立體組態">文字標註</button>
          </div></div>
          <div class="style-group"><strong>末端甲基</strong><div class="segmented" role="group" aria-label="末端甲基顯示">
            <button type="button" data-methyl="skeletal" aria-pressed="true">骨架折線</button>
            <button type="button" data-methyl="explicit" aria-pressed="false">顯式 CH₃</button>
          </div></div>
          <div class="style-group"><strong>鍵粗細</strong><div class="segmented" role="group" aria-label="鍵粗細">
            <button type="button" data-bond="1.0" aria-pressed="false">細</button>
            <button type="button" data-bond="1.4" aria-pressed="true">標準</button>
            <button type="button" data-bond="2.0" aria-pressed="false">加粗</button>
          </div></div>
          <input id="bondInput" type="hidden" value="1.4"><output id="bondOutput" hidden>1.4</output>
          <input id="colorInput" type="checkbox" checked hidden>
          <input id="carbonInput" type="checkbox" hidden>
          <label class="mini-switch"><input id="condensedInput" type="checkbox"><i></i> 示性式</label>
          <label class="mini-switch"><input id="indexInput" type="checkbox"><i></i> 原子編號</label>
        </section>
        </div>

        <section class="panel preview-panel">
          <div class="panel-head">
            <div><strong>輸出預覽</strong></div>
            <div class="output-actions">
              <div class="segmented" role="group" aria-label="輸出格式">
                <button type="button" data-format="png" aria-pressed="true">PNG</button>
                <button type="button" data-format="svg" aria-pressed="false" title="適合以圖片插入支援 SVG 的 Word 或 PowerPoint">SVG</button>
              </div>
              <div id="dpiButtons" class="segmented" role="group" aria-label="PNG 解析度">
                <button type="button" data-dpi="300" aria-pressed="true">300 DPI</button>
                <button type="button" data-dpi="600" aria-pressed="false">600 DPI</button>
              </div>
              <input id="dpiInput" type="hidden" value="300">
              <button id="copyOutput" class="icon-button" type="button" disabled>&#128203; 複製 PNG</button>
              <button id="downloadOutput" class="download-button" type="button" disabled>&#11015; 下載 PNG</button>
            </div>
          </div>
          <div class="output-settings" aria-label="貼入文件尺寸與背景">
            <div class="style-group"><strong>插入文件寬度</strong><div class="segmented" role="group" aria-label="插入文件寬度">
              <button type="button" data-width="4" aria-pressed="false">小 4 cm</button>
              <button type="button" data-width="7" aria-pressed="true">中 7 cm</button>
              <button type="button" data-width="10" aria-pressed="false">大 10 cm</button>
            </div></div>
            <label class="custom-width" for="widthCm">自訂 <input id="widthCm" type="number" min="3" max="12" step="0.5" value="7"> cm</label>
            <span id="autoHeightHint" class="size-hint">高度依結構比例自動調整</span>
            <div class="style-group background-choice"><strong>輸出背景</strong><div class="segmented" role="group" aria-label="輸出背景">
              <button type="button" data-background="transparent" aria-pressed="true">透明</button>
              <button type="button" data-background="white" aria-pressed="false">白色</button>
            </div></div>
            <input id="transparentInput" type="checkbox" checked hidden>
          </div>
          <div class="transform-toolbar" role="group" aria-label="排版與手性操作">
            <span>排版</span>
            <button id="rotateLeft" type="button" title="逆時針旋轉 90 度">↺ 左轉 90°</button>
            <button id="rotateRight" type="button" title="順時針旋轉 90 度">↻ 右轉 90°</button>
            <button id="flipHorizontal" type="button" aria-pressed="false">↔ 水平鏡射</button>
            <button id="flipVertical" type="button" aria-pressed="false">↕ 垂直鏡射</button>
            <button id="resetTransform" type="button">重設</button>
            <i aria-hidden="true"></i>
            <button id="invertChirality" class="chirality-action" type="button" title="產生對映異構物，將所有已指定的 R/S 手性中心反轉；E/Z 不變" disabled>⇌ 手性反轉 (R↔S)</button>
          </div>
          <div id="previewStage" class="preview-stage">
            <div class="empty-state"><div class="orbit" aria-hidden="true">&#9883;</div><strong>等待編譯</strong><p>輸入結構或選擇範例後按下編譯。</p></div>
          </div>
          <div class="meta-row" aria-label="分子資訊">
            <div class="meta-identity"><strong id="metaName">—</strong><span id="metaStereo" class="stereo-badge">—</span></div>
            <button id="copyFormula" class="formula-copy" type="button" title="複製分子式" aria-label="複製分子式" disabled><span id="metaFormula">—</span><span aria-hidden="true"> ⧉</span></button>
            <span id="metaWeight">MW: —</span>
            <span id="metaSize">—</span>
          </div>
        </section>
      </section>


    </main>

    <div id="drawerBackdrop" class="drawer-backdrop"></div>
    <aside id="galleryDrawer" class="gallery-drawer" aria-hidden="true" aria-label="範例庫">
      <div class="drawer-head"><div><h2 id="drawerTitle">教學範例庫</h2><p class="section-copy">點選範例即可產生結構圖。</p></div><button id="closeGallery" class="icon-button" type="button" aria-label="關閉">關閉</button></div>
      <section id="galleryView" class="drawer-view">
        <div id="drawerSubjectTabs" class="subject-tabs drawer-tabs">
          <button class="active" type="button" data-subject="全部">全部</button>
          <button type="button" data-subject="無機">無機</button>
          <button type="button" data-subject="有機">有機</button>
        </div>
        <div id="categoryFilter" class="category-filter"></div>
        <div id="galleryGrid" class="gallery-grid"></div>
      </section>
    </aside>
  </div>
  <script src="vendor/RDKit_minimal.js"></script>
  <script src="renderer.js"></script>
  <script src="script.js"></script>
</body>
</html>
