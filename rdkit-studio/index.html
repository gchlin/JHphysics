<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RDKit SVG Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="loadingScreen" class="loading-screen" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="loading-icon" aria-hidden="true">&#9883;</div>
      <strong>準備 RDKit 化學繪圖</strong>
      <p id="loadingPhase">正在下載繪圖核心（約 6.9 MB）</p>
      <progress id="wasmProgress" max="6913251" value="0"></progress>
      <p id="loadingAmount">0.0 / 6.9 MB（0%）</p>
      <button id="retryLoading" type="button" hidden>重新載入</button>
    </div>
  </div>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">&#9883;</span>
        <div><strong>化學結構圖</strong></div>
      </div>
      <div class="top-actions">
        <div class="status-wrap"><span id="statusDot" class="status-dot"></span><span id="statusText">RDKit 載入中</span></div>
        <button id="openGallery" class="gallery-button" type="button" title="開啟範例庫">▦ 範例庫</button>
      </div>
    </header>

    <main>
      <section class="workspace-grid" aria-label="輸入與預覽工作區">
        <div class="editor-column">
        <section class="panel editor-panel">
          <div class="editor-heading"><strong>結構輸入</strong><span>名稱 · 示性式 · SMILES</span></div>
          <div class="structure-entry">
            <label for="structureInput" class="sr-only">輸入 SMILES、化學式或名稱</label>
            <div class="input-line">
              <input id="structureInput" type="text" autocomplete="off" placeholder="乙醇 / CH3CH2OH / CCO">
              <button id="renderButton" class="primary-button" type="button" disabled>繪製</button>
            </div>
          </div>
          <textarea id="codeInput" hidden aria-hidden="true"></textarea>
          <div class="quick-row">
            <span>快速載入</span>
            <button type="button" data-code="benzene">苯</button>
            <button type="button" data-code="caffeine">咖啡因</button>
            <button type="button" data-code="adenine">腺嘌呤</button>
            <button type="button" data-smiles="C[C@H](O)C(=O)O" data-label="(S)-乳酸">(S)-乳酸</button>
          </div>
          <div id="errorBox" class="error-box" role="alert"></div>
          <div id="candidateList" class="candidate-list" aria-label="結構候選" hidden></div>
        </section>

        <section class="style-strip" aria-label="圖像樣式">
          <div class="style-title"><strong>圖像樣式</strong><span>即時套用</span></div>
          <div class="control-row"><div class="style-group" title="試用苯，比較標準、ACS 參考與教學簡化的線條與字體"><strong>預設</strong><div class="segmented" role="group" aria-label="樣式預設">
            <button type="button" data-preset="standard" aria-pressed="true">標準</button>
            <button type="button" data-preset="acs" aria-pressed="false" title="ACS 圖稿規格的近似預設；請依期刊要求檢查最終輸出">ACS 參考</button>
            <button type="button" data-preset="teaching" aria-pressed="false">教學簡化</button>
          </div></div>
          <div class="style-group beauty-group"><strong>排版</strong><label class="mini-switch" title="使用咖啡因比較 CoordGen 結構美化前後的座標排版"><input id="coordGenInput" type="checkbox" checked><i></i> 美化</label></div></div>
          <div class="control-row"><div class="style-group" title="試用咖啡因，比較氧、氮原子的彩色與純黑標示"><strong>顏色</strong><div class="segmented" role="group" aria-label="顏色模式">
            <button type="button" data-color="color" aria-pressed="true">彩色</button>
            <button type="button" data-color="mono" aria-pressed="false">黑白</button>
          </div></div>
          <div class="style-group" title="試用苯，比較化學鍵的細、標準與加粗線條"><strong>鍵粗</strong><div class="segmented" role="group" aria-label="鍵粗細">
            <button type="button" data-bond="1.0" aria-pressed="false">細</button>
            <button type="button" data-bond="1.4" aria-pressed="true">標準</button>
            <button type="button" data-bond="2.0" aria-pressed="false">粗</button>
          </div></div></div>
          <div class="control-row"><div class="style-group" title="試用 (S)-乳酸，比較羥基氫與所有氫原子的顯示方式"><strong>氫</strong><div class="segmented" role="group" aria-label="氫原子顯示">
            <button type="button" data-hydrogens="implicit" aria-pressed="false">隱藏</button>
            <button type="button" data-hydrogens="hetero" aria-pressed="true">雜原子</button>
            <button type="button" data-hydrogens="all" aria-pressed="false">全部</button>
          </div></div>
          <div class="style-group" title="試用苯，比較骨架線與明示 C 原子"><strong>碳</strong><div class="segmented" role="group" aria-label="碳原子顯示">
            <button type="button" data-carbons="hide" aria-pressed="true" title="隱藏碳符號，保留骨架線">隱藏</button>
            <button type="button" data-carbons="show" aria-pressed="false">顯示</button>
          </div></div></div>
          <div class="control-row"><div class="style-group"><strong>立體鍵</strong><div class="segmented" role="group" aria-label="立體鍵與 R/S、E/Z 標註">
            <button type="button" data-stereo="wedge" aria-pressed="true" title="試用 (S)-乳酸：以實心與虛線楔形鍵表示立體方向">楔形鍵</button>
            <button type="button" data-stereo="both" aria-pressed="false" title="試用 (S)-乳酸：同時顯示楔形鍵與 R/S 標註">楔形＋字</button>
            <button type="button" data-stereo="labels" aria-pressed="false" title="試用 (S)-乳酸：以 R/S 文字取代楔形鍵">文字</button>
          </div></div>
          <div class="style-group" title="試用 (S)-乳酸，比較骨架末端與 CH₃ 標籤"><strong>甲基</strong><div class="segmented" role="group" aria-label="末端甲基顯示">
            <button type="button" data-methyl="skeletal" aria-pressed="true">骨架</button>
            <button type="button" data-methyl="explicit" aria-pressed="false">CH₃</button>
          </div></div></div>
          <input id="bondInput" type="hidden" value="1.4"><output id="bondOutput" hidden>1.4</output>
          <input id="colorInput" type="checkbox" checked hidden>
          <input id="carbonInput" type="checkbox" hidden>
          <div class="control-row extra-row"><strong>附加</strong><label class="mini-switch" title="試用咖啡因，在原子旁標出編號"><input id="indexInput" type="checkbox"><i></i> 原子編號</label></div>
        </section>
        </div>

        <section class="panel preview-panel">
          <div class="panel-head">
            <div><strong>預覽</strong></div>
            <div class="output-actions">
              <div class="segmented" role="group" aria-label="輸出格式">
                <button type="button" data-format="png" aria-pressed="true">PNG</button>
                <button type="button" data-format="svg" aria-pressed="false" title="適合以圖片插入支援 SVG 的 Word 或 PowerPoint">SVG</button>
              </div>
              <div id="dpiButtons" class="segmented" role="group" aria-label="PNG 解析度">
                <button type="button" data-dpi="300" aria-pressed="true">300 DPI</button>
                <button type="button" data-dpi="600" aria-pressed="false">600 DPI</button>
              </div>
              <input id="dpiInput" type="hidden" value="300">
              <button id="copyOutput" class="icon-button" type="button" title="複製 PNG" aria-label="複製 PNG" disabled>⧉</button>
              <button id="downloadOutput" class="download-button" type="button" title="下載 PNG" aria-label="下載 PNG" disabled>↓ 下載</button>
            </div>
          </div>
          <div class="output-settings" aria-label="貼入文件尺寸與背景">
            <div class="style-group"><strong>尺寸</strong><div class="segmented" role="group" aria-label="尺寸模式">
              <button type="button" data-size-mode="height" aria-pressed="true" title="鎖定畫布高度；適合 Word／PPT 講義排版">固定高度</button>
              <button type="button" data-size-mode="bond" aria-pressed="false" title="固定實際鍵長與文字大小；畫布寬高隨分子變化">固定鍵長</button>
            </div></div>
            <div id="heightControls" class="size-choices">
              <div class="segmented" role="group" aria-label="固定畫布高度">
                <button type="button" data-height="2" aria-pressed="false" title="2 cm：小圖／選擇題">2</button>
                <button type="button" data-height="5" aria-pressed="true" title="5 cm：標準／大題預設">5</button>
                <button type="button" data-height="10" aria-pressed="false" title="10 cm：大型／海報展示">10</button>
              </div>
              <label for="heightCm"><input id="heightCm" type="number" min="1" max="30" step="0.1" value="5" aria-label="自訂畫布高度"> cm</label>
            </div>
            <div id="bondControls" class="size-choices" hidden>
              <div class="segmented" role="group" aria-label="固定鍵長比例">
                <button type="button" data-scale="40" aria-pressed="false" title="40%：標準鍵長縮至 0.20 cm">40%</button>
                <button type="button" data-scale="100" aria-pressed="true" title="100%：鍵長 0.508 cm，參考 ACS 圖稿規格">100%</button>
                <button type="button" data-scale="200" aria-pressed="false" title="200%：鍵長放大至 1.016 cm">200%</button>
              </div>
              <label for="scalePercent"><input id="scalePercent" type="number" min="20" max="300" step="10" value="100" aria-label="自訂鍵長比例"> %</label>
            </div>
            <span id="autoSizeHint" class="size-hint" aria-live="polite">自動寬度：—</span>
            <div class="style-group background-choice"><strong>背景</strong><div class="segmented" role="group" aria-label="輸出背景">
              <button type="button" data-background="transparent" aria-pressed="true">透明</button>
              <button type="button" data-background="white" aria-pressed="false">白色</button>
            </div></div>
            <input id="transparentInput" type="checkbox" checked hidden>
          </div>
          <div class="transform-toolbar" role="group" aria-label="排版與手性操作">
            <span>排版</span>
            <button id="rotateLeft" type="button" title="左轉 90°" aria-label="左轉 90°">↺ 90°</button>
            <button id="rotateRight" type="button" title="右轉 90°" aria-label="右轉 90°">↻ 90°</button>
            <button id="flipHorizontal" type="button" title="水平鏡射" aria-label="水平鏡射" aria-pressed="false">↔</button>
            <button id="flipVertical" type="button" title="垂直鏡射" aria-label="垂直鏡射" aria-pressed="false">↕</button>
            <button id="resetTransform" type="button" title="重設排版">重設</button>
            <i aria-hidden="true"></i>
            <button id="invertChirality" class="chirality-action" type="button" title="產生對映異構物，將所有已指定的 R/S 手性中心反轉；E/Z 不變" disabled>⇌ R↔S</button>
          </div>
          <div id="previewStage" class="preview-stage">
            <div class="empty-state"><div class="orbit" aria-hidden="true">&#9883;</div><strong>等待編譯</strong><p>輸入結構或選擇範例後按下編譯。</p></div>
          </div>
          <div class="meta-row" aria-label="分子資訊">
            <div class="meta-identity"><strong id="metaName">—</strong><span id="metaStereo" class="stereo-badge">—</span></div>
            <button id="copyFormula" class="formula-copy" type="button" title="複製 Word 公式" aria-label="複製 Word 公式" disabled><span id="metaFormula">—</span><span aria-hidden="true"> ⧉</span></button>
            <span id="metaWeight">MW: —</span>
            <span id="metaSize">—</span>
          </div>
        </section>
      </section>


    </main>

    <div id="drawerBackdrop" class="drawer-backdrop"></div>
    <aside id="galleryDrawer" class="gallery-drawer" aria-hidden="true" aria-label="範例庫">
      <div class="drawer-head"><div><h2 id="drawerTitle">教學範例庫</h2><p class="section-copy">點選範例即可產生結構圖。</p></div><button id="closeGallery" class="icon-button" type="button" aria-label="關閉">關閉</button></div>
      <section id="galleryView" class="drawer-view">
        <div id="drawerSubjectTabs" class="subject-tabs drawer-tabs">
          <button class="active" type="button" data-subject="全部">全部</button>
          <button type="button" data-subject="無機">無機</button>
          <button type="button" data-subject="有機">有機</button>
        </div>
        <div id="categoryFilter" class="category-filter"></div>
        <div id="galleryGrid" class="gallery-grid"></div>
      </section>
    </aside>
  </div>
  <script src="vendor/RDKit_minimal.js"></script>
  <script src="renderer.js"></script>
  <script src="script.js"></script>
</body>
</html>
